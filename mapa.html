     Nowy konflikt = nowy plik JSON, bez ruszania tej strony. Mapa: Leaflet + kafle Esri Gray (bez klucza, jasne/ciemne

<script>
(function(){
  var t=localStorage.getItem('brifup_theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name="theme-color"]');

<style>
:root { --bg:#fff; --text:#111; --sub:#333; --muted:#8a8a8a; --rule:#e2e2e2; --red:#e01f0f; --soft:#faf9f7; --node:#c9c9c9;
        --k-tlo:#8a8a8a; --k-atak:#e01f0f; --k-zdobycie:#b91c1c; --k-dyplomacja:#2563eb; --k-rynek:#d97706;
        /* Mapa wojny hybrydowej (15.09): rodzaje incydentów */
        --k-kolej:#b91c1c; --k-podpalenie:#ea580c; --k-wybuch:#9f1239; --k-dron:#e01f0f; --k-niebo:#7c3aed;
        --k-cyber:#0e7490; --k-morze:#1d4ed8; --k-gps:#a16207; --k-agenci:#4b5563; }
:root[data-theme="dark"] { --bg:#0f0f0f; --text:#f2f2f2; --sub:#cfcfcf; --muted:#8a8a8a; --rule:#2e2e2e; --soft:#1a1a1a; --node:#4a4a4a;
        --k-dyplomacja:#60a5fa; --k-rynek:#fbbf24; --k-zdobycie:#f87171;
        --k-kolej:#f87171; --k-podpalenie:#fb923c; --k-wybuch:#fb7185; --k-dron:#ff5a4e; --k-niebo:#a78bfa;
        --k-cyber:#22d3ee; --k-morze:#60a5fa; --k-gps:#facc15; --k-agenci:#9ca3af; }
* { box-sizing:border-box; margin:0; }
html,body { background:var(--bg); color:var(--text); }
body { font-family:'Space Mono',monospace; }
a { color:inherit; }
.top { display:flex; align-items:baseline; justify-content:space-between; padding:14px 16px 10px; border-bottom:3px solid var(--text); max-width:1100px; margin:0 auto; }
.logo { font-family:'DM Serif Display',serif; font-size:22px; text-decoration:none; color:var(--text); }
.logo b { color:var(--red); font-weight:400; }
.top-date { font-size:9px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
.page-head { padding:18px 16px 10px; max-width:1100px; margin:0 auto; }
.kicker { font-size:9px; letter-spacing:2px; color:var(--red); text-transform:uppercase; font-weight:700; }
h1 { font-family:'DM Serif Display',serif; font-style:italic; font-size:34px; margin-top:2px; line-height:1.1; }
.lead { font-size:11px; color:var(--muted); line-height:1.6; margin-top:8px; max-width:560px; }

/* Układ: mobile = mapa przyklejona u góry, kroki pod nią; desktop = kroki po lewej, mapa po prawej na całą wysokość. */
.story { max-width:1100px; margin:0 auto; position:relative; }
.mapwrap { position:sticky; top:0; height:46vh; z-index:2; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); background:var(--soft); }
#map { width:100%; height:100%; }
.steps { padding:0 16px 40vh; }
.step { min-height:44vh; display:flex; align-items:center; }
.card { border-left:3px solid var(--node); padding:10px 0 10px 14px; opacity:.35; transition:opacity .35s, border-color .35s; max-width:520px; }
.step.active .card { opacity:1; border-color:var(--red); }
.when { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); display:flex; gap:8px; align-items:center; }
.when .kind { font-weight:700; }
.kind[data-k="tlo"] { color:var(--k-tlo); } .kind[data-k="atak"] { color:var(--k-atak); } .kind[data-k="zdobycie"] { color:var(--k-zdobycie); }
.kind[data-k="dyplomacja"] { color:var(--k-dyplomacja); } .kind[data-k="rynek"] { color:var(--k-rynek); } .kind[data-k="mapa"] { color:var(--text); }
/* Pewność przypisania (mapa hybrydowa, 15.09, życzenie właściciela: „niepewne oznacz”) — etykieta na karcie i kształt markera */
.przyp { display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-size:9.5px; letter-spacing:1px; text-transform:uppercase; padding:3px 8px 3px 6px; border:1px solid var(--rule); color:var(--sub); }
.przyp i { width:9px; height:9px; border-radius:50%; display:inline-block; flex:0 0 auto; }
.przyp[data-p="rosja"] { border-color:var(--red); color:var(--red); font-weight:700; } .przyp[data-p="rosja"] i { background:var(--red); }
.przyp[data-p="podejrzenie"] i { box-shadow:inset 0 0 0 2px var(--red); }
.przyp[data-p="nieustalony"] { color:var(--muted); } .przyp[data-p="nieustalony"] i { box-shadow:inset 0 0 0 2px var(--muted); }
.przyp[data-p="dementi"] { color:var(--muted); text-decoration:line-through; }
.przyp { flex-wrap:wrap; row-gap:3px; }
.przyp em { font-style:normal; font-weight:400; text-transform:none; letter-spacing:0; flex-basis:100%; padding-left:15px; color:var(--sub); }
.legend .pw { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:-1px; margin-right:3px; }
.cta { display:block; margin-top:18px; padding:16px 16px 14px; background:var(--red); color:#fff; text-decoration:none; border-radius:2px; }
.cta b { display:block; font-family:'DM Serif Display',serif; font-weight:400; font-size:22px; line-height:1.15; }
.cta span { display:block; font-size:11px; line-height:1.5; margin-top:6px; opacity:.92; }
.cta em { display:block; font-style:normal; font-size:10px; letter-spacing:2px; text-transform:uppercase; font-weight:700; margin-top:12px; }
.cta:hover { filter:brightness(1.08); }
/* Krok końcowy: markery z numerami czytelne, etykiety schowane (przy szerokim kadrze nachodzą na siebie) */
body.calosc .lbl { opacity:0 !important; }
body.calosc .mk.past { background:var(--red); color:#fff; box-shadow:0 0 0 1px var(--red); }
:root[data-theme="dark"] body.calosc .mk.past { background:#fff; color:#111; box-shadow:0 0 0 2px var(--red); }
.place { font-size:10px; color:var(--sub); margin-top:4px; }
.card h2 { font-family:'DM Serif Display',serif; font-size:21px; line-height:1.2; margin-top:4px; }
.card p { font-size:12.5px; line-height:1.55; color:var(--sub); margin-top:8px; }
.why { margin-top:10px; padding:8px 10px; background:var(--soft); border:1px solid var(--rule); font-size:11px; line-height:1.5; color:var(--sub); }
.why b { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--red); display:block; margin-bottom:3px; }
.legend { padding:14px 16px 30px; max-width:1100px; margin:0 auto; font-size:10px; color:var(--muted); line-height:1.7; border-top:1px solid var(--rule); }
.legend a { color:var(--sub); }

@media (min-width:900px) {
  .story { display:grid; grid-template-columns:440px 1fr; }
  .mapwrap { order:2; height:100vh; border:0; border-left:1px solid var(--rule); }
  .steps { order:1; padding:10vh 24px 40vh 16px; }
  .step { min-height:60vh; }
}

/* Markery */
.mk { width:14px; height:14px; border-radius:50%; background:var(--red); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--red);
      display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; color:#fff; transition:transform .3s, opacity .3s; }
.mk.past { background:var(--node); box-shadow:0 0 0 1px var(--node); color:var(--text); }
.mk.now { transform:scale(1.7); z-index:1000; animation:pulse 1.6s infinite; }
.mk.also { background:transparent; border:2px solid var(--red); box-shadow:none; }
.mk.pw-podejrzenie, body.calosc .mk.past.pw-podejrzenie { background:var(--bg); color:var(--red); box-shadow:0 0 0 2px var(--red); }
.mk.past.pw-podejrzenie { background:var(--bg); color:var(--text); box-shadow:0 0 0 2px var(--node); }
.mk.pw-nieustalony, .mk.past.pw-nieustalony, body.calosc .mk.past.pw-nieustalony { background:var(--bg); color:var(--muted); box-shadow:0 0 0 2px var(--muted); }
@keyframes pulse { 0%{box-shadow:0 0 0 1px var(--red);} 70%{box-shadow:0 0 0 10px rgba(224,31,15,0);} 100%{box-shadow:0 0 0 1px var(--red);} }
.lbl { cursor:pointer; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.5px; color:var(--text); background:var(--bg); padding:1px 5px; border:1px solid var(--rule); white-space:nowrap; opacity:.9; }
.leaflet-container { background:var(--soft); font-family:'Space Mono',monospace; }
.leaflet-control-attribution { font-size:8px !important; }

/* Motyw ciemny (wybór właściciela 11.09: „Gazeta” przy dziennym, „Noc” przy nocnym): białe markery
   z czerwonym pierścieniem, etykiety na ciemnym tle. Podkład dobierany w JS po data-theme. */
:root[data-theme="dark"] .mk { background:#fff; color:#111; box-shadow:0 0 0 2px var(--red); border-color:#fff; }
:root[data-theme="dark"] .mk.past { background:#9a9a9a; box-shadow:0 0 0 1px #9a9a9a; color:#111; }
:root[data-theme="dark"] .lbl { background:rgba(20,20,20,.85); color:#fff; border-color:#444; }
:root[data-theme="dark"] .mk.pw-podejrzenie, :root[data-theme="dark"] body.calosc .mk.past.pw-podejrzenie { background:#0f0f0f; color:#fff; box-shadow:0 0 0 2px var(--red); }
:root[data-theme="dark"] .mk.past.pw-podejrzenie { background:#0f0f0f; color:#ddd; box-shadow:0 0 0 2px #9a9a9a; }
:root[data-theme="dark"] .mk.pw-nieustalony, :root[data-theme="dark"] .mk.past.pw-nieustalony, :root[data-theme="dark"] body.calosc .mk.past.pw-nieustalony { background:#0f0f0f; color:#9a9a9a; box-shadow:0 0 0 2px #9a9a9a; }
:root[data-theme="dark"] .leaflet-control-attribution { background:rgba(0,0,0,.5); color:#aaa; }

/* Podpowiedź „przewijaj” — bez niej czytelnik widzi mapę i jeden post i myśli, że to wszystko. Znika po pierwszym przewinięciu. */
.hint { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:1050; background:var(--text); color:var(--bg); font-size:9px; letter-spacing:2px; text-transform:uppercase; padding:7px 12px; border-radius:20px; display:flex; align-items:center; gap:8px; pointer-events:none; transition:opacity .4s; box-shadow:0 4px 14px rgba(0,0,0,.25); }
.hint svg { width:12px; height:12px; animation:bob 1.2s infinite; }
.hint.off { opacity:0; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
.progress { position:absolute; left:0; top:0; height:3px; background:var(--red); z-index:1050; width:0; transition:width .3s; }

/* Nakładka powitalna: „tu się przewija”. Ręka z palcem jedzie w górę (telefon), na PC kółko myszy.
   Znika przy pierwszym przewinięciu/dotknięciu albo po 6 s — zostaje mała pastylka .hint. */
.intro { position:absolute; inset:0; z-index:1100; /* nad panami Leafleta (markery 600, tooltipy 650) */ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,.45); color:#fff; text-align:center; padding:20px; transition:opacity .5s; cursor:pointer; }
.intro.off { opacity:0; pointer-events:none; }
.intro .big { font-family:'DM Serif Display',serif; font-size:24px; line-height:1.15; text-shadow:0 2px 10px rgba(0,0,0,.6); max-width:300px; }
.intro .small { font-size:10px; letter-spacing:2px; text-transform:uppercase; opacity:.85; }
.intro .hand { width:64px; height:64px; animation:swipe 1.6s ease-in-out infinite; filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
.intro .mouse { display:none; width:28px; height:44px; border:2px solid #fff; border-radius:14px; position:relative; }
.intro .mouse::after { content:''; position:absolute; left:50%; top:8px; width:4px; height:8px; margin-left:-2px; background:#fff; border-radius:2px; animation:wheel 1.4s infinite; }
@keyframes swipe { 0%{transform:translateY(22px);opacity:0} 20%{opacity:1} 70%{transform:translateY(-22px);opacity:1} 100%{transform:translateY(-22px);opacity:0} }
@keyframes wheel { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(14px);opacity:0} }
@media (hover:hover) and (pointer:fine) { .intro .hand { display:none; } .intro .mouse { display:block; } }
/* Pierwsza karta wystaje spod mapy na telefonie — widać, że pod mapą coś jest. */
.steps .step:first-child { min-height:auto; padding-top:14px; }

/* Rozdziały (mapa Iranu): nagłówek rozdziału jako osobna karta + pasek rozdziałów nad mapą */
.chapters { position:absolute; left:0; right:0; top:3px; z-index:1050; display:flex; gap:4px; padding:6px 8px; overflow-x:auto; scrollbar-width:none; pointer-events:auto; }
.chapters::-webkit-scrollbar { display:none; }
.chapters button { flex:0 0 auto; font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:1px; text-transform:uppercase; padding:5px 9px; border:1px solid var(--rule); background:var(--bg); color:var(--muted); cursor:pointer; border-radius:12px; }
.chapters button.on { border-color:var(--red); color:var(--red); font-weight:700; }
.chapters button.done { color:var(--text); }
.chapters .tog { flex:0 0 auto; font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:1px; text-transform:uppercase; padding:5px 9px; border:1px solid var(--text); background:var(--text); color:var(--bg); border-radius:12px; text-decoration:none; margin-left:auto; white-space:nowrap; }
.when .roz { margin-left:auto; color:var(--muted); font-weight:400; letter-spacing:1px; text-align:right; }
.card.chapter { border-left:0; padding-left:0; border-top:3px solid var(--text); padding-top:12px; }
.step.active .card.chapter { border-color:var(--red); }
.card.chapter .kicker { font-size:9px; letter-spacing:2px; color:var(--red); text-transform:uppercase; font-weight:700; }
.card.chapter h2 { font-size:30px; font-style:italic; margin-top:4px; }
.card.chapter p { font-size:13px; }
.card .link { display:inline-block; margin-top:10px; font-size:10.5px; color:var(--red); font-weight:700; letter-spacing:.5px; text-decoration:none; border-bottom:1px solid var(--red); }

/* Wejście z artykułu (?od=YYYY-MM-DD): start na etapie z tego momentu, bez nakładki; pastylka wraca na początek */
.odpoczatku { position:absolute; left:10px; bottom:10px; z-index:1050; background:var(--bg); color:var(--text); border:1px solid var(--rule); font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:7px 10px; border-radius:20px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.15); }
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(async function(){
  const KIND = { tlo:'tło', atak:'atak', zdobycie:'zdobycie', dyplomacja:'dyplomacja', rynek:'rynek', mapa:'cała mapa', rozdzial:'rozdział',
                 kolej:'kolej', podpalenie:'podpalenie', wybuch:'wybuch', dron:'dron', niebo:'naruszenie nieba', cyber:'cyberatak', morze:'kable i morze', gps:'zakłócanie GPS', agenci:'agenci i zamachy' };
  // Pewność przypisania sprawcy (mapa hybrydowa). Brak pola = mapa bez tej osi (Huti, Iran) — nic się nie zmienia.
  const PEWNOSC = { rosja:'Rosja: potwierdzone', podejrzenie:'Podejrzenie Rosji', nieustalony:'Sprawca nieustalony', dementi:'Zdementowane' };
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Odmiana (14.09): „23 etapów” / „34 etapów” to błąd — 2–4 poza 12–14 biorą „etapy”.
  const etapy = n => n + ' ' + (n === 1 ? 'etap' : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? 'etapy' : 'etapów');
  const id = new URLSearchParams(location.search).get('m') || 'huti';
  // Widok (12.09, życzenie właściciela): DOMYŚLNIE chronologia — wszystkie etapy po kolei, jedna oś.
  // Rozdziały (mapa Iranu) to drugi widok, pod ?widok=rozdzialy; przełącznik w pasku nad mapą.
  const WIDOK = new URLSearchParams(location.search).get('widok') === 'rozdzialy' ? 'rozdzialy' : 'chrono';
  const d = await fetch('mapy/' + id + '.json', {cache:'no-cache'}).then(r => r.json());
  document.title = d.title + ' — Brif.up';
  document.getElementById('kicker').textContent = d.kicker || 'Mapa konfliktu';
  document.getElementById('title').textContent = d.title;
  document.getElementById('lead').textContent = d.lead || '';
  document.getElementById('updated').textContent = d.updated || '';
  if (d.zrodla) document.getElementById('zrodla').textContent = 'Źródła: ' + d.zrodla + '.';
  // Legenda z rodzajów OBECNYCH w danej mapie — na sztywno wpisana pasowała tylko do Huti i Iranu.
  const rodzaje = [...new Set(d.steps.map(x => x.kind))].filter(k => KIND[k]);
  document.getElementById('legenda-rodzaje').innerHTML = rodzaje.map(k => '<span style="color:var(--k-'+k+', var(--text))">● '+ KIND[k] +'</span>').join(' &nbsp; ');
  if (d.steps.some(x => x.przypisanie)) document.getElementById('legenda-pewnosc').innerHTML =
    '<span class="pw" style="background:var(--red)"></span>Rosja: potwierdzone &nbsp; <span class="pw" style="box-shadow:inset 0 0 0 2px var(--red)"></span>podejrzenie &nbsp; <span class="pw" style="box-shadow:inset 0 0 0 2px var(--muted)"></span>sprawca nieustalony<br>';
  document.getElementById('topdate').textContent = (d.updated||'').split('-').reverse().join('.');

  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const E = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  const PR = { base: E + (dark?'Canvas/World_Dark_Gray_Base':'Canvas/World_Light_Gray_Base') + '/MapServer/tile/{z}/{y}/{x}',
               ref:  E + (dark?'Canvas/World_Dark_Gray_Reference':'Canvas/World_Light_Gray_Reference') + '/MapServer/tile/{z}/{y}/{x}',
               refOp: dark ? .8 : .7, line: dark ? '#fbbf24' : '#d97706' };
  const map = L.map('map', { zoomControl:false, scrollWheelZoom:false, dragging:true, attributionControl:true })
               .setView([d.view.lat, d.view.lng], d.view.zoom);
  // Podkład Esri (bez klucza; CARTO od 2026 wymaga API key i stempluje kafle). Jasny/ciemny wg motywu strony.
  L.tileLayer(PR.base, { attribution:'© Esri, HERE, Garmin, © OpenStreetMap', maxZoom:12 }).addTo(map);
  if (PR.ref) L.tileLayer(PR.ref, { maxZoom:12, opacity:PR.refOp, pane:'shadowPane' }).addTo(map);

  // Linie (np. szlak ropy) — pojawiają się od kroku fromStep.
  const lines = (d.lines||[]).map(l => {
    const a = d.places[l.from], b = d.places[l.to];
    const pl = L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:PR.line, weight:2, dashArray:'6 6', opacity:0 }).addTo(map);
    if (l.label) pl.bindTooltip(l.label, { permanent:false, direction:'center', className:'lbl' });
    return { pl, from: l.fromStep||0 };
  });

  // Jeden marker na miejsce; stan (przyszły/teraz/dawny) zmienia klasa.
  const markers = {};
  function mk(pid, n, cls) {
    const p = d.places[pid];
    const icon = L.divIcon({ className:'', html:'<div class="mk '+cls+'">'+(n||'')+'</div>', iconSize:[14,14], iconAnchor:[7,7] });
    const m = L.marker([p.lat,p.lng], { icon, interactive:true, keyboard:false, opacity:0 }).addTo(map);
    m.on('click', () => { if (typeof doMiejsca === 'function') doMiejsca(pid); });
    // Podpis też klikalny (18.09): interactive przekazuje klik do markera, więc napis przewija jak kropka.
    m.bindTooltip(p.name, { permanent:true, direction:'auto', offset:[10,0], className:'lbl', opacity:0, interactive:true });
    return m;
  }
  // Rozdziały (mapa Iranu, 11.09): sekwencja = [nagłówek rozdziału, jego kroki, nagłówek, kroki…].
  // Nagłówek to syntetyczny krok: kadr na wszystkie miejsca rozdziału, markery rozdziału jako obrys.
  const ROZ = d.rozdzialy || [];
  const ROZ_BY = Object.fromEntries(ROZ.map(r => [r.id, r]));
  function urlWidok(w) { const u = new URL(location.href); if (w === 'rozdzialy') u.searchParams.set('widok', 'rozdzialy'); else u.searchParams.delete('widok'); return u.pathname + u.search; }
  if (ROZ.length && WIDOK === 'chrono') {
    // Chronologia: stabilne sortowanie po dacie (etapy tego samego dnia zostają w kolejności z JSON).
    d.steps = d.steps.map((x, i) => [x, i]).sort((a, b) => a[0].date < b[0].date ? -1 : a[0].date > b[0].date ? 1 : a[1] - b[1]).map(a => a[0]);
    const ch = document.getElementById('chapters'); ch.hidden = false;
    const b = document.createElement('a'); b.className = 'tog'; b.href = urlWidok('rozdzialy'); b.textContent = 'Widok: chronologia · przełącz na ' + (d.rozdzialy_nazwa || 'rozdziały'); ch.appendChild(b);
  }
  if (ROZ.length && WIDOK === 'rozdzialy') {
    const seq = [];
    ROZ.forEach((r, ri) => {
      // Mapa od najnowszego (18.09): wewnątrz rozdziału też najnowszy etap pierwszy.
      const kroki = d.steps.filter(x => x.rozdzial === r.id).map((x, i) => [x, i]).sort((a, b) => d.najnowsze_pierwsze ? (a[0].date > b[0].date ? -1 : a[0].date < b[0].date ? 1 : a[1] - b[1]) : a[1] - b[1]).map(a => a[0]);
      if (!kroki.length) return;
      seq.push({ naglowek:true, rozdzial:r.id, ri, date:kroki[0].date, place:kroki[0].place, kind:'rozdzial',
                 title:r.tytul, text:r.opis || '', miejsca:[...new Set(kroki.flatMap(x => [x.place].concat(x.also||[])))] });
      kroki.forEach(k => seq.push(k));
    });
    d.steps = seq;
    const ch = document.getElementById('chapters'); ch.hidden = false;
    ROZ.forEach((r, ri) => { const b = document.createElement('button'); b.textContent = (ri+1) + ' · ' + r.tytul; b.dataset.ri = ri;
      b.onclick = () => { const el = document.querySelector('.step[data-ri="'+ri+'"]'); if (el) window.scrollTo({ top: el.offsetTop - window.innerHeight*0.3, behavior:'smooth' }); };
      ch.appendChild(b); });
    const t = document.createElement('a'); t.className = 'tog'; t.href = urlWidok('chrono'); t.textContent = 'Chronologia'; ch.appendChild(t);
  }

  // Od najnowszego (18.09, mapa hybrydowa, życzenie właściciela): flaga `najnowsze_pierwsze` w JSON.
  // Stabilne sortowanie malejąco po dacie — etapy tego samego dnia zachowują kolejność z pliku.
  const NAJNOWSZE = !!d.najnowsze_pierwsze && !(ROZ.length && WIDOK === 'rozdzialy');
  if (NAJNOWSZE) d.steps = d.steps.map((x, i) => [x, i]).sort((a, b) => a[0].date > b[0].date ? -1 : a[0].date < b[0].date ? 1 : a[1] - b[1]).map(a => a[0]);
  // Krok końcowy (życzenie właściciela 11.09): ZAWSZE podgląd całej mapy ze wszystkimi punktami.
  // Syntetyczny, nie z JSON — każda mapa go dostaje. Kadr = wszystkie miejsca kroków.
  const daty = d.steps.filter(x => !x.naglowek).map(x => x.date).sort();
  const pierwszy = { date: daty[0] }, ostatni = d.steps[d.steps.length-1];
  d.steps.push({ date: ostatni.date, place: ostatni.place, kind: 'mapa', calosc: true,
    title: d.podsumowanie_tytul || 'Cała historia na jednej mapie',
    text: d.podsumowanie || (etapy(d.steps.filter(x => !x.naglowek).length) + ', od ' + pierwszy.date.split('-').reverse().join('.') + ' do ' + daty[daty.length-1].split('-').reverse().join('.') + '. Numery na mapie to kolejność wydarzeń. Wróć do dowolnego etapu przewijając w górę.') });
  // Start od całej mapy (18.09): flaga `start_od_calosci` — syntetyczny krok 0 z kadrem na wszystkie punkty,
  // zanim czytelnik zacznie przewijać. Dostaje klasę `calosc` (pełne kropki pewności) i nie ma numeru.
  if (d.start_od_calosci) d.steps.unshift({ date: ostatni.date, place: ostatni.place, kind: 'mapa', calosc: true, przeglad: true,
    title: 'Wszystko na jednej mapie',
    text: etapy(d.steps.filter(x => !x.naglowek && !x.calosc).length) + ' od ' + pierwszy.date.split('-').reverse().join('.') + ' do ' + daty[daty.length-1].split('-').reverse().join('.') + '. Przewijaj w dół' + (NAJNOWSZE ? ' — zaczynamy od najnowszego.' : '.') + ' Kliknij punkt na mapie, żeby przejść do wydarzenia.' });
  let nr = 0;
  const maPewnosc = d.steps.some(x => x.przypisanie);
  d.steps.forEach((s, i) => {
    s.n = (s.naglowek || s.calosc) ? '' : ++nr;
    if (s.naglowek) return;
    if (s.calosc) return;
    if (!markers[s.place]) markers[s.place] = { m: mk(s.place, s.n, 'past'), first: i, pw: '', n: s.n };
    // Pewność miejsca = NAJMOCNIEJSZE przypisanie spośród jego etapów (jedno potwierdzone wystarcza do pełnej kropki).
    if (s.przypisanie) { const rank = { rosja:3, podejrzenie:2, nieustalony:1, dementi:0 }, o = markers[s.place], cur = o.pw || '';
      if (!cur || (rank[s.przypisanie.poziom] || 0) > (rank[cur] || 0)) o.pw = s.przypisanie.poziom; }
    // Etap-tło na mapie z osią pewności (18.09): bez tego dostawał PEŁNĄ czerwoną kropkę, czyli wyglądał
    // jak „Rosja potwierdzona” — a tło „Nie każdy dron to Rosja” mówi dokładnie odwrotnie. Rysujemy neutralnie.
    else if (s.kind === 'tlo' && maPewnosc && !markers[s.place].pw) markers[s.place].pw = 'nieustalony';
    (s.also||[]).forEach(a => { if (!markers[a]) markers[a] = { m: mk(a, '', 'also'), first: i }; });
  });

  // Kroki w DOM.
  const box = document.getElementById('steps');
  d.steps.forEach((s, i) => {
    const p = d.places[s.place];
    const el = document.createElement('section');
    el.className = 'step'; el.dataset.i = i;
    if (s.naglowek) {
      el.dataset.ri = s.ri;
      el.innerHTML = '<div class="card chapter"><div class="kicker">'+ (d.rozdzial_kicker || 'Rozdział') +' '+ (s.ri+1) +' z '+ ROZ.length +'</div><h2>'+ s.title +'</h2><p>'+ s.text +'</p></div>';
      box.appendChild(el); return;
    }
    el.innerHTML = '<div class="card"><div class="when"><span>'+ (s.przeglad ? '' : s.date.split('-').reverse().join('.')) + (s.znane_od && s.znane_od!==s.date ? ' · wiadomo od '+ s.znane_od.split('-').reverse().join('.') : '') +'</span>'+
      '<span class="kind" data-k="'+s.kind+'" style="color:var(--k-'+s.kind+', var(--text))">'+ (KIND[s.kind]||s.kind) +'</span>'+
      (WIDOK === 'chrono' && s.rozdzial && ROZ_BY[s.rozdzial] ? '<span class="roz">'+ ROZ_BY[s.rozdzial].tytul +'</span>' : '') +'</div>'+
      (s.calosc ? '' : '<div class="place">📍 '+ p.name +'</div>') +'<h2>'+ s.title +'</h2><p>'+ s.text +'</p>'+
      (s.przypisanie && PEWNOSC[s.przypisanie.poziom] ? '<div class="przyp" data-p="'+ s.przypisanie.poziom +'"><i></i>'+ PEWNOSC[s.przypisanie.poziom] + (s.przypisanie.kto ? '<em>'+ esc(s.przypisanie.kto) +'</em>' : '') +'</div>' : '') +
      (p.why && !s.calosc ? '<div class="why"><b>Dlaczego to miejsce</b>'+ p.why +'</div>' : '') +
      (s.link ? '<a class="link" href="'+ s.link +'">'+ (s.link_tekst || 'Zobacz więcej →') +'</a>' : '') +
      (s.calosc && !s.przeglad ? '<a class="cta" href="index.html"><b>Więcej takich historii na Brif.up</b><span>Na bieżąco: co się stało, dlaczego i co to znaczy dla Twojego portfela. Bez szumu, w dwie minuty.</span><em>Wejdź na stronę główną →</em></a>' : '') + '</div>';
    box.appendChild(el);
  });

  let current = -1;
  function setMarker(m, cls, n, show, pw) {
    const el = m.getElement(); if (!el) return;
    const dot = el.querySelector('.mk'); dot.className = 'mk ' + cls + (pw && pw !== 'rosja' ? ' pw-' + pw : ''); if (n !== undefined) dot.textContent = n;
    m.setOpacity(show ? 1 : 0);
    const tt = m.getTooltip(); if (tt && tt.getElement()) tt.getElement().style.opacity = show ? (cls==='now'?1:.75) : 0;
  }
  let kadrT = 0, ostatniScroll = -1e9;
  function activate(i) {
    if (i === current) return; current = i;
    const s = d.steps[i], p = d.places[s.place];
    document.querySelectorAll('.step').forEach(el => el.classList.toggle('active', +el.dataset.i === i));
    document.getElementById('hint').classList.toggle('off', i > 0);
    document.getElementById('progress').style.width = ((i+1) / d.steps.length * 100) + '%';
    document.body.classList.toggle('calosc', !!s.calosc);
    // markery: pokazane te, których pierwszy krok <= i
    Object.entries(markers).forEach(([pid, o]) => {
      const isNow = !s.calosc && !s.naglowek && pid === s.place;
      const isAlso = s.naglowek ? s.miejsca.includes(pid) && o.first > i : (!s.calosc && (s.also||[]).includes(pid));
      const shown = o.first <= i || !!s.przeglad || (s.naglowek && s.miejsca.includes(pid));
      const stepN = o.n || '';
      setMarker(o.m, isNow ? 'now' : (isAlso ? 'also' : 'past'), isNow || isAlso ? '' : stepN, shown, o.pw);
    });
    lines.forEach(l => l.pl.setStyle({ opacity: l.from <= i ? .9 : 0 }));
    // Kadr: miejsce + „also” razem, inaczej dolot do miejsca.
    if (ROZ.length && WIDOK === 'rozdzialy') {
      const cur = s.calosc ? ROZ.length : ROZ.findIndex(r => r.id === s.rozdzial);
      document.querySelectorAll('#chapters button').forEach(b => { const k = +b.dataset.ri; b.classList.toggle('on', k === cur); b.classList.toggle('done', k < cur); });
      const on = document.querySelector('#chapters button.on'); if (on) on.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
    }
    // Kamera dopiero, gdy przewijanie się uspokoi (19.09): szybki ruch palcem przeskakuje 3–5 kart, a każda
    // restartowała 1-sekundowy przelot przez pół Europy — na telefonie mapa szarpała (12 przelotów w 2 s).
    // Markery i pasek wyżej zmieniają się od razu; ruch kamery tylko do karty, na której czytelnik stanął.
    clearTimeout(kadrT);
    kadrT = setTimeout(() => {
      if (s.naglowek) {
        map.flyToBounds(L.latLngBounds(s.miejsca.map(a => [d.places[a].lat, d.places[a].lng])).pad(0.3), { duration:1.2, maxZoom:7 });
        return;
      }
      if (s.calosc) {
        const all = d.steps.filter(x => !x.calosc && !x.naglowek).map(x => [d.places[x.place].lat, d.places[x.place].lng]);
        map.flyToBounds(L.latLngBounds(all).pad(0.15), { duration:1.4 });
        return;
      }
      const pts = [[p.lat,p.lng]].concat((s.also||[]).map(a => [d.places[a].lat, d.places[a].lng]));
      if (pts.length > 1) map.flyToBounds(L.latLngBounds(pts).pad(0.5), { duration:1.1, maxZoom:7 });
      else map.flyTo([p.lat, p.lng], s.zoom || (s.kind==='zdobycie' ? 8 : 6), { duration:1.1 });
    }, performance.now() - ostatniScroll < 200 ? 220 : 0);
  }
  // Aktywny = krok, którego karta jest najbliżej środka ekranu. IntersectionObserver sam nie wystarcza:
  // przy szybkim przewijaniu wpisy przychodzą w kolejności DOM, nie scrolla, i mapa zostawała w tyle za kartą.
  const stepEls = Array.from(document.querySelectorAll('.step'));
  let raf = 0;
  function pick() {
    raf = 0;
    // Na telefonie mapa jest przyklejona U GÓRY, więc „środek ekranu” liczymy dla pasa POD mapą —
    // inaczej wygrywała karta o krok wcześniejsza (jej środek był bliżej połowy okna niż karta w kadrze).
    const stacked = getComputedStyle(document.querySelector('.story')).display !== 'grid';
    const mapBottom = stacked ? Math.max(0, Math.min(window.innerHeight, document.querySelector('.mapwrap').getBoundingClientRect().bottom)) : 0;
    const mid = mapBottom + (window.innerHeight - mapBottom) / 2;
    let best = 0, bd = Infinity;
    stepEls.forEach((el, i) => { const r = el.getBoundingClientRect(); const d_ = Math.abs((r.top + r.bottom)/2 - mid); if (d_ < bd) { bd = d_; best = i; } });
    activate(best);
  }
  // Klik w punkt na mapie (18.09): przewiń do jego wydarzenia. Karta ląduje tam, gdzie `pick` szuka aktywnego
  // kroku (środek pasa pod mapą na telefonie, środek okna na desktopie). Kilka wydarzeń w jednym miejscu:
  // kolejne kliknięcia przechodzą po nich po kolei.
  function srodekPasa() {
    const stacked = getComputedStyle(document.querySelector('.story')).display !== 'grid';
    const mb = stacked ? Math.max(0, Math.min(window.innerHeight, document.querySelector('.mapwrap').getBoundingClientRect().bottom)) : 0;
    return mb + (window.innerHeight - mb) / 2;
  }
  function doKroku(i) {
    const el = stepEls[i]; if (!el) return;
    document.getElementById('intro').classList.add('off');
    const r = el.getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + (r.top + r.bottom) / 2 - srodekPasa(), behavior: 'smooth' });
  }
  window.doMiejsca = pid => {
    const ix = d.steps.map((x, i) => (!x.calosc && !x.naglowek && x.place === pid) ? i : -1).filter(i => i >= 0);
    if (!ix.length) return;
    const tu = d.steps[current] && d.steps[current].place === pid;
    const nast = tu ? ix.find(i => i > current) : undefined;
    doKroku(nast !== undefined ? nast : ix[0]);
  };
  window.addEventListener('scroll', () => { ostatniScroll = performance.now(); if (!raf) raf = requestAnimationFrame(pick); }, { passive:true });
  window.addEventListener('resize', pick);
  activate(0);

  // Wejście z artykułu: ?od=<data newsa>. Czytelnik ląduje na ostatnim etapie nie późniejszym niż ta data
  // (etap „z tego momentu”), a nie na początku pół roku historii. Nakładka powitalna pominięta.
  const od = new URLSearchParams(location.search).get('od');
  const intro = document.getElementById('intro');
  if (od && /^\d{4}-\d{2}-\d{2}$/.test(od)) {
    let cel = -1;
    if (NAJNOWSZE) cel = d.steps.findIndex(x => !x.naglowek && !x.calosc && x.date <= od);
    else d.steps.forEach((x, i) => { if (!x.naglowek && !x.calosc && x.date <= od) cel = i; });
    if (cel < 0) cel = d.steps.findIndex(x => !x.naglowek);
    intro.classList.add('off');
    const el = stepEls[cel];
    window.scrollTo({ top: el.offsetTop - (window.innerHeight - el.offsetHeight) / 2, behavior:'instant' });
    setTimeout(pick, 50);
    const bt = document.getElementById('odpoczatku'); bt.hidden = false;
    bt.onclick = () => { window.scrollTo({ top: 0, behavior:'smooth' }); bt.hidden = true; };
  }

  // Nakładka powitalna: gaśnie przy pierwszym przewinięciu, dotknięciu, kliknięciu albo po 6 s.
  intro.querySelector('.small').textContent = etapy(d.steps.filter(x => !x.naglowek && !x.calosc).length) + ' · mapa idzie za Tobą';
  const zgas = () => { intro.classList.add('off'); };
  ['scroll','touchstart','wheel','keydown'].forEach(ev => window.addEventListener(ev, zgas, { once:true, passive:true }));
  intro.addEventListener('click', () => { zgas(); window.scrollTo({ top: stepEls[1].offsetTop - window.innerHeight*0.35, behavior:'smooth' }); });
  setTimeout(zgas, 6000);
})();
</script>
<script defer src="licznik.js"></script>
</body>
</html>
