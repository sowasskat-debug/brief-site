// Tematy z flagą zamiast kolorowej kropki w sidebarze/panelu.
const DT_CAT_FLAG = { 'Wojna w Iranie':'🇮🇷','Wojna na Ukrainie':'🇺🇦' };
// „Polityka lokalna" — kropka po LEWEJ (jak reszta), a flaga 🇵🇱 po PRAWEJ (życzenie właściciela 2026-07-16).
const DT_CAT_RIGHT_FLAG = { 'Polityka lokalna':'🇵🇱' };
// Zwraca znacznik tematu po LEWEJ: flagę (jeśli jest) albo kolorową kropkę. dotClass/flagClass zależne od kontekstu (desktop vs mobile).
function catMarker(c, dotClass, flagClass) {
  return DT_CAT_FLAG[c]
    ? `<span class="${flagClass}">${DT_CAT_FLAG[c]}</span>`
    : `<div class="${dotClass}" style="background:${DT_CAT_COLORS[c]||'#888'}"></div>`;
}
// Flaga po PRAWEJ stronie wiersza (na razie tylko Polityka lokalna). Pusty string gdy brak.
function catRightFlag(c, cls) {
  return DT_CAT_RIGHT_FLAG[c] ? `<span class="${cls}">${DT_CAT_RIGHT_FLAG[c]}</span>` : '';
}
// Kolejność tematów w sidebarze i panelu (wspólna). Wojny i polityka lokalna na górze — najważniejsze.
// Kolejność tematów. Wojny (grupa „KONFLIKTY") świadomie NA DOLE listy (życzenie właściciela 2026-07-16).
const DT_CAT_ORDER = ['Polityka lokalna','Fed / Banki','Geopolityka','Polityka','Tech / AI','Surowce','Świat','Rynki','Wojna na Ukrainie','Wojna w Iranie'];
// Grupa „KONFLIKTY" — nagłówek sekcji nad wojnami (czysto wizualny, nie osobny filtr). Warianty A.
const KONFLIKTY_CATS = ['Wojna na Ukrainie','Wojna w Iranie'];
// Zwraca HTML nagłówka grupy TYLKO przed PIERWSZĄ obecną kategorią-konfliktem (żeby nagłówek pojawił się raz).
function konfliktyHeaderHtml(c, obecne, cssClass) {
  if (!KONFLIKTY_CATS.includes(c)) return '';
  if (obecne.find(x => KONFLIKTY_CATS.includes(x)) !== c) return '';
  return `<div class="${cssClass}">⚔ KONFLIKTY</div>`;
}

function dtRenderSidebar(items) {
  const counts = {};
  function countIt(it) { const c = dtGetCategory(it); counts[c] = (counts[c]||0)+1; }
  items.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  dtArchiveAllItems.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  const catsEl = document.getElementById('dtCategories');
  if (catsEl) {
    const obecne = DT_CAT_ORDER.filter(c => counts[c]);
    catsEl.innerHTML = '<div class="dt-index-title">Tematy</div>' +
      obecne.map(c =>
        konfliktyHeaderHtml(c, obecne, 'dt-index-group') +
        `<div class="dt-index-item" onclick="dtFilterCat(this)">
          ${catMarker(c, 'dt-index-dot', 'dt-index-flag')}
          <span class="dt-index-label">${c}</span>
          ${catRightFlag(c, 'dt-index-rflag')}
          <span class="dt-index-n">${counts[c]}</span>
          ${catLevelBarHtml(c)}
        </div>`
      ).join('');
  }
  dtRenderArchiveSidebar();
}

async function dtRenderArchiveSidebar() {
  const archEl = document.getElementById('dtArchive');
  if (!archEl) return;
  try {
    if (!archiveDatesCache) {
      const r = await fetch('./archive/index.json', { cache: 'no-store' });
      archiveDatesCache = r.ok ? await r.json() : [];
    }
    if (!archiveDatesCache || !archiveDatesCache.length) {
      archEl.innerHTML = '<div class="dt-index-title">Archiwum</div><div class="dt-index-item dim"><span class="dt-index-label">Jeszcze puste</span></div>';
      return;
    }
    const sorted = archiveDatesCache.slice().sort((a, b) => b.localeCompare(a));
    let html = '<div class="dt-index-title">Archiwum</div>';
    html += sorted.slice(0, 5).map(d => {
      const dt = new Date(d + 'T00:00:00');
      const label = dt.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
      return `<div class="dt-index-item" onclick="openArchiveToDay('${d}')"><div class="dt-index-dot" style="background:#8a8577"></div><span class="dt-index-label">${label}</span></div>`;
    }).join('');
    if (sorted.length > 5) {
      html += `<div class="dt-index-item" onclick="openArchive()"><span class="dt-index-label" style="color:var(--muted)">Zobacz wszystkie →</span></div>`;
    }
    archEl.innerHTML = html;

    if (!dtArchiveLoaded) {
      dtArchiveLoaded = true;
      dtArchiveAllItems = [];
      dtArchiveDniWczytane = Math.min(ARCHIWUM_DNI_NA_STARCIE, sorted.length);
      await wczytajDniArchiwum(sorted.slice(0, dtArchiveDniWczytane));
      dtRenderSidebarCounts();
    }
  } catch (e) {
    archEl.innerHTML = '<div class="dt-index-title">Archiwum</div>';
  }
}

// Pobiera podane dni archiwum i DOKŁADA ich itemy do `dtArchiveAllItems`.
// ⚠️ Pobieranie RÓWNOLEGŁE — dawna pętla szła dzień po dniu i przy 37 plikach sam łańcuch
// round-tripów potrafił trwać dłużej niż transfer. `Promise.all` zachowuje kolejność wejścia,
// więc dni zostają ułożone od najnowszego (widok cross-day i tak grupuje je potem po dacie).
// Każdy dzień pada osobno — brakujący plik nie może zabrać reszty.
async function wczytajDniArchiwum(daty) {
  await Promise.all(daty.map(async d => {
    if (archiveDayCache[d]) return;
    try {
      const r = await fetch(`./archive/${d}.json`, { cache: 'no-store' });
      if (r.ok) archiveDayCache[d] = await r.json();
    } catch (e) {}
  }));
  for (const d of daty) {
    const dzien = archiveDayCache[d];
    if (!dzien) continue;
    for (const dose of ['morning','afternoon','evening']) {
      const doseData = dzien[dose];
      if (!doseData?.items) continue;
      doseData.items.forEach(it => dtArchiveAllItems.push({
        ...it, id: it.id || 'a-' + uid(), _archiveDate: d, _dose: dose,
        subItems: (it.subItems || []).map(s => ({ ...s, id: s.id || 'a-' + uid() }))
      }));
    }
  }
}

// Dociąga dni archiwum starsze niż `ARCHIWUM_DNI_NA_STARCIE` — wołane WYŁĄCZNIE z widoku tematu
// (cross-day, mobile i PC), bo tylko tam starsze dni są w ogóle widoczne. Po pobraniu odświeża
// liczniki i woła `poZaladowaniu`, żeby otwarty widok domalował doczytane dni.
// ⚠️ `dtArchiveDniWczytane` podnosimy OD RAZU, a obietnicę trzymamy w `dtArchiveDoczytywanie` —
// bez tego dwa kliknięcia w temat pobrałyby całe archiwum dwa razy równolegle i zdublowały itemy.
// 🔴 `dtArchiveKompletne` to NIE jest zapasowy guard, tylko warunek zatrzymania: `poZaladowaniu`
// przerysowuje widok tematu, a ten woła tę funkcję ponownie — bez flagi ustawianej WEWNĄTRZ
// łańcucha obietnicy (czyli zanim ruszą doczepione callbacki) re-render zapętliłby się w nieskończoność.
function dowczytajCaleArchiwum(poZaladowaniu) {
  if (!dtArchiveLoaded || !archiveDatesCache || dtArchiveKompletne) return;
  const sorted = archiveDatesCache.slice().sort((a, b) => b.localeCompare(a));
  if (!dtArchiveDoczytywanie) {
    if (dtArchiveDniWczytane >= sorted.length) { dtArchiveKompletne = true; return; }
    const reszta = sorted.slice(dtArchiveDniWczytane);
    dtArchiveDniWczytane = sorted.length;
    dtArchiveDoczytywanie = wczytajDniArchiwum(reszta)
      .catch(() => {})
      .then(() => { dtArchiveKompletne = true; });
  }
  dtArchiveDoczytywanie.then(() => {
    dtRenderSidebarCounts();
    if (typeof mobSwpBuildCats === 'function') mobSwpBuildCats(cache[currentDose] || dtAllItems);
    if (poZaladowaniu) poZaladowaniu();
  });
}

function dtRenderSidebarCounts() {
  const counts = {};
  function countIt(it) { const c = dtGetCategory(it); counts[c] = (counts[c]||0)+1; }
  dtAllItems.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  dtArchiveAllItems.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  const catsEl = document.getElementById('dtCategories');
  if (!catsEl) return;
  const activeFilter = dtActiveFilter;
  const obecne = DT_CAT_ORDER.filter(c => counts[c]);
  catsEl.innerHTML = '<div class="dt-index-title">Tematy</div>' +
    obecne.map(c =>
      konfliktyHeaderHtml(c, obecne, 'dt-index-group') +
      `<div class="dt-index-item${activeFilter===c?' active':''}" onclick="dtFilterCat(this)">
        ${catMarker(c, 'dt-index-dot', 'dt-index-flag')}
        <span class="dt-index-label">${c}</span>
        ${catRightFlag(c, 'dt-index-rflag')}
        <span class="dt-index-n">${counts[c]}</span>
        ${catLevelBarHtml(c)}
      </div>`
    ).join('');
}

function dtFilterCat(el) {
  const cat = el.querySelector('.dt-index-label')?.textContent;
  if (!cat) return;
  const wasActive = dtActiveFilter === cat;
  document.querySelectorAll('#dtCategories .dt-index-item').forEach(e => e.classList.remove('active'));
  if (wasActive) {
    dtActiveFilter = null;
    const wrapEl = document.getElementById('dtCatFillBarWrap');
    if (wrapEl) wrapEl.innerHTML = '';
    renderDesktop(currentDose, cache[currentDose] || dtAllItems);   // wróć do widoku dawki (z filtrem suwaka)
  } else {
    dtActiveFilter = cat;
    el.classList.add('active');
    dtRenderCatFilter(cat);
  }
  dtShowEmpty();
}

// Cross-day widok tematu na PC + filtr jakości = percentyl (top X% tego tematu wg meatScore).
// Podłoga: wąski temat nigdy nie pustoszeje — przy "samo mięso" pokazuje przynajmniej najgrubszy item (min 1).
function dtRenderCatFilter(cat) {
  const matchesCat = it => it.subItems?.length > 0 ? it.subItems.some(sub => dtGetCategory(sub) === cat) : dtGetCategory(it) === cat;
  const today = todayLocalISO();
  const matching = [];
  dtAllItems.filter(matchesCat).forEach(it => matching.push({ it, d: today }));
  dtArchiveAllItems.filter(matchesCat).forEach(it => matching.push({ it, d: it._archiveDate }));

  const pct = getCatPct(cat);
  let survivors = matching;
  if (pct < 100) {
    survivors = topPctByScore(matching, pct, x => meatScore(x.it));
  }

  const wrapEl = document.getElementById('dtCatFillBarWrap');
  if (wrapEl) wrapEl.innerHTML = catFillBarHtml(cat);

  const byDate = {};
  survivors.forEach(x => { (byDate[x.d] = byDate[x.d] || []).push(x.it); });
  const sortedDates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));
  dtRenderFeedCrossDay(byDate, sortedDates, today);
  const total = sortedDates.reduce((s,d) => s + byDate[d].reduce((ss,it) => ss + (it.subItems?.length > 0 ? it.subItems.length : 1), 0), 0);
  const fcEl = document.getElementById('dtFeedCount');
  if (fcEl) fcEl.textContent = `${total} wpisów`;

  // Widok tematu to JEDYNE miejsce, w którym widać dni starsze niż ARCHIWUM_DNI_NA_STARCIE —
  // dopiero tu ma sens zapłacić za resztę archiwum. Starsze dni dochodzą NA DOLE listy,
  // więc pozycja przewinięcia zostaje sensowna; przywracamy ją, żeby lista nie skoczyła.
  dowczytajCaleArchiwum(() => {
    if (dtActiveFilter !== cat) return;
    const feedEl = document.getElementById('dtFeedList');
    const y = feedEl ? feedEl.scrollTop : 0;
    dtRenderCatFilter(cat);
    if (feedEl) feedEl.scrollTop = y;
  });
}

function dtRenderFeedCrossDay(byDate, sortedDates, today) {
  let html = '';
  let globalIdx = 0;
  sortedDates.forEach(d => {
    const label = d === today
      ? 'Dziś'
      : new Date(d + 'T00:00:00').toLocaleDateString('pl-PL', {day:'numeric', month:'long', year:'numeric'});
    html += `<div style="padding:8px 12px 4px;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--border)">${label}</div>`;
    byDate[d].forEach(item => {
      globalIdx++;
      const num = String(globalIdx).padStart(3,'0');
      // Zarejestruj w mapie, żeby dtPickItem znalazł wpis (renderDesktop resetuje dtItemsMap,
      // więc archiwalne wpisy trzeba ponownie wpiąć przy każdym renderze cross-day).
      dtItemsMap[item.id] = item;
      (item.subItems||[]).forEach(s => { dtItemsMap[s.id] = s; });
      const isGroup = item.subItems?.length > 0;
      if (isGroup) {
        const subsHtml = item.subItems.map(sub =>
          `<div class="dt-sub-item" id="dts-${sub.id}" onclick="event.stopPropagation();dtPickItem('${sub.id}')">
            <span class="dt-sub-flag">${escHtml(sub.flag||'📰')}</span>
            <div class="dt-sub-text">${escHtml(sub.text)}${watekBadgeSubHtml(sub)}</div>
          </div>`
        ).join('');
        html += `<div class="dt-item group-header" id="dti-${item.id}" onclick="dtToggleGroup('${item.id}')">
          <div class="dt-item-num">${num}</div>
          <div class="dt-item-flag">${escHtml(item.flag||'📰')}</div>
          <div class="dt-item-body">
            ${watekPasekHtml(item)}<div class="dt-item-headline">${escHtml(item.text)}</div>
            <div class="dt-item-meta">${srcBadge(item) || `<span>↓ ${item.subItems.length} powiązane</span>`} ${watekBadgeHtml(item)}</div>
          </div>
        </div>
        <div class="dt-group-subs" id="dtg-${item.id}" style="display:none">${subsHtml}</div>`;
      } else {
        const t = formatAddedAt(item);
        html += `<div class="dt-item" id="dti-${item.id}" onclick="dtPickItem('${item.id}')">
          <div class="dt-item-num">${num}</div>
          <div class="dt-item-flag">${escHtml(item.flag||'📰')}</div>
          <div class="dt-item-body">
            ${watekPasekHtml(item)}<div class="dt-item-headline">${escHtml(item.text)}</div>
            ${(t||item.source_name||threadForItem(item))?`<div class="dt-item-meta">${t?`<span>${t}</span>`:''} ${item.source_name?`<span>${escHtml(item.source_name)}</span>`:''} ${watekBadgeHtml(item)}</div>`:''}
          </div>
        </div>`;
      }
    });
  });
  const feedList = document.getElementById('dtFeedList');
  if (feedList) feedList.innerHTML = html;
}

function dtRenderFeed(items) {
  items = filterByCatMeat(items);
  let html = '';
  items.forEach((item, i) => {
    const num = String(i+1).padStart(3,'0');
    const isGroup = item.subItems?.length > 0;
    const isTop = i === 0 || !!item.top; // top story = pozycja [0] (tak jak hero na telefonie)
    if (isGroup) {
      const subsHtml = item.subItems.map(sub =>
        `<div class="dt-sub-item" id="dts-${sub.id}" onclick="event.stopPropagation();dtPickItem('${sub.id}')">
          <span class="dt-sub-flag">${escHtml(sub.flag||'📰')}</span>
          <div class="dt-sub-text">${escHtml(sub.text)}${watekBadgeSubHtml(sub)}</div>
        </div>`
      ).join('');
      html += `<div class="dt-item group-header${isTop?' top-item':''}" id="dti-${item.id}" onclick="dtToggleGroup('${item.id}')">
        <div class="dt-item-num">${num}</div>
        <div class="dt-item-flag">${escHtml(item.flag||'📰')}</div>
        <div class="dt-item-body">
          ${isTop?'<div class="dt-item-badges"><span class="dt-badge dt-badge-top">★ TOP STORY</span></div>':''}
          ${watekPasekHtml(item)}<div class="dt-item-headline">${escHtml(item.text)}</div>
          <div class="dt-item-meta">${srcBadge(item) || `<span>↓ ${item.subItems.length} powiązane</span>`} ${watekBadgeHtml(item)}</div>
        </div>
      </div>
      <div class="dt-group-subs" id="dtg-${item.id}" style="display:none">${subsHtml}</div>`;
    } else {
      const t = formatAddedAt(item);
      html += `<div class="dt-item${isTop?' top-item':''}" id="dti-${item.id}" onclick="dtPickItem('${item.id}')">
        <div class="dt-item-num">${num}</div>
        <div class="dt-item-flag">${escHtml(item.flag||'📰')}</div>
        <div class="dt-item-body">
          ${isTop?'<div class="dt-item-badges"><span class="dt-badge dt-badge-top">★ TOP STORY</span></div>':''}
          ${watekPasekHtml(item)}<div class="dt-item-headline">${escHtml(item.text)}</div>
          ${(t||item.source_name||threadForItem(item))?`<div class="dt-item-meta">${t?`<span>${t}</span>`:''} ${item.source_name?`<span>${escHtml(item.source_name)}</span>`:''} ${watekBadgeHtml(item)}</div>`:''}
        </div>
      </div>`;
    }
  });
  const feedList = document.getElementById('dtFeedList');
  if (feedList) feedList.innerHTML = html;
  markNewItems(items); // chwilowy błysk nowych artykułów (od ostatniej wizyty)
}

function renderDesktop(dose, items) {
  if (!isDesktop()) return;
  // NIE filtrujemy tutaj — dtAllItems ma być PEŁNE (liczniki tematów + widoki tematów).
  // Percentyl per-temat aplikuje dopiero dtRenderFeed (główny feed) i widoki tematów.
  dtItemsMap = {};
  dtAllItems = items;
  dtActiveFilter = null;
  const dtBarWrap = document.getElementById('dtCatFillBarWrap');
  if (dtBarWrap) dtBarWrap.innerHTML = '';
  items.forEach(it => {
    dtItemsMap[it.id] = it;
    (it.subItems||[]).forEach(sub => { dtItemsMap[sub.id] = sub; });
  });

  const doseNames = {morning:'Poranne',afternoon:'Popołudniowe',evening:'Wieczorne'};
  const dateStr = new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();
  const ftEl = document.getElementById('dtFeedTitle');
  const fcEl = document.getElementById('dtFeedCount');
  if (ftEl) ftEl.textContent = isPrevEdition(dose)
    ? `${doseNames[dose]} · ◷ WCZORAJSZE WYDANIE (${formatDoseDate(doseDates[dose])})`
    : `${doseNames[dose]} · ${dateStr}`;
  if (fcEl) {
    const total = items.reduce((s,it) => s + (it.subItems?.length > 0 ? it.subItems.length : 1), 0);
    fcEl.textContent = `${total} wpisów`;
  }

  dtRenderFeed(items);
  dtRenderSidebar(items);
  // Nie czyść panelu szczegółów przy każdym renderze (np. zmiana dawki morning/evening) — zostaw
  // ostatnio wybrany artykuł widoczny, aż użytkownik kliknie inny.
  // ⚠️ Na WEJŚCIU otwieramy od razu TOP STORY zamiast pustego placeholdera (życzenie właściciela
  // 2026-08-01): pusty panel na starcie marnował pół ekranu i zmuszał do kliknięcia czegokolwiek,
  // żeby zobaczyć treść. Warunek `!dtCurrentItemId` sprawia, że dotyczy to TYLKO pierwszego renderu —
  // przy zmianie dawki i live-ticku wybór użytkownika zostaje nietknięty, jak dotąd.
  // Deep-link nie koliduje: jeśli routing zdążył wybrać artykuł, dtCurrentItemId jest już ustawione
  // i ten blok się nie wykona; jeśli zdąży później, po prostu nadpisze top story właściwym wpisem.
  if (!dtCurrentItemId) {
    const top = items[0];
    if (top && dtItemsMap[top.id]) dtPickItem(top.id);
    else dtShowEmpty();          // pusta dawka / brak dopasowania — stare zachowanie
  }
}

function dtToggleGroup(id) {
  const g = document.getElementById(`dtg-${id}`);
  const h = document.getElementById(`dti-${id}`);
  if (!g) return;
  const open = g.style.display !== 'none';
  g.style.display = open ? 'none' : 'block';
  h?.classList.toggle('selected', !open);
  // ⚠️ ROZWINIĘCIE KLASTRA OTWIERA TEŻ KOTWICĘ W PANELU (2026-08-04). Zgłoszenie właściciela: „wchodzę
  // na «USA wprowadzają cła i cenę minimalną» i dalej nie mam wątku po prawej stronie".
  // 🔴 Przyczyna: `dtToggleGroup` TYLKO rozwijał listę i NIGDY nie wołał `dtShowDetail`, więc kotwicy
  // klastra na desktopie NIE DAŁO SIĘ otworzyć — klikalne były wyłącznie podpozycje. A wątki budowane
  // są z pozycji TOP-LEVEL, więc to właśnie kotwica jest węzłem sagi (tu: „Cła Trumpa na cały świat",
  // etap 6/6); podpozycje węzłami nie są. Efekt: dla każdego klastra-węzła oś wątku była nieosiągalna,
  // mimo że `dtShowDetail` renderuje ją poprawnie. Badge z #91 mówił „tu jest saga", a kliknięcie
  // i tak jej nie pokazywało — czyli poprzednia poprawka odsłoniła dopiero połowę problemu.
  // Kotwica bez artykułu (parasol) też ma co pokazać: nagłówek, oś wątku i „Inne wpisy".
  if (!open) dtPickItem(id);
  if (open) {
    // Zwijamy grupę: czyść panel/zaznaczenie TYLKO gdy czytany artykuł należał do TEJ grupy (kotwica lub
    // jej podpunkt). Wcześniej zwinięcie DOWOLNEGO klastra kasowało otwarty artykuł — nawet niepowiązany
    // top-level po prawej znikał, zastąpiony placeholderem „Wybierz news".
    const grupa = dtItemsMap[id];
    const naleziDoGrupy = dtCurrentItemId && (dtCurrentItemId === id ||
      (grupa && grupa.subItems || []).some(s => s.id === dtCurrentItemId));
    if (naleziDoGrupy) {
      document.querySelectorAll('.dt-sub-item.selected').forEach(e => e.classList.remove('selected'));
      dtShowEmpty();
    }
  }
}

function dtPickItem(id) {
  const item = dtItemsMap[id];
  if (!item) return;
  document.querySelectorAll('.dt-item.selected,.dt-sub-item.selected').forEach(e => e.classList.remove('selected'));
  (document.getElementById(`dti-${id}`) || document.getElementById(`dts-${id}`))?.classList.add('selected');
  dtCurrentItemId = id;
  dtShowDetail(item);
}

function dtShowEmpty() {
  const det = document.getElementById('dtDetail');
  if (det) det.innerHTML = `<div class="dt-detail-empty"><div class="dt-detail-empty-icon">→</div><div class="dt-detail-empty-text">Wybierz news aby przeczytać artykuł</div></div>`;
  dtCurrentItemId = null;
}

function dtShowDetail(item) {
  const det = document.getElementById('dtDetail');
  if (!det) return;
  const cat = dtGetCategory(item);
  const time = formatAddedAt(item);
  const dtReadUrl = safeUrl(item.source_url) || safeUrl(item.rssLink);
  const readBtn = dtReadUrl
    ? `<a class="dt-read-btn" href="${dtReadUrl}" target="_blank" rel="noopener">CZYTAJ →</a>` : '';
  // Udostępnianie także w wersji desktop (dotąd był tylko na mobile). Archiwalny wpis niesie
  // _archiveDate/_dose — wtedy link prowadzi do konkretnego dnia/dawki, inaczej do bieżącej dawki.
  const shareSlug = itemSlug(item.text);
  const shareUrl = (item._archiveDate && item._dose)
    ? `https://brifup.com/#archive/${item._archiveDate}/${item._dose}/${shareSlug}`
    : `https://brifup.com/#${currentDose}/${shareSlug}`;
  const shareBtn = `<button class="dt-share-btn" onclick="shareItem('${escAttr(esc(shareUrl))}','${escAttr(esc(item.text))}')"><span class="dt-share-icon">↑</span>Udostępnij</button>`;
  const allItems = cache[currentDose] || [];
  const related = [];
  for (const it of allItems) {
    if (related.length >= 3) break;
    const cands = it.subItems?.length > 0 ? it.subItems : [it];
    for (const c of cands) {
      if (c.id !== item.id && related.length < 3) related.push(c);
    }
  }
  det.innerHTML = `
    <div class="dt-detail-content">
      <div class="dt-detail-flag">${escHtml(item.flag||'📰')}</div>
      <div class="dt-detail-badges"><span class="dt-detail-badge">${cat.toUpperCase()}</span>${srcBadge(item)}</div>
      <div class="dt-detail-headline">${escHtml(item.text)}</div>
      <div class="dt-detail-time">${time||'—'}</div>
      ${item.article
        ? `<div class="dt-detail-body">${escHtml(item.article)}</div>`
        : `<div class="dt-detail-no-article">Brak rozszerzonego artykułu dla tego wpisu.</div>`}
      ${impactHtml(item)}
      ${quotesHtml(item)}
      ${watekHtml(item)}
      <div class="dt-source-row">
        <div>
          <div class="dt-source-label">ŹRÓDŁO</div>
          <div class="dt-source-name">${escHtml(displaySource(item))}</div>
        </div>
        <div class="dt-detail-actions">${shareBtn}${readBtn}</div>
      </div>
    </div>
    ${related.length ? `<div class="dt-related">
      <div class="dt-related-title">Inne wpisy</div>
      ${related.map(r=>`<div class="dt-related-item" onclick="dtPickItem('${r.id}')"><span>${escHtml(r.flag||'📰')}</span><span>${escHtml(r.text.length>80?r.text.slice(0,80)+'…':r.text)}</span></div>`).join('')}
    </div>` : ''}`;
}

// ══ Wymuś świeże dane przy każdym powrocie do apki ════
// (np. po wznowieniu z tła zamiast pełnego przeładowania strony)
// Po wznowieniu apki dawka ma pasować do AKTUALNEJ godziny (rano→poranna, po 17→wieczorna itd.),
// a nie zostać na tej, którą otwarto wcześniej. getCurrentDose() liczymy na nowo z zegara —
// bez tego, gdy apka wisiała w tle przez zmianę okna (np. przez północ), pokazywała starą dawkę.
// Klik w logo „Brif.up" = powrót na AKTUALNĄ dawkę (życzenie właściciela 2026-08-01).
// Logo działa jak przycisk „strona główna": gdy czytelnik zawędrował do porannej dawki
// po południu albo do archiwum, jedno kliknięcie wraca go tam, gdzie jest świeża treść.
function logoDoAktualnejDawki() {
  const teraz = getCurrentDose();

  // Hash po deep-linku otworzyłby stary artykuł przy najbliższym routingu (routeHashDeepLink
  // słucha `hashchange` od 2026-07-22) — czyścimy go, żeby logo naprawdę wracało na początek.
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);

  dtCurrentItemId = null;   // wymusza ponowne otwarcie top story w panelu szczegółów

  if (teraz !== currentDose) {
    delete cache[teraz];    // świeże dane dla dawki, na którą wracamy
    switchDose(teraz);      // przełącza taby + ładuje; renderDesktop otworzy top story sam
  } else {
    // Ta sama dawka — nie przeładowujemy (to dałoby zbędny skeleton). Otwieramy top story wprost,
    // żeby kliknięcie ZAWSZE dawało widoczny efekt, a nie tylko czasami.
    const top = (cache[teraz] || [])[0];
    if (top && dtItemsMap[top.id]) dtPickItem(top.id);
  }

  scrollArea?.scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('dtFeedList')?.scrollTo({ top: 0 });
  document.getElementById('dtDetail')?.scrollTo({ top: 0 });
}

function syncDoseToTime() {
  const powinnaByc = getCurrentDose();
  if (powinnaByc !== currentDose) {
    delete cache[powinnaByc];      // świeże dane dla nowej dawki
    switchDose(powinnaByc);        // przełącza taby + ładuje właściwą dawkę
  } else if (cache[currentDose]) {
    // Ta sama dawka i mamy już dane → odśwież W MIEJSCU (jak live-poll): pobierz świeży briefs.json,
    // porównaj podpis i podmień TYLKO gdy coś się zmieniło. Bez tego każdy powrót do apki kasował dane
    // i przeładowywał dawkę od zera (stary DOM → skeleton → świeże = migotanie „stare artykuły, potem nowe",
    // nawet gdy nic się nie zmieniło). Teraz: nic się nie zmieniło → brak re-renderu (zero migotania);
    // zmieniło się → jedna płynna podmiana z zachowaniem scrolla.
    pollLiveUpdates();
  } else {
    loadDose(currentDose, true);   // brak danych w pamięci → pełne załadowanie ze skeletonem
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    checkAppShellUpdate();   // nowa wersja apki? → przeładuj
    syncDoseToTime();        // dawka zgodna z aktualną godziną + świeże dane
  }
});
window.addEventListener('pageshow', (event) => {
  if (event.persisted) {
    syncDoseToTime();
  }
});

// ══ Auto-odświeżanie na żywo (jak FinancialJuice) ══════════════════════════
// Gdy karta jest widoczna, co interwał sprawdzamy briefs.json bieżącej dawki. Jeśli DOSZŁY
// (lub zmieniły się) newsy, podmieniamy treść W MIEJSCU — bez pełnego przeładowania, zachowując
// pozycję scrolla i (na desktopie) otwarty artykuł. Ten sam kod obsługuje www, PWA na PC i telefon.
const LIVE_POLL_MS = 60000;

// Podpis treści niezależny od kolejności — łapie nowe/usunięte/przeredagowane newsy (po tekście + czasie).
function doseSignature(items) {
  const parts = [];
  const push = it => parts.push((it.text || '') + '|' + (it.added_at || ''));
  (items || []).forEach(it => { push(it); (it.subItems || []).forEach(push); });
  return parts.sort().join('§');
}

// Zwraca `true`, gdy dane udało się POBRAĆ (niezależnie od tego, czy był re-render), `false` gdy
// pobieranie padło. liveTick potrzebuje tego rozróżnienia, żeby nie zapisać taga po nieudanym pollu.
async function pollLiveUpdates(wymusRender = false) {
  if (document.visibilityState !== 'visible') return false;
  const overlay = document.getElementById('archiveOverlay');
  if (overlay && overlay.classList.contains('show')) return false; // nie przeszkadzaj w archiwum
  const dose = currentDose;
  let fresh;
  try { fresh = await fetchFromBriefsJson(dose); } catch (_) { return false; }
  if (!fresh || fresh === 'PUSTA' || dose !== currentDose || !cache[dose]) return false;
  // wymusRender = zmieniły się same wątki (badge 🧵) przy niezmienionej treści tej dawki — patrz refreshThreadsIfChanged
  if (!wymusRender && doseSignature(fresh) === doseSignature(cache[dose])) return true; // nic nowego, ale POBRANE

  // Przetwórz identycznie jak loadDose: własne id-ki + sortowanie (top story + reszta newest-first).
  // ⚠️ `oznaczKotwice` jest OBOWIĄZKOWE — nadaje podpozycjom `_parentText`, po którym threadForItem
  // dziedziczy wątek po kotwicy klastra. Ta ścieżka jako JEDYNA z czterech budujących cache
  // (loadDose, SAMPLE, archiwum) go nie wołała, więc po każdym live-updacie podpozycje klastrów
  // traciły badge 🧵 i oś sagi — aż do pełnego przeładowania strony.
  const processed = oznaczKotwice(fresh.map(i => ({ ...i, id: uid(), subItems: (i.subItems || []).map(s => ({ ...s, id: uid() })) })));
  processed.forEach(it => { it.subItems = sortNewestFirst(it.subItems); });
  const [top, ...rest] = processed;
  cache[dose] = top ? [top, ...sortNewestFirst(rest)] : [];

  // Zapamiętaj AKTYWNY FILTR TEMATU i pozycję scrolla — renderDose (reset mobActiveCat) i renderDesktop
  // (reset dtActiveFilter, woła je renderDose wewnętrznie) inaczej wyrzucały użytkownika z widoku tematu
  // do pełnego feedu przy każdym zapisie bota (co ~30-60 min). Teraz filtr przywracamy po re-renderze.
  const savedMobCat = mobActiveCat;
  const savedDtFilter = dtActiveFilter;
  const mobTop = scrollArea ? scrollArea.scrollTop : 0;
  const feedList = document.getElementById('dtFeedList');
  const deskTop = feedList ? feedList.scrollTop : 0;

  renderDose(dose, cache[dose]); // woła też renderDesktop wewnętrznie — drugie wywołanie było zbędne (niszczyło błysk .is-new)

  // Przywróć widok tematu, jeśli użytkownik w nim był (ten sam wzorzec co po zmianie suwaka jakości).
  if (savedMobCat && savedMobCat !== 'all') mobileFilterCat(savedMobCat);
  if (savedDtFilter) dtRenderCatFilter(savedDtFilter);

  if (scrollArea) scrollArea.scrollTop = mobTop;
  const feedList2 = document.getElementById('dtFeedList');
  if (feedList2) feedList2.scrollTop = deskTop;

  showToast('Nowe newsy');
  return true;
}

// Sprytny polling: najpierw TANIE sprawdzenie nagłówkiem (HEAD ~kilkaset bajtów) czy briefs.json
// w ogóle się zmienił; pełne dane (219 KB) ściągamy TYLKO gdy zmienił się jego ETag/rozmiar. Dzięki
// temu można pytać często (co minutę), a transfer zostaje znikomy — efekt prawie jak push.
let lastBriefsTag = null;

async function probeBriefsTag() {
  try {
    const r = await fetch('./briefs.json', { method: 'HEAD', cache: 'no-store' });
    if (!r.ok) return null;
    return r.headers.get('etag') || r.headers.get('last-modified') || r.headers.get('content-length');
  } catch (_) { return null; }
}

async function liveTick() {
  if (document.visibilityState !== 'visible') return;
  const overlay = document.getElementById('archiveOverlay');
  if (overlay && overlay.classList.contains('show')) return;
  const tag = await probeBriefsTag();
  if (tag !== null && tag === lastBriefsTag) return; // plik bez zmian → nic nie pobieramy
  // ⚠️ Taga NIE zapisujemy tutaj. Wcześniej szedł w tym miejscu — czyli PRZED pobraniem danych —
  // więc gdy pełny GET briefs.json padł na chwilowym błędzie sieci, tag był już podmieniony i żadna
  // gałąź go nie cofała. Kolejne tiki co 60 s trafiały w „tag === lastBriefsTag → return" i update
  // przepadał do NASTĘPNEGO zapisu bota (30-60 min): auto-odświeżanie działało, a treść stała.
  // Teraz zapis następuje dopiero po udanym pobraniu, więc nieudany tik po prostu ponawia za minutę.
  // Bot zapisuje threads.json w tym samym biegu co briefs.json — dociągamy je RAZEM, więc badge 🧵
  // nadąża za przepisanymi nagłówkami kontynuacji i nowymi węzłami sag (koszt: 1 mały fetch na bieg bota).
  const watkiZmienione = await refreshThreadsIfChanged();
  // quotes.json bot zapisuje w tym samym biegu — notowania muszą nadążać za treścią, inaczej kafel
  // pokazuje cenę sprzed godzin przy świeżym newsie (ta sama pułapka co z mapą wątków).
  const notowaniaZmienione = await refreshQuotesIfChanged();
  const pobrano = await pollLiveUpdates(watkiZmienione || notowaniaZmienione);
  // `tag === null` = HEAD niedostępny; wtedy i tak lecimy pełnym pollem przy każdym tiku.
  if (pobrano) lastBriefsTag = tag;
}

// Ustal punkt odniesienia na starcie, żeby pierwszy tik nie ściągał całości bez potrzeby.
probeBriefsTag().then(t => { if (t) lastBriefsTag = t; });
// Notowania dociągane równolegle z pierwszym renderem — po załadowaniu odśwież widok, żeby wykres
// pojawił się bez czekania na live-tick (ten sam wzorzec co loadThreads wyżej).
loadQuotes().then(() => {
  try { if (typeof currentDose !== 'undefined' && cache[currentDose]) renderDose(currentDose, cache[currentDose]); } catch(_){}
});
setInterval(liveTick, LIVE_POLL_MS);

// ═══ MOBILE SWIPE PANEL — funkcje ═══════════════════════════════════════════

function mobSwpOpen() {
  // Odśwież listy przy otwarciu — archiwum ładuje się asynchronicznie po starcie.
  const items = cache[currentDose];
  if (items) mobSwpBuildCats(items);
  mobSwpBuildArchive();
  const panel = document.getElementById('mobSwpPanel');
  panel.classList.remove('peek');
  panel.classList.add('open');
  const ov = document.getElementById('mobSwpOv');
  ov.classList.remove('peek');
  ov.classList.add('vis');
}
function mobSwpPeek() {
  // Podgląd panelu (60% szerokości) — kontynuacja swipe'a dawek po dojściu do "porannej".
  const items = cache[currentDose];
  if (items) mobSwpBuildCats(items);
  mobSwpBuildArchive();
  document.getElementById('mobSwpPanel').classList.add('peek');
  document.getElementById('mobSwpOv').classList.add('peek');
}
function mobSwpClose() {
  const panel = document.getElementById('mobSwpPanel');
  panel.classList.remove('open', 'dragging', 'peek');
  panel.style.transform = '';
  const ov = document.getElementById('mobSwpOv');
  ov.classList.remove('vis', 'dragging', 'peek');
  ov.style.background = '';
}

function mobSwpBuildCats(items) {
  const counts = {};
  // Liczymy tak jak desktop: klastry rozbijamy na podwpisy
  let total = 0;
  items.forEach(it => {
    if (it.subItems?.length > 0) {
      it.subItems.forEach(sub => {
        const c = dtGetCategory(sub);
        counts[c] = (counts[c] || 0) + 1;
        total++;
      });
    } else {
      const c = dtGetCategory(it);
      counts[c] = (counts[c] || 0) + 1;
      total++;
    }
  });
  // Kategorie liczymy też z archiwum (jak sidebar PC) — inaczej temat bez itemów w bieżącej dawce
  // nie pojawia się w panelu, mimo że klik pokazuje cross-day. total zostaje = bieżąca dawka ("Wszystko").
  (typeof dtArchiveAllItems !== 'undefined' ? dtArchiveAllItems : []).forEach(it => {
    if (it.subItems?.length > 0) it.subItems.forEach(sub => { const c = dtGetCategory(sub); counts[c] = (counts[c] || 0) + 1; });
    else { const c = dtGetCategory(it); counts[c] = (counts[c] || 0) + 1; }
  });
  const catsEl = document.getElementById('mobSwpCats');
  if (!catsEl) return;
  catsEl.innerHTML =
    `<button class="mob-swp-cat${!mobActiveCat || mobActiveCat === 'all' ? ' act' : ''}" data-cat="all" onclick="mobileFilterCat('all');mobSwpClose()">
      <span class="mob-swp-cat-nm" style="font-style:normal">Wszystko</span>
      <span class="mob-swp-cat-cnt">${total}</span>
    </button>` +
    (() => { const obecne = DT_CAT_ORDER.filter(c => counts[c]); return obecne.map(c =>
      konfliktyHeaderHtml(c, obecne, 'mob-swp-group') +
      `<button class="mob-swp-cat${mobActiveCat === c ? ' act' : ''}" data-cat="${c}" onclick="mobileFilterCat('${c.replace(/'/g,"\\'")}');mobSwpClose()">
        ${catMarker(c, 'mob-swp-cat-dot', 'mob-swp-cat-flag')}
        <span class="mob-swp-cat-nm">${c}</span>
        ${catRightFlag(c, 'mob-swp-cat-rflag')}
        <span class="mob-swp-cat-cnt">${counts[c]}</span>
        ${catLevelBarHtml(c)}
      </button>`
    ).join(''); })();
  const meta = document.getElementById('mobSwpMeta');
  const doseLabels = { morning: 'PORANNA ☀️', afternoon: 'POŁUDNIOWA 🌤', evening: 'WIECZORNA 🌛' };
  if (meta) meta.textContent = doseLabels[currentDose] || '';
  ['morning','afternoon','evening'].forEach(d => {
    const btn = document.getElementById('mobDoseBtn-' + d);
    if (btn) btn.classList.toggle('act', d === currentDose);
  });
}

// Markup mobilnej karty (klaster albo pojedynczy) — ten sam co w renderDose, reużyty w widoku kategorii.
// Rozwijanie działa czysto na DOM (toggleGroup/toggleSubItem), bo treść renderujemy inline tutaj.
function mobCatCardHtml(item, num) {
  const isGroup = item.subItems && item.subItems.length > 0;
  if (isGroup) {
    return `
      <div class="news-item" id="group-${item.id}" data-text="${escAttr(item.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleGroup('${item.id}')">
        ${srcBadge(item) ? `<div class="card-corner">${srcBadge(item)}</div>` : ''}
        <div class="news-num">${num}</div>
        <div class="news-body">
          <span class="news-flag">${escHtml(item.flag||'📰')}</span>
          <div class="news-title">${escHtml(item.text)}</div>
        </div>
        <div class="news-arrow">›</div>
      </div>
      <div class="sub-items-container" id="subc-${item.id}">${renderSubItems(item.subItems)}</div>`;
  }
  return `
    <div class="news-item" id="item-${item.id}" data-text="${escAttr(item.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleSubItem('${item.id}')">
      <div class="news-num">${num}</div>
      <div class="news-body">
        <span class="news-flag">${escHtml(item.flag||'📰')}</span>
        <div class="news-title">${escHtml(item.text)}</div>
      </div>
      ${item.added_at ? `<div class="item-time">${formatAddedAt(item)}</div>` : ''}
      <div class="news-arrow">›</div>
    </div>
    <div class="card-expand" id="exp-${item.id}">${expandBlock(item)}</div>`;
}

// Klik w kategorię (mobile) = parytet z PC: przerysowuje #content na WSZYSTKIE pasujące artykuły
// z dzisiejszej dawki + całego archiwum, pogrupowane nagłówkami dat. 'all' wraca do normalnej dawki.
function mobileFilterCat(cat) {
  mobActiveCat = cat || 'all';
  document.querySelectorAll('.mob-swp-cat').forEach(el => {
    el.classList.toggle('act', el.dataset.cat === mobActiveCat);
  });
  const contentEl = document.getElementById('content');
  if (!contentEl) return;

  if (mobActiveCat === 'all') {
    const items = cache[currentDose];
    if (items) renderDose(currentDose, items);   // wraca do widoku dawki (z filtrem suwaka)
    return;
  }

  const c = mobActiveCat;
  const matchesCat = it => it.subItems?.length > 0 ? it.subItems.some(sub => dtGetCategory(sub) === c) : dtGetCategory(it) === c;
  const today = todayLocalISO();
  const matching = [];
  (cache[currentDose] || []).filter(matchesCat).forEach(it => matching.push({ it, d: today }));
  (typeof dtArchiveAllItems !== 'undefined' ? dtArchiveAllItems : []).filter(matchesCat).forEach(it => matching.push({ it, d: it._archiveDate }));

  // Suwak jakości PER TEMAT = percentyl (top X% tematu wg meatScore). Podłoga: min 1 (nie pustoszej).
  const pct = getCatPct(c);
  let survivors = matching;
  if (pct < 100) {
    survivors = topPctByScore(matching, pct, x => meatScore(x.it));
  }

  const byDate = {};
  survivors.forEach(x => { (byDate[x.d] = byDate[x.d] || []).push(x.it); });
  const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));

  let html = catFillBarHtml(c);
  let n = 0;
  dates.forEach(d => {
    const label = d === today
      ? 'Dziś'
      : new Date(d+'T00:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
    html += `<div class="mob-cat-daysep"><span>${label}</span></div>`;
    byDate[d].forEach(item => {
      n++;
      if (!item.id) item.id = 'c-' + uid();                              // itemy z archiwum nie mają id
      if (item.subItems) item.subItems.forEach(s => { if (!s.id) s.id = 'c-' + uid(); });
      html += mobCatCardHtml(item, String(n).padStart(2,'0'));
    });
  });
  contentEl.innerHTML = html || '<div class="archive-empty" style="padding:40px 16px;text-align:center;color:var(--muted)">Brak artykułów w tej kategorii.</div>';
  const sa = document.getElementById('scrollArea'); if (sa) sa.scrollTop = 0;

  // Reszta archiwum dociąga się dopiero tutaj (patrz `dowczytajCaleArchiwum`). Po doczytaniu
  // przerysowujemy widok, ale PRZYWRACAMY przewinięcie — `mobileFilterCat` samo zjeżdża na górę,
  // a wyrzucenie czytelnika na początek listy w trakcie czytania byłoby gorsze niż brak dopisku.
  dowczytajCaleArchiwum(() => {
    if (mobActiveCat !== c) return;
    const el = document.getElementById('scrollArea');
    const y = el ? el.scrollTop : 0;
    mobileFilterCat(c);
    if (el) el.scrollTop = y;
  });
}

// Lista dni archiwum w panelu bocznym (parytet z sidebar PC). Klik otwiera istniejącą nakładkę archiwum.
function mobSwpBuildArchive() {
  const el = document.getElementById('mobSwpArchive');
  if (!el) return;
  const dni = (typeof archiveDatesCache !== 'undefined' && archiveDatesCache) ? archiveDatesCache.slice() : [];
  if (!dni.length) {
    el.innerHTML = `<div class="mob-swp-cat" style="opacity:.5;cursor:default"><span class="mob-swp-cat-nm" style="font-style:normal;font-size:12px">Jeszcze puste</span></div>`;
    return;
  }
  dni.sort((a,b) => b.localeCompare(a));
  let html = dni.slice(0,7).map(d => {
    const label = new Date(d+'T00:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'long'});
    return `<button class="mob-swp-cat" onclick="openArchiveToDay('${d}');mobSwpClose()">
      <span class="mob-swp-cat-dot" style="background:#8a8577"></span>
      <span class="mob-swp-cat-nm" style="font-size:13px">${label}</span>
    </button>`;
  }).join('');
  if (dni.length > 7) {
    html += `<button class="mob-swp-cat" onclick="openArchive();mobSwpClose()">
      <span class="mob-swp-cat-nm" style="font-style:normal;font-size:12px;color:var(--muted)">Zobacz wszystkie →</span>
    </button>`;
  }
  el.innerHTML = html;
}

function mobGripPulse() {
  const grip = document.getElementById('mobEdgeGrip');
  if (!grip) return;
  grip.classList.remove('pulsing');
  void grip.offsetWidth; // reflow, żeby restart animacji zadziałał
  grip.classList.add('pulsing');
}

// ═══ MOBILE SWIPE PANEL — gest touch/mouse ═══════════════════════════════════
(function() {
  const PW = 260;
  let sx = 0, sy = 0, tracking = false, panelOpen = false, moved = false;

  function getPanel() { return document.getElementById('mobSwpPanel'); }
  function getOv()    { return document.getElementById('mobSwpOv'); }

  function startTrack(x, y) {
    const panel = getPanel();
    panelOpen = panel.classList.contains('open');
    if (!panelOpen && x > 44) return;
    sx = x; sy = y; tracking = true; moved = false;
  }

  function moveTrack(x, y) {
    if (!tracking) return;
    const dx = x - sx, dy = y - sy;
    if (!moved && Math.abs(dy) > Math.abs(dx) + 6) { tracking = false; return; }
    moved = true;
    const panel = getPanel(), ov = getOv();
    panel.classList.add('dragging');
    ov.style.display = 'block';
    const t = panelOpen
      ? Math.min(0, Math.max(-PW, dx))
      : Math.max(-PW, Math.min(0, dx - PW));
    panel.style.transform = `translateX(${t}px)`;
    const pct = (t + PW) / PW;
    ov.style.background = `rgba(0,0,0,${(pct * 0.45).toFixed(2)})`;
  }

  function endTrack(x) {
    if (!tracking) return;
    tracking = false;
    if (!moved) return;
    const dx = x - sx;
    const panel = getPanel(), ov = getOv();
    panel.classList.remove('dragging');
    panel.style.transform = '';
    ov.style.background = '';
    ov.style.display = '';
    if (!panelOpen) {
      dx > PW * 0.28 ? mobSwpOpen() : mobSwpClose();
    } else {
      dx < -(PW * 0.28) ? mobSwpClose() : mobSwpOpen();
    }
  }

  // Touch
  document.addEventListener('touchstart', e => startTrack(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  document.addEventListener('touchmove',  e => { if (tracking) moveTrack(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  document.addEventListener('touchend',   e => endTrack(e.changedTouches[0].clientX));

  // Mouse (do testowania na desktopie)
  let mdown = false;
  document.addEventListener('mousedown', e => {
    const panel = getPanel();
    if (!panel) return;
    const isOnPanel = panel.contains(e.target) || e.target.id === 'mobEdgeGrip';
    if (e.clientX <= 44 || panel.classList.contains('open') || isOnPanel) {
      startTrack(e.clientX, e.clientY); mdown = true;
    }
  });
  document.addEventListener('mousemove', e => { if (mdown) moveTrack(e.clientX, e.clientY); });
  document.addEventListener('mouseup',   e => { if (mdown) { mdown = false; endTrack(e.clientX); } });
})();
