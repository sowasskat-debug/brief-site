<script>

// Awaryjne dane przykładowe — używane WYŁĄCZNIE gdy briefs.json jest nieosiągalny (ostatni fallback

const SAMPLE = {

  ],
  afternoon: [
    { flag:'📡', text:'Nie udało się pobrać południowej dawki — sprawdź połączenie i odśwież.', source_name:'Brif.up', source_url:'#',
      article:'To dane zastępcze: aplikacja nie mogła pobrać pliku z newsami (brak sieci albo chwilowa awaria hostingu). Pociągnij w dół albo użyj przycisku odświeżania — realna treść wróci, gdy tylko połączenie zadziała.' },
  ],
  evening: [
    { flag:'📡', text:'Nie udało się pobrać wieczornej dawki — sprawdź połączenie i odśwież.', source_name:'Brif.up', source_url:'#',
      article:'To dane zastępcze: aplikacja nie mogła pobrać pliku z newsami (brak sieci albo chwilowa awaria hostingu). Pociągnij w dół albo użyj przycisku odświeżania — realna treść wróci, gdy tylko połączenie zadziała.' },

};

// Dawka ISTNIEJE w briefs.json, ale bot jeszcze nic do niej nie wybrał (normalne okno tuż po granicy
// dawki, np. 17:00-18:00 dla wieczornej — bot founduje dawkę pustą i dosypuje z kolejnymi biegami).
// To NIE jest błąd sieci — stąd osobny, uczciwy komunikat zamiast „sprawdź połączenie" (2026-07-20:
// właściciel dostał mylący komunikat o awarii przy świeżo założonej, jeszcze pustej wieczornej dawce).
const PUSTA_DAWKA = {
  morning: [
    { flag:'⏳', text:'Poranna dawka w przygotowaniu — zbieramy pierwsze newsy.', source_name:'Brif.up', source_url:'#',
      article:'Nowa dawka właśnie wystartowała i jest jeszcze pusta. Przeglądamy źródła co pół godziny — pierwsze newsy pojawią się wkrótce i wskoczą tu automatycznie, bez odświeżania.' },
  ],
  afternoon: [
    { flag:'⏳', text:'Południowa dawka w przygotowaniu — zbieramy pierwsze newsy.', source_name:'Brif.up', source_url:'#',
      article:'Nowa dawka właśnie wystartowała i jest jeszcze pusta. Przeglądamy źródła co pół godziny — pierwsze newsy pojawią się wkrótce i wskoczą tu automatycznie, bez odświeżania.' },
  ],
  evening: [
    { flag:'⏳', text:'Wieczorna dawka w przygotowaniu — zbieramy pierwsze newsy.', source_name:'Brif.up', source_url:'#',
      article:'Nowa dawka właśnie wystartowała i jest jeszcze pusta. Przeglądamy źródła co pół godziny — pierwsze newsy pojawią się wkrótce i wskoczą tu automatycznie, bez odświeżania.' },
  ],
};

let currentDose = getCurrentDose();
let cache = {};

// ═══ Suwak jakości PER TEMAT — PERCENTYL (pokaż top X% newsów DANEGO tematu) ═══
// Zamiast progu ABSOLUTNEGO (niesprawiedliwy: "Wojna Iran" ma reach 30-40, "Tech" 5-15 → ten sam próg kosił
// Tech, a Iran zostawiał w całości), suwak = "pokaż top X% newsów TEGO tematu" wg meatScore. Auto-normalizuje
// się: każdy temat skaluje się względem SIEBIE. catMeatPct[cat] = 0..100 (100 = wszystko, mniej = mniej).

// Ocena "grubości/ważności" newsa. Percentyl per-temat sprawia, że liczy się RANKING w obrębie tematu, nie skala
// absolutna — więc sygnały można bezpiecznie mieszać:
//  - reach: ile RÓŻNYCH redakcji pisze o temacie (bot) — baza,
//  - klaster: ile źródeł bot skleił w temat (korroboracja rzadkich fraz, których reach się zeruje),
//  - impact: news z linią "Wpływ na rynek" dostaje bonus — liczy się TYLKO gdy jest, więc w "Świat"/"Polityka
//    lokalna" (impact rzadki, 8-9% wpisów) prawie nie działa, a w Iran/Surowce/Fed (37-71%) wypycha
//    market-moverów w górę. Zero konfiguracji per-temat — dane same się dobierają.
function meatScore(item) {
  if (!item) return 0;
  const cluster = (item.subItems && item.subItems.length ? item.subItems.length : 1);
  const reach = (typeof item.reach === 'number' && item.reach > 0) ? item.reach : 0;
  const hasImpact = !!(item.impact && String(item.impact).trim());
  return reach + (cluster > 1 ? cluster * 6 : 0) + (hasImpact ? 12 : 0);
}

let catMeatPct = {};
try { catMeatPct = JSON.parse(localStorage.getItem('brifup_cat_pct') || '{}'); } catch (e) { catMeatPct = {}; }
function getCatPct(cat) { const v = catMeatPct[cat]; return (typeof v === 'number') ? v : 100; }
function setCatPct(cat, pct) {
  catMeatPct[cat] = pct;
  try { localStorage.setItem('brifup_cat_pct', JSON.stringify(catMeatPct)); } catch (e) {}
}

// Zostaw top ceil(pct% * N) pozycji wg score (min 1 = podłoga: temat nigdy nie pustoszeje).
function topPctByScore(arr, pct, scoreOf) {
  if (pct >= 100) return arr.slice();
  const n = Math.max(1, Math.ceil(arr.length * pct / 100));
  return arr.slice().sort((a, b) => scoreOf(b) - scoreOf(a)).slice(0, n);
}

// Filtruje GŁÓWNY feed percentylem PER TEMAT — każdy news oceniany w obrębie SWOJEJ kategorii (dtGetCategory).
// items[0] (top story) zawsze zostaje.
function filterByCatMeat(items) {
  if (!items || items.length <= 1) return items;
  if (!Object.keys(catMeatPct).some(c => getCatPct(c) < 100)) return items; // wszystko na 100% → nie filtruj
  const keep = new Set([0]);
  const byCat = {};
  items.forEach((it, i) => { const c = dtGetCategory(it); (byCat[c] = byCat[c] || []).push(i); });
  Object.keys(byCat).forEach(c => {
    const pct = getCatPct(c);
    const idxs = byCat[c];
    if (pct >= 100) { idxs.forEach(i => keep.add(i)); return; }
    topPctByScore(idxs, pct, i => meatScore(items[i])).forEach(i => keep.add(i));
  });
  return items.filter((it, i) => keep.has(i));
}

// Pasek-suwak pod nazwą tematu — wypełnienie = % newsów tematu które przechodzą (100% = wszystko).
function catFillBarHtml(cat) {
  const pct = getCatPct(cat);
  return `<div class="cat-fill-bar" data-cat="${cat.replace(/"/g,'&quot;')}">
    <div class="cat-fill-bar-fill" style="width:${pct}%"></div>
    <div class="cat-fill-bar-row">
      <span class="cat-fill-bar-name">${cat}</span>
      <span class="cat-fill-bar-pct">${pct}%</span>
    </div>
  </div>`;
}
// READ-ONLY pasek poziomu pod nazwą tematu na LIŚCIE (osobna klasa .cat-level-bar, pointer-events:none — nie łapie gestu).
function catLevelBarHtml(cat) {
  const pct = getCatPct(cat);
  return `<div class="cat-level-bar${pct >= 100 ? ' is-full' : ''}" data-cat="${String(cat).replace(/"/g,'&quot;')}"><div class="cat-level-fill" style="width:${pct}%"></div></div>`;
}
function refreshCatLevelBars(cat) {
  const pct = getCatPct(cat);
  document.querySelectorAll('.cat-level-bar').forEach(bar => {
    if (bar.dataset.cat === cat) { bar.classList.toggle('is-full', pct >= 100); const f = bar.querySelector('.cat-level-fill'); if (f) f.style.width = pct + '%'; }
  });
}
// Przeciąganie palcem/myszą wprost po pasku tematu — zmienia % NA ŻYWO, zapisuje przy puszczeniu.
(function() {
  let dragging = false, barEl = null;
  function pctFromEvent(e, bar) {
    const rect = bar.getBoundingClientRect();
    return Math.max(0, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
  }
  function paint(pct) {
    const fill = barEl.querySelector('.cat-fill-bar-fill');
    const lbl = barEl.querySelector('.cat-fill-bar-pct');
    if (fill) fill.style.width = pct + '%';
    if (lbl) lbl.textContent = pct + '%';
  }
  document.addEventListener('pointerdown', e => {
    const bar = e.target.closest('.cat-fill-bar');
    if (!bar) return;
    dragging = true; barEl = bar;
    bar.setPointerCapture(e.pointerId);
    paint(pctFromEvent(e, bar));
  });
  document.addEventListener('pointermove', e => { if (dragging && barEl) paint(pctFromEvent(e, barEl)); });
  document.addEventListener('pointerup', e => {
    if (!dragging || !barEl) return;
    dragging = false;
    const pct = pctFromEvent(e, barEl);
    const cat = barEl.dataset.cat;
    barEl = null;
    setCatPct(cat, pct);
    refreshCatLevelBars(cat);
    if (mobActiveCat === cat) mobileFilterCat(cat);
    if (dtActiveFilter === cat) dtRenderCatFilter(cat);
  });
})();

let doseDates = {};   // data (YYYY-MM-DD) treści każdej dawki z briefs.json — do wykrycia „wczorajszego wydania"
let lastScrollY = 0, tabsHidden = false;
let suppressScrollHide = false;
let mobActiveCat = null;

const scrollArea = document.getElementById('scrollArea');
scrollArea.addEventListener('scroll', function() {
  const sy = this.scrollTop;
  const delta = sy - lastScrollY;

  // Ignoruj skoki spowodowane zmianą layoutu (np. otwarcie/zamknięcie klastra),
  // a nie realnym przewijaniem palcem — duży, nagły skok w jedną ramkę.
  if (suppressScrollHide || Math.abs(delta) > 150) {
    lastScrollY = sy;
    return;
  }

  const tabs = document.getElementById('doseTabs');
  if (delta > 0 && sy > 40 && !tabsHidden) {
    tabs.classList.add('hidden'); this.classList.add('tabs-hidden'); tabsHidden = true;
  } else if (delta < -8 && tabsHidden) {
    tabs.classList.remove('hidden'); this.classList.remove('tabs-hidden'); tabsHidden = false;
  }
  lastScrollY = sy;
}, { passive: true });

function getCurrentDose() {
  const h = new Date().getHours();
  return h < 11 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
}
// Data DZIŚ w formacie 'YYYY-MM-DD' (lokalna, jak bot dla Europe/Warsaw) — do wykrycia starej dawki
function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Czy oglądana dawka to jeszcze wczorajsze wydanie (dzisiejsze jeszcze nie powstało)?
function isPrevEdition(dose) {
  const d = doseDates[dose];
  return !!d && d < todayLocalISO();
}
// 'YYYY-MM-DD' -> np. '1 lip'
function formatDoseDate(iso) {
  const p = (iso || '').split('-').map(Number);
  if (p.length !== 3) return '';
  return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('pl-PL', { day:'numeric', month:'short' });
}
function uid() { return Math.random().toString(36).slice(2,9); }
// String w inline-JS (onclick='...'): escapuje \ ' " i nowe linie — SAMO escAttr nie chroni apostrofu,
// a apostrof w tytule (np. „Trump's…") rozrywał JS w onclick przycisku Udostępnij. Używać ZAWSZE w parze: escAttr(esc(...)).
function esc(s='') { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/[\r\n]/g,' '); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ══ briefs.json — generowany przez bota na Telegramie ═
// Świeżość per-dawka jest już zarządzana po stronie bota (Europe/Warsaw),
// front-end ufa serwerowi i nie porównuje dat między różnymi zegarami/strefami.
async function fetchFromBriefsJson(dose) {
  try {
    // Znak zapytania z timestampem: CDN przed GitHub Pages (Cloudflare itp.) cache'uje
    // po pełnym URL, a nagłówek cache:'no-store' dotyczy tylko cache przeglądarki —
    // bez unikalnego query stringa CDN mógł serwować nieaktualną wersję pliku.
    const r = await fetch(`./briefs.json?_=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return null;
    const d = await r.json();
    const doseData = d?.[dose];
    if (!doseData) return null;
    doseDates[dose] = doseData.date || null;   // data treści tej dawki (do oznaczenia starego wydania)
    // Dawka założona, ale jeszcze bez itemów → sentinel 'PUSTA' (odróżnia „bot jeszcze nie wybrał"
    // od realnej awarii pobierania; loadDose pokazuje wtedy PUSTA_DAWKA zamiast SAMPLE).
    if (!doseData.items?.length) return 'PUSTA';
    return doseData.items;
  } catch(e) { return null; }
}


async function loadDose(dose, force=false) {
  if (cache[dose] && !force) { renderDose(dose, cache[dose]); return; }
  renderSkeleton();
  doseDates[dose] = null;   // reset — ustawi się przy udanym pobraniu z briefs.json/supabase
  try {
    let items = await fetchFromBriefsJson(dose);

    if (items === 'PUSTA') items = PUSTA_DAWKA[dose];
    else if (!items) items = SAMPLE[dose];

    cache[dose] = oznaczKotwice(items.map(i => ({ ...i, id: uid(), subItems: (i.subItems || []).map(sub => ({ ...sub, id: uid() })) })));
    // Sub-itemy w klastrach: newest-first. Top-level: zachowaj [0] jako top story wybrany przez bota,
    // resztę sortuj newest-first.
    cache[dose].forEach(it => { it.subItems = sortNewestFirst(it.subItems); });
    const [topStory, ...rest] = cache[dose];
    cache[dose] = topStory ? [topStory, ...sortNewestFirst(rest)] : [];
    // Render TYLKO gdy ta dawka to wciąż aktywna — inaczej wyścig dwóch równoległych loadDose (np. deep-link
    // #evening tuż po starcie na 'morning', albo szybkie klikanie zakładek) wrzucał treść jednej dawki pod
    // zakładkę drugiej. Cache wypełniamy zawsze (deep-link tryOpen go czyta), gate dotyczy tylko renderu.
    if (dose === currentDose) renderDose(dose, cache[dose]);
  } catch(e) {
    cache[dose] = oznaczKotwice(SAMPLE[dose].map(i => ({ ...i, id: uid(), subItems: (i.subItems || []).map(sub => ({ ...sub, id: uid() })) })));
    cache[dose].forEach(it => { it.subItems = sortNewestFirst(it.subItems); });
    cache[dose] = sortNewestFirst(cache[dose]);
    if (dose === currentDose) renderDose(dose, cache[dose]);
  }
}

function formatAddedAt(item) {
  if (!item.added_at) return '';
  const [datePart, timePart] = item.added_at.split(' ');
  if (!datePart || !timePart) return '';
  const [, m, d] = datePart.split('-');
  return `${d}.${m} · ${timePart}`;
}

// ── Sortowanie do wyświetlania: NAJNOWSZE ZAWSZE NA GÓRZE ──────────────
// Autorytatywne, deterministyczne, po stronie frontu — NIE polegamy na kolejności
// z bota/DeepSeeka (ta bywa zawodna). Front to ostatnia warstwa, więc gwarantuje
// poprawną kolejność niezależnie od tego, co przyjdzie w briefs.json.
function itemTimestamp(it) {
  // Dla klastra bierzemy NAJNOWSZY sub-item, żeby klaster ze świeżym newsem szedł do góry
  const cands = (it.subItems && it.subItems.length) ? it.subItems : [it];
  let best = 0;
  for (const s of cands) {
    if (!s || !s.added_at) continue;
    const t = Date.parse(String(s.added_at).replace(' ', 'T'));
    if (!isNaN(t) && t > best) best = t;
  }
  return best; // brak daty → 0 → ląduje na dole
}
function sortNewestFirst(items) {
  // slice() — nie mutujemy oryginału; stabilny sort zachowuje kolejność przy równych czasach
  return (items || []).slice().sort((a, b) => itemTimestamp(b) - itemTimestamp(a));
}

// ═══ Podświetlenie NOWYCH artykułów (od ostatniej wizyty) — bez napisów, sam chwilowy błysk ═══
// Próg "nowości" USTALONY na starcie sesji (nie rusza się przy zmianie dawki), żeby wszystkie dawki
// porównywać do tego samego momentu wejścia. Pierwsza wizyta (brak zapisu) → Infinity = nic nie błyska.
const sessionNewThreshold = (function () {
  const raw = localStorage.getItem('brifup_last_seen');
  return raw === null ? Infinity : (parseFloat(raw) || 0);
})();
const _flashedItems = new Set(); // żeby ten sam item nie błyskał ponownie przy re-renderze / live-update
function markNewItems(items) {
  if (!items || !items.length) return;
  const desktop = (typeof isDesktop === 'function') && isDesktop();
  let maxTs = 0;
  items.forEach(it => {
    const ts = itemTimestamp(it);
    if (ts > maxTs) maxTs = ts;
    if (ts > sessionNewThreshold && !_flashedItems.has(it.id)) {
      const prefix = desktop ? 'dti-' : (it.subItems && it.subItems.length ? 'group-' : 'item-');
      const el = document.getElementById(prefix + it.id);
      if (el) {
        _flashedItems.add(it.id);
        el.classList.add('is-new');
        el.addEventListener('animationend', () => el.classList.remove('is-new'), { once: true });
      }
    }
  });
  // Przesuń zapisany baseline do przodu (na następną wizytę). NIE ruszamy sessionNewThreshold w tej sesji.
  const prev = parseFloat(localStorage.getItem('brifup_last_seen') || '0') || 0;
  if (maxTs > prev) { try { localStorage.setItem('brifup_last_seen', String(maxTs)); } catch (e) {} }
}

function itemSlug(text) {
  let h = 5381;
  for (let i = 0; i < Math.min(text.length, 80); i++) {
    h = ((h << 5) + h) ^ text.charCodeAt(i);
    h = h >>> 0;
  }
  return h.toString(36);
}

async function shareItem(url, title) {
  if (navigator.share) {
    try {
      await navigator.share({ title: 'BrifUp', text: title, url });
      return;
    } catch(e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link skopiowany');
  } catch(e) {
    showToast('Nie można skopiować linku');
  }
}

// (usunięto zdublowaną, słabszą definicję escAttr — obowiązuje pełna wersja niżej, escapująca też < >)

// Nazwa źródła do wyświetlenia. Gdy bot nie zapisał source_name, ale jest odnośnik (source_url
// lub rssLink), pokaż domenę zamiast "—" — skoro jest link "Czytaj", źródło nie jest nieznane.
function displaySource(item) {
  if (item && item.source_name) return item.source_name;
  const link = (item && item.source_url && item.source_url !== '#') ? item.source_url : (item && item.rssLink) || '';
  if (!link) return '—';
  try {
    const h = new URL(link).hostname.replace(/^www\./, '');
    return h || '—';
  } catch (_) { return '—'; }
}

// Ile RÓŻNYCH źródeł potwierdza dany klaster (to samo wydarzenie opisane przez kilka serwisów).
// Liczymy unikalne nazwy/domeny źródeł wśród podpunktów — sygnał wiarygodności. 0 = nie pokazujemy.
function confirmCount(item) {
  if (!item || !item.subItems || item.subItems.length < 2) return 0;
  const s = new Set();
  item.subItems.forEach(sub => { const d = displaySource(sub); if (d && d !== '—') s.add(d.toLowerCase()); });
  return s.size;
}
// Polska odmiana: 1 źródło, 2-4 źródła, 5+ źródeł
function zrodloPl(n) {
  if (n === 1) return 'źródło';
  const d = n % 10, dd = n % 100;
  return (d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) ? 'źródła' : 'źródeł';
}
// Znaczek wiarygodności "🧭 N źródeł" — pusty gdy mniej niż 2 różne źródła.
function srcBadge(item) {
  const n = confirmCount(item);
  return n >= 2 ? `<span class="src-badge"><span class="src-check">✓</span>${n} ${zrodloPl(n)}</span>` : '';
}

// Wiersz meta pod nagłówkiem (mobile feed): mini-kategoria + sygnał źródeł.
// Źródła: preferuje pole reach (ile redakcji pisze o temacie), fallback na confirmCount (klaster).
function catMetaRow(item) {
  const cat = dtGetCategory(item);
  const n = (typeof item.reach === 'number' && item.reach >= 2) ? item.reach : confirmCount(item);
  const src = n >= 2
    ? `<span class="news-cat-sep">·</span><span class="news-cat-src"><span class="src-check">✓</span>${n} ${zrodloPl(n)}</span>`
    : '';
  return `<div class="news-cat-row"><span class="news-flag">${escHtml(item.flag||'📰')}</span><span class="news-cat-name">${cat}</span>${src}${watekBadgeHtml(item)}</div>`;
}

// Linia "Wpływ na rynek": koloruje strzałki ↑ (zielony) / ↓ (czerwony)
function impactHtml(item) {
  if (!item.impact) return '';
  const colored = escHtml(item.impact)
    .replace(/↑/g, '<span class="imp-up">↑</span>')
    .replace(/↓/g, '<span class="imp-down">↓</span>');
  return `<div class="impact-box">
    <span class="impact-label">Wpływ na rynek</span>
    <span class="impact-text">${colored}</span>
  </div>`;
}

// ══ Wątek tematyczny (timeline) — czyta threads.json (bot), 0 tokenów per klik ══
let THREADS = null;
let THREAD_BY_TEXT = new Map();
function normThreadKey(s){ return (s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
async function loadThreads(){
  try {
    const r = await fetch(`./threads.json?_=${Date.now()}`, { cache:'no-store' });
    if (!r.ok) return;
    THREADS = await r.json();
    const map = new Map();
    (THREADS.threads||[]).forEach(t => {
      if (!t.nodes || t.nodes.length < 2) return;              // wątek = min. 2 etapy
      t.nodes.forEach(n => { if (n && n.text) map.set(normThreadKey(n.text), t); });
    });
    THREAD_BY_TEXT = map;
  } catch(_){}
}
function threadForItem(item){
  if (!item || !item.text) return null;
  const wlasny = THREAD_BY_TEXT.get(normThreadKey(item.text));
  if (wlasny) return wlasny;
  // ⚠️ PODPOZYCJA KLASTRA DZIEDZICZY WĄTEK PO KOTWICY (2026-08-04, zgłoszenie właściciela: „skoro jakiś
  // post znajduje się w wątku, to powinien ten wątek być do niego przyczepiony"). Bot buduje sagi
  // WYŁĄCZNIE z pozycji top-level, więc news wchłonięty do klastra przestaje być węzłem i tracił
  // oznaczenie — mimo że klaster z definicji znaczy „to samo wydarzenie z różnych źródeł", czyli
  // podpozycja jest TYM SAMYM etapem sagi co kotwica. Zmierzone: 9 takich podpozycji w jednym wydaniu.
  // `_parentText` nadaje się przy budowie cache (loadDose/archiwum/SAMPLE) — patrz `oznaczKotwice`.
  return item._parentText ? (THREAD_BY_TEXT.get(normThreadKey(item._parentText)) || null) : null;
}
// Klucz węzła, który na osi ma być podświetlony jako „ten news": dla podpozycji dziedziczącej wątek
// żaden węzeł nie pasuje do jej tekstu, więc wskazujemy węzeł KOTWICY (to ten sam etap).
function watekKluczBiezacego(item, t){
  const wlasny = normThreadKey(item.text);
  if (t && t.nodes.some(n => normThreadKey(n.text) === wlasny)) return wlasny;
  return item._parentText ? normThreadKey(item._parentText) : wlasny;
}
// Dokleja `_parentText` do podpozycji — jedno miejsce dla wszystkich ścieżek budowy cache.
function oznaczKotwice(items){
  (items || []).forEach(it => (it.subItems || []).forEach(s => { s._parentText = it.text; }));
  return items;
}
// ⚠️ Wątki też się STARZEJĄ w otwartej apce (2026-07-26, zgłoszenie właściciela: „nie miałeś tego dodać
// do wątku? przecież to eskalacja"). loadThreads() leciało TYLKO raz przy starcie, a live-tick odświeżał
// wyłącznie briefs.json — więc gdy bot przepisał nagłówek kontynuacji (eskalacja: „…drugiego drona w ciągu
// 24 godzin") albo po prostu dorzucił węzły w kolejnym biegu, mapa THREAD_BY_TEXT z chwili startu przestawała
// pasować do tekstu kafla i badge 🧵 ZNIKAŁ (dane po obu stronach były poprawne — rozjeżdżał się tylko klucz).
// Teraz przy każdej realnej zmianie briefs.json dociągamy też threads.json; gdy zmieniły się SAME wątki,
// wymuszamy re-render, żeby badge pojawił się bez czekania na kolejny zapis newsów.
async function refreshThreadsIfChanged(){
  const przed = THREADS && THREADS.generated_at;
  await loadThreads();
  return !!THREADS && THREADS.generated_at !== przed;
}
function watekWhen(node){
  const glyph = { morning:'☀', afternoon:'◑', evening:'☽' }[node.dose] || '·';
  const time = (node.added_at||'').split(' ')[1] || '';
  // Sagi wielodniowe (2026-07-17): węzeł z innego dnia niż dziś dostaje przedrostek daty "16.07" —
  // bot trzyma teraz węzły do 7 dni, oś pokazuje ciągłość sagi, nie tylko dzisiejsze etapy.
  const d = (node.added_at||'').slice(0,10);
  const dzis = todayLocalISO();
  const dayLbl = (d && d !== dzis) ? `${d.slice(8,10)}.${d.slice(5,7)} ` : '';
  return `<span class="watek-when">${dayLbl}${glyph}${time?' '+time:''}</span>`;
}
// Badge "🧵 N" na kaflu w feedzie (mobile róg-meta + desktop meta) — wątki były niewidoczne z listy,
// przycisk pojawiał się dopiero PO otwarciu artykułu. Pusty string, dopóki threads.json się nie dociągnie.
function watekBadgeHtml(item){
  const t = threadForItem(item);
  if (!t) return '';
  // Gdy kafel dostaje pasek ciągłości (watekPasekHtml), badge niósłby TĘ SAMĄ informację drugi raz.
  if (watekEtapInfo(item)) return '';
  return `<span class="watek-badge">🧵 ${t.nodes.length}</span>`;
}

// ⚠️ Badge dla PODPOZYCJI KLASTRA (2026-08-04, zgłoszenie właściciela: „jak wchodzę w klaster, to
// wątku nie widać — tylko jak są osobne posty"). Wiersz podpozycji renderował WYŁĄCZNIE flagę i tekst,
// więc news schowany w klastrze nie miał ŻADNEGO oznaczenia sagi, mimo że po rozwinięciu artykułu oś
// wątku była na miejscu (`expandBlock`/`dtShowDetail` wołają `watekHtml`). Czyli dane i timeline były
// poprawne — brakowało sygnału NA LIŚCIE, żeby wiedzieć, że warto tam wejść.
// Zmierzone na produkcji: 42 podpozycje w briefs+archiwum są węzłami sag i nie miały nic.
// 🔴 Dlaczego osobna funkcja, a nie `watekBadgeHtml`: tamta MILCZY od 2. etapu, bo na kaflu tę samą
// informację niesie pasek `watekPasekHtml` — a w wierszu podpozycji paska NIE MA (jest ciasny: flaga,
// tekst, strzałka), więc badge musi się pokazać ZAWSZE. Świadomie badge, nie pasek: pasek to cała
// linia z tytułem sagi i rozwaliłby zwarty układ listy w klastrze.
function watekBadgeSubHtml(sub){
  const t = threadForItem(sub);
  if (!t || !Array.isArray(t.nodes) || t.nodes.length < 2) return '';
  const w = watekEtapInfo(sub);
  const opis = w ? `Kolejny etap wątku: ${w.tytul} (${w.etap} z ${w.ile})` : `Wątek: ${t.title || ''}`;
  return `<span class="watek-badge" title="${escAttr(opis)}" aria-label="${escAttr(opis)}">🧵 ${t.nodes.length}</span>`;
}

// ══ Pasek ciągłości sagi na kaflu w feedzie (2026-08-02) ══════════════════════════
// Zgłoszenie właściciela (zrzuty z telefonu, saga interwencji na jenie): czytelnik, który wczoraj
// widział „USA po raz pierwszy od 2011 roku interweniowały…", a dziś widzi „USA rozważa zakup jenów
// za 5–10 mld USD…", ma wrażenie, że NEWS SIĘ POWTARZA — bo z samego kafla nie wynika, że to kolejny
// etap znanej historii. Wątek to pokazywał, ale dopiero PO otwarciu artykułu; badge „🧵 7" był zbyt
// cichy i nie mówił, JAKIEGO tematu dotyczy. Stąd pasek: kropki (pozycja w sadze) + tytuł wątku.
// ⚠️ Pokazywany DOPIERO OD 2. ETAPU — pierwszy news sagi nie jest kontynuacją, więc nic nie dostaje
// (inaczej oznaczalibyśmy pół feedu i sygnał przestałby cokolwiek znaczyć).
// Dane: mapa THREAD_BY_TEXT wczytana z threads.json — 0 dodatkowych fetchy, 0 tokenów.
const WATEK_MAX_KROPEK = 12;   // bot trzyma do 20 węzłów/wątek; powyżej capa mapujemy pozycję proporcjonalnie
function watekEtapInfo(item){
  const t = threadForItem(item);
  if (!t || !Array.isArray(t.nodes) || t.nodes.length < 2) return null;
  const key = normThreadKey(item.text);
  let idx = -1;
  for (let i = 0; i < t.nodes.length; i++){ if (normThreadKey(t.nodes[i].text) === key) { idx = i; break; } }
  if (idx < 1) return null;    // nie znaleziono albo to pierwszy etap = nie kontynuacja
  return { tytul: t.title || '', etap: idx + 1, ile: t.nodes.length };
}
function watekPasekHtml(item){
  const w = watekEtapInfo(item);
  if (!w) return '';
  const n = Math.min(w.ile, WATEK_MAX_KROPEK);
  // Przy sadze dłuższej niż cap kropki przestają być liczbą etapów, a zostają wskaźnikiem „jak daleko".
  const aktywna = (w.ile <= WATEK_MAX_KROPEK) ? (w.etap - 1)
                : Math.round((w.etap - 1) / (w.ile - 1) * (n - 1));
  let kropki = '';
  for (let i = 0; i < n; i++) kropki += `<i class="${i === aktywna ? 'on' : (i < aktywna ? 'past' : '')}"></i>`;
  const opis = `Kolejny etap wątku: ${w.tytul} (${w.etap} z ${w.ile})`;
  return `<div class="watek-strip" title="${escAttr(opis)}" aria-label="${escAttr(opis)}">`
       + `<span class="ws-dots" aria-hidden="true">${kropki}</span>`
       + `<span class="ws-txt">ciąg dalszy: ${escHtml(w.tytul)}</span></div>`;
}

// ══ Widok „Wątki dnia" — lista aktywnych sag (2026-07-17) ══
function openWatki(){ renderWatkiOverlay(); document.getElementById('watkiOverlay').classList.add('show'); }
function closeWatki(){ document.getElementById('watkiOverlay').classList.remove('show'); }
function watekNodeLink(node){
  // Węzeł z dziś → #dawka/slug; z poprzednich dni → #archive/data/dawka/slug (sagi wielodniowe).
  const d = (node.added_at||'').slice(0,10);
  const dzis = todayLocalISO();
  const slug = itemSlug(node.text);
  return (!d || d === dzis) ? `#${node.dose||'morning'}/${slug}` : `#archive/${d}/${node.dose||'morning'}/${slug}`;
}
function toggleWatekSaga(id){
  const el = document.getElementById(id);
  if (el) el.hidden = !el.hidden;
}
function renderWatkiOverlay(){
  const body = document.getElementById('watkiBody');
  const sagi = (THREADS && THREADS.threads ? THREADS.threads : [])
    .filter(t => t.nodes && t.nodes.length >= 2)
    .map(t => ({ t, last: t.nodes.reduce((m,n) => (n.added_at||'') > m ? n.added_at : m, '') }))
    .sort((a,b) => (b.last||'').localeCompare(a.last||''));
  if (!sagi.length){
    body.innerHTML = '<div class="watki-pusto">Brak aktywnych wątków — pojawią się, gdy kilka newsów złoży się w jedną historię.</div>';
    return;
  }
  body.innerHTML = sagi.map(({t, last}, i) => {
    const rows = t.nodes.map(node => `
      <div class="watek-node">
        <span class="watek-dot"></span>
        <div class="watek-metaline">${watekWhen(node)}${node.relacja?`<span class="watek-sep"></span><span class="watek-rel">${escHtml(node.relacja)}</span>`:''}</div>
        <a class="watek-head watki-link" href="${escAttr(watekNodeLink(node))}" onclick="closeWatki()">${escHtml(node.text)}</a>
      </div>`).join('');

// Sparkline: czysty SVG z tablicy zamknięć. Zero bibliotek, zero zależności zewnętrznych.
function sparklineSvg(punkty, kolor, w, h){
  if (!Array.isArray(punkty) || punkty.length < 2) return '';
  const min = Math.min(...punkty), max = Math.max(...punkty);
  const rozpietosc = (max - min) || 1, pad = 2;
  const x = i => (i / (punkty.length - 1)) * (w - pad*2) + pad;
  const y = v => h - pad - ((v - min) / rozpietosc) * (h - pad*2);
  const d = punkty.map((v,i) => (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const pod = `${d} L${x(punkty.length-1).toFixed(1)} ${h} L${x(0).toFixed(1)} ${h} Z`;
  const gid = 'sg' + Math.random().toString(36).slice(2,8);
  return `<svg class="q-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${kolor}" stop-opacity=".26"/>
      <stop offset="100%" stop-color="${kolor}" stop-opacity="0"/></linearGradient></defs>
    <path d="${pod}" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${kolor}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// Pasek notowań dla itemu. FAIL-SAFE na każdym kroku: brak quotes.json, brak pola `chart`, nieznany
// symbol albo za krótka seria = pusty string = front nic nie rysuje (dokładnie jak przed zmianą).
function quotesHtml(item){
  if (!item || !Array.isArray(item.chart) || !item.chart.length) return '';
  if (!QUOTES || !QUOTES.series) return '';
  // Znacznik czasu bierzemy z NAJSTARSZEJ pokazanej serii, nie globalny. Bot od 2026-07-31 potrafi
  // ZACHOWAĆ serię z poprzedniego biegu, gdy źródło nie odpowiedziało (inaczej wykresy akcji znikały
  // ze strony przy jednej nieudanej odpowiedzi Alpaki) — taka seria niesie własne, starsze `stan_na`,
  // więc znacznik musi mówić prawdę o tym, jak stare są dane.
  const stemple = [];
  const wiersze = item.chart.map(sym => {
    const s = QUOTES.series[sym];
    if (!s || !Array.isArray(s.punkty) || s.punkty.length < 2) return '';
    if (s.stan_na) stemple.push(s.stan_na);
    const wzrost = (s.zmiana_pct || 0) >= 0;
    const kolor = wzrost ? '#0f7b3d' : '#c81e1e';
    const dec = typeof s.dec === 'number' ? s.dec : 2;
    const cena = Number(s.ostatnia).toLocaleString('pl-PL', {minimumFractionDigits:dec, maximumFractionDigits:dec});
    const zmiana = (wzrost ? '+' : '') + Number(s.zmiana_pct).toLocaleString('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
    // Układ: [symbol+nazwa] [sparkline] [cena/zmiana]. Nazwa jest JEDYNYM elementem, który wolno
    // ścisnąć do zera — panel szczegółów na desktopie ma ~440 px i przy sztywnych szerokościach
    // wypychało procent zmiany poza `overflow:hidden` kontenera (złapane na renderze 2026-07-31).
    // `zmiana_pct` to od 2026-08-03 zmiana SESYJNA (wcześniej liczona była od pierwszego punktu serii, czyli
    // za ~30 sesji — stąd „-5,13%" przy QQQ pod newsem o rekordowym zamknięciu Wall Street). Zmiana za cały
    // okres jest dalej w danych i ląduje w podpowiedzi, żeby nie zniknęła bez śladu.
    const okres = (typeof s.zmiana_okres_pct === 'number' && s.punktow_okres)
      ? ` · ${s.zmiana_okres_pct >= 0 ? '+' : ''}${Number(s.zmiana_okres_pct).toLocaleString('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2})}% przez ostatnie ${s.punktow_okres} sesji`
      : '';
    return `<div class="q-row" title="${escAttr((s.nazwa || sym) + ' · zmiana sesyjna ' + zmiana + okres)}">
      <span class="q-head"><span class="q-sym">${escHtml(sym)}</span><span class="q-name">${escHtml(s.nazwa || sym)}</span></span>
      ${sparklineSvg(s.punkty, kolor, 110, 30)}
      <span class="q-vals">
        <span class="q-px">${cena}<span class="q-cur"> ${escHtml(s.waluta || '')}</span></span>
        <span class="q-chg" style="color:${kolor}">${zmiana}</span>
      </span>
    </div>`;
  }).filter(Boolean).join('');
  if (!wiersze) return '';
  // Stopka „Notowania: stan na … · dane opóźnione" ZDJĘTA Z EKRANU na życzenie właściciela (2026-08-02),
  // ale znacznik ZOSTAJE — w `title` (podpowiedź po najechaniu) i w `data-stan` (do odczytu z konsoli).
  // ⚠️ Nie kasuj go całkiem: dane są godzinne, a bot potrafi ZACHOWAĆ serię z poprzedniego biegu, gdy
  // źródło nie odpowiedziało — bez znacznika nie da się odróżnić kursu sprzed 20 minut od wczorajszego.
  // Przywrócenie widocznej stopki to jedna linia (`stan` jest już policzone).
  const stan = stemple.length ? stemple.slice().sort()[0] : (QUOTES.stan_na || '—');
  return `<div class="q-box" data-stan="${escAttr(stan)}" title="Notowania: stan na ${escAttr(stan)} · dane opóźnione">${wiersze}</div>`;
}

// highlightSlug: opcjonalny slug (z deep-linku #archive/{data}/{dawka}/{slug}) — po wyrenderowaniu
// otwiera i podświetla dokładnie ten news/klaster, tak samo jak deep-link do żywej dawki.
async function showArchiveDay(dateStr, highlightSlug) {
  document.getElementById('archiveTitle').textContent = dateStr;
  document.getElementById('archiveBack').style.visibility = 'visible';
  const body = document.getElementById('archiveBody');
  body.innerHTML = '<div class="archive-empty">Ładowanie…</div>';
  try {
    let dayData = archiveDayCache[dateStr];
    if (!dayData) {
      const r = await fetch(`./archive/${dateStr}.json`, { cache: 'no-store' });
      if (r.ok) {
        dayData = await r.json();
        archiveDayCache[dateStr] = dayData;         // realne dane — cache
      } else if (r.status === 404) {
        dayData = {};
        archiveDayCache[dateStr] = dayData;         // dzień bez archiwum — zapamiętaj, nie ponawiaj
      } else {
        dayData = {};                               // 5xx/zaślepka CDN — NIE cache'uj, pozwól ponowić przy kolejnym otwarciu
      }
    }
    const doseNames = { morning: '☀ Poranna', afternoon: '◑ Popołudniowa', evening: '☽ Wieczorna' };
    let html = '';
    let highlight = null; // { id, isGroup, parentId }
    for (const key of ['morning', 'afternoon', 'evening']) {
      const dose = dayData[key];
      if (!dose || !dose.items || !dose.items.length) continue;
      const items = oznaczKotwice(sortNewestFirst(dose.items).map(i => ({
        ...i, id: 'a-' + uid(),
        subItems: sortNewestFirst(i.subItems).map(s => ({ ...s, id: 'a-' + uid() }))
      })));
      if (highlightSlug && !highlight) {
        outer: for (const it of items) {
          if (itemSlug(it.text) === highlightSlug) { highlight = { id: it.id, isGroup: !!(it.subItems && it.subItems.length) }; break; }
          if (it.subItems) {
            for (const sub of it.subItems) {
              if (itemSlug(sub.text) === highlightSlug) { highlight = { id: sub.id, isGroup: false, parentId: it.id }; break outer; }
            }
          }
        }
      }
      html += `<div class="archive-day-section-title">${doseNames[key]}</div>`;
      html += items.map((item, idx) => renderArchiveItem(item, idx, dateStr, key)).join('');
    }
    body.innerHTML = html || '<div class="archive-empty">Brak zapisanych newsów dla tego dnia.</div>';

    if (highlight) {
      if (highlight.parentId) {
        const groupEl = document.getElementById('group-' + highlight.parentId);
        if (groupEl && !groupEl.classList.contains('open')) toggleGroup(highlight.parentId);
      }
      setTimeout(() => {
        let el;
        if (highlight.isGroup) {
          el = document.getElementById('group-' + highlight.id);
          if (el && !el.classList.contains('open')) toggleGroup(highlight.id);
        } else {
          el = document.getElementById('item-' + highlight.id);
          if (el && !el.classList.contains('open')) toggleSubItem(highlight.id);
        }
        if (!el) return;
        setTimeout(() => {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          el.classList.add('deep-link-highlight');
          setTimeout(() => el.classList.remove('deep-link-highlight'), 2000);
        }, 160);
      }, highlight.parentId ? 140 : 0);
    }
  } catch (e) {
    body.innerHTML = '<div class="archive-empty">Nie udało się wczytać tej dawki.</div>';
  }
}

function escAttr(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// Escapowanie TREŚCI wstawianej do innerHTML (nagłówki/artykuły/źródła z briefs.json — dane scrapowane
// z RSS, więc mogą zawierać tagi). Te same podmiany co escAttr; osobna nazwa, żeby w rendererach było
// widać intencję: escHtml = treść elementu, escAttr = wartość atrybutu, esc = string w inline-JS (onclick).
function escHtml(s) { return escAttr(s); }
// URL do atrybutu href — dane (source_url/rssLink) pochodzą z zewnętrznego łańcucha (RSS wydawców, dekoder
// Google News, Bing apiclick), więc traktujemy je jak wrogie: (1) tylko http/https (blokada javascript:/data:
// itp. — origin brifup.com trzyma token GitHub admina w sessionStorage, XSS tu = kompromitacja strony),
// (2) escAttr na wyjściu (cudzysłów w URL nie może wyłamać się z atrybutu i dokleić własnego on*).
function safeUrl(u) {
  if (!u) return '';
  const t = String(u).trim();
  return /^https?:\/\//i.test(t) ? escAttr(t) : '';
}

function renderDose(dose, items) {
  const cfg = DOSE_CFG[dose];
  if (!items || items.length === 0) return;
  // PEŁNA lista (bez filtra suwaka) idzie do: liczników panelu tematów (mobSwpBuildCats) i renderDesktop
  // (dtAllItems MUSI być pełne — liczniki sidebaru, widoki tematów, dtItemsMap; desktop filtruje SAM raz
  // w dtRenderFeed). Tylko MOBILNY główny feed dostaje przefiltrowane `items` (tak ma być — suwak działa
  // na feedzie). Wcześniej renderDesktop dostawał już przefiltrowaną listę → filtr aplikował się DRUGI raz
  // (przy 50% widać było ~25% newsów) + zaniżone liczniki i niepełny dtAllItems.
  const fullItems = items;
  items = filterByCatMeat(items);
  const hero = items[0];
  const isHeroGroup = hero.subItems && hero.subItems.length > 0;

  const heroBlock = isHeroGroup ? `
    <div class="hero-card" id="group-${hero.id}" data-text="${escAttr(hero.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleGroup('${hero.id}')">
      ${srcBadge(hero) ? `<div class="card-corner">${srcBadge(hero)}</div>` : ''}
      <div class="hero-kicker">
        <span class="hero-flag">${escHtml(hero.flag||'📰')}</span>
        <span class="hero-topbadge">★ Top Story</span>
        <span class="hero-kicker-dose">${cfg.label}</span>
      </div>
      ${watekPasekHtml(hero)}
      <div class="hero-title">${escHtml(hero.text)}</div>
      <div class="hero-footer">
        <span class="hero-source">${hero.subItems.length} powiązane newsy</span>
        <span class="hero-arrow">›</span>
      </div>
    </div>
    <div class="sub-items-container" id="subc-${hero.id}">
      ${renderSubItems(hero.subItems)}
    </div>`
    : `
    <div class="hero-card" id="item-${hero.id}" data-text="${escAttr(hero.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleSubItem('${hero.id}')">
      <div class="hero-kicker">
        <span class="hero-flag">${escHtml(hero.flag||'📰')}</span>
        <span class="hero-topbadge">★ Top Story</span>
        <span class="hero-kicker-dose">${cfg.label}</span>
      </div>
      ${watekPasekHtml(hero)}
      <div class="hero-title">${escHtml(hero.text)}</div>
      ${hero.added_at ? `<div class="item-time">${formatAddedAt(hero)}</div>` : ''}
      <div class="hero-footer">
        <span class="hero-source">${escHtml(hero.source_name || 'Czytaj pełny artykuł')}</span>
        <span class="hero-arrow">›</span>
      </div>
    </div>
    <div class="card-expand" id="exp-${hero.id}">${expandBlock(hero)}</div>`;

  const restBlocks = items.slice(1).map((item, i) => {
    const isGroup = item.subItems && item.subItems.length > 0;
    if (isGroup) {
      return `
        <div class="news-item" id="group-${item.id}" data-text="${escAttr(item.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleGroup('${item.id}')">
          <div class="news-num">${String(i+2).padStart(2,'0')}</div>
          <div class="news-body">
            ${catMetaRow(item)}
            ${watekPasekHtml(item)}
            <div class="news-title">${escHtml(item.text)}</div>
          </div>
          <div class="news-arrow">›</div>
        </div>
        <div class="sub-items-container" id="subc-${item.id}">
          ${renderSubItems(item.subItems)}
        </div>`;
    } else {
      return `
        <div class="news-item" id="item-${item.id}" data-text="${escAttr(item.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleSubItem('${item.id}')">
          <div class="news-num">${String(i+2).padStart(2,'0')}</div>
          <div class="news-body">
            ${catMetaRow(item)}
            ${watekPasekHtml(item)}
            <div class="news-title">${escHtml(item.text)}</div>
            ${item.added_at ? `<div class="item-time">${formatAddedAt(item)}</div>` : ''}
          </div>
          <div class="news-arrow">›</div>
        </div>
        <div class="card-expand" id="exp-${item.id}">${expandBlock(item)}</div>`;
    }
  }).join('');

  const editionBar = isPrevEdition(dose)
    ? `<div class="prevbar"><span class="pb-ico">◷</span><span class="pb-txt">Wczorajsze wydanie</span><span class="pb-dot">·</span><span class="pb-meta">${formatDoseDate(doseDates[dose])} · nowe ~${cfg.time}</span></div>`
    : `<div class="edition-bar"><div class="edition-name">${cfg.edition}</div><div class="edition-time">${cfg.time} · ${new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}</div></div>`;

  document.getElementById('content').innerHTML = `
    ${editionBar}
    ${heroBlock}
    <div class="section-rule">
      <div class="section-rule-line"></div>
      <div class="section-rule-label">Więcej tematów</div>
      <div class="section-rule-line"></div>
    </div>
    ${restBlocks}`;

  // Tagowanie kart kategorią — potrzebne dla mobilnego panelu filtrów
  {
    const cEl = document.getElementById('content');
    items.forEach(item => {
      if (item.subItems?.length > 0) {
        // Klaster: zbieramy wszystkie unikalne kategorie podwpisów
        const cats = [...new Set(item.subItems.map(s => dtGetCategory(s)))].join(' ');
        const gEl = cEl.querySelector(`#group-${item.id}`);
        if (gEl) gEl.dataset.categories = cats;
        const subEl = cEl.querySelector(`#subc-${item.id}`);
        if (subEl) subEl.dataset.categories = cats;
      } else {
        const cat = dtGetCategory(item);
        const iEl = cEl.querySelector(`#item-${item.id}`);
        if (iEl) iEl.dataset.category = cat;
        const expEl = cEl.querySelector(`#exp-${item.id}`);
        if (expEl) expEl.dataset.category = cat;
      }
    });
    markNewItems(items); // chwilowy błysk nowych artykułów (od ostatniej wizyty)
    mobActiveCat = null;
    mobSwpBuildCats(fullItems);
    mobSwpBuildArchive();
    // Archiwum wczytuje na PC renderDesktop; na mobile robimy to tutaj (idempotentne, guard dtArchiveLoaded).
    // Po załadowaniu odświeżamy panel, żeby doszła lista dni i cross-day filtr kategorii miał dane.
    if (typeof dtRenderArchiveSidebar === 'function') {
      dtRenderArchiveSidebar().then(() => { mobSwpBuildCats(fullItems); mobSwpBuildArchive(); }).catch(()=>{});
    }
  }

  renderDesktop(dose, fullItems);
  updatePageMeta(dose, cfg, items);
  scrollArea.scrollTop = 0;
}

// Tytuł karty i dane strukturalne odzwierciedlają to, co faktycznie jest na ekranie —
// bez tego każda dawka i każdy news dzielą ten sam gołý "BrifUp" w tytule zakładki,
// a wyszukiwarki (na tyle, na ile w ogóle wykonają JS) nie widzą żadnej treści newsów.
function updatePageMeta(dose, cfg, items) {
  const top = items[0];
  if (top?.text) document.title = `${top.text} — ${cfg.label} — Brif.up`;

  const ld = {
    '@context': 'https://schema.org',
    '@type': 'ItemList',
    name: `Brif.up — ${cfg.label}`,
    itemListElement: items.slice(0, 15).map((it, i) => ({
      '@type': 'ListItem',
      position: i + 1,
      item: {
        '@type': 'NewsArticle',
        headline: it.text,
        ...(it.article ? { description: it.article } : {}),
        ...(it.source_url && it.source_url !== '#' ? { url: it.source_url } : {}),
        ...(it.source_name ? { publisher: { '@type': 'Organization', name: it.source_name } } : {}),
        ...(it.added_at ? { datePublished: it.added_at.replace(' ', 'T') + ':00+02:00' } : {}),
      }
    }))
  };
  let script = document.getElementById('ld-json');
  if (!script) {
    script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'ld-json';
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(ld);
}

// ── Poziom 1: otwórz/zamknij GRUPĘ (klaster tematyczny) ──
// Otwiera/zamyka kartę i trzyma stan "rozwinięte" widoczny też dla czytników ekranu
// (samo .open to tylko wygląd — bez tego czytnik nie wie, że coś się rozwinęło).
function setCardOpen(el, isOpen) {
  el.classList.toggle('open', isOpen);
  el.setAttribute('aria-expanded', String(isOpen));
}

// Karty (.hero-card, .news-item, .sub-item) mają role="button" + tabindex, więc łapią fokus
// z Tab — ale sam onclick nie reaguje na klawiaturę. Enter/Spacja na dowolnej z nich robi
// dokładnie to, co kliknięcie (event delegation — działa też dla kart dorenderowanych później).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.hero-card, .news-item, .sub-item');
  if (!card) return;
  e.preventDefault(); // Spacja inaczej przewinęłaby stronę
  card.click();
});

function toggleGroup(groupId) {
  const groupEl = document.getElementById('group-'+groupId);
  const subcEl  = document.getElementById('subc-'+groupId);
  if (!groupEl || !subcEl) return;
  const isOpen = groupEl.classList.contains('open');

  // Layout zmieni wysokość strony — zignoruj wynikły z tego scroll event,
  // żeby taby Poranna/Południowa/Wieczorna nie chowały się przy zwykłym kliknięciu.
  suppressScrollHide = true;
  setTimeout(() => { suppressScrollHide = false; }, 400);

  // Zamknij WSZYSTKIE grupy i sub-itemy (i ich expandy) na poziomie głównym
  document.querySelectorAll('.hero-card.open, .news-item.open').forEach(c => setCardOpen(c, false));
  document.querySelectorAll('.sub-item.open').forEach(c => setCardOpen(c, false));

  if (!isOpen) {
    setCardOpen(groupEl, true);
    // Jeśli grupa ma tylko 1 podpunkt — otwórz go automatycznie
    const subItems = subcEl.querySelectorAll('.sub-item');
    if (subItems.length === 1) {
      const onlyId = subItems[0].id.replace('item-','');
      setTimeout(() => toggleSubItem(onlyId), 60);
    }
  }
}

// ── Poziom 2: otwórz/zamknij POJEDYNCZY news → pokazuje artykuł ──
function toggleSubItem(id) {
  const itemEl = document.getElementById('item-'+id);
  const exp    = document.getElementById('exp-'+id);
  if (!itemEl || !exp) return;
  const isOpen = itemEl.classList.contains('open');

  suppressScrollHide = true;
  setTimeout(() => { suppressScrollHide = false; }, 400);

  // Zamknij inne otwarte sub-itemy (ale NIE zamykaj nadrzędnej grupy)
  document.querySelectorAll('.sub-item.open').forEach(c => {
    if (c.id !== 'item-'+id) setCardOpen(c, false);
  });

  setCardOpen(itemEl, !isOpen);
}

function switchDose(dose) {
  const prevDose = currentDose;
  currentDose = dose;
  suppressScrollHide = true;
  setTimeout(() => { suppressScrollHide = false; }, 400);
  document.querySelectorAll('.dose-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+dose).classList.add('active');
  document.querySelectorAll('.dt-tab').forEach(t=>t.classList.remove('active'));
  const dtTab = document.getElementById('dttab-'+dose);
  if (dtTab) dtTab.classList.add('active');
  // Taby zawsze widoczne po zmianie dawki
  document.getElementById('doseTabs').classList.remove('hidden');
  scrollArea.classList.remove('tabs-hidden');
  tabsHidden = false;
  lastScrollY = 0;
  loadDose(dose);
  if (prevDose === 'afternoon' && dose === 'morning') setTimeout(mobGripPulse, 320);
}

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  delete cache[currentDose];
  await loadDose(currentDose, true);
  btn.classList.remove('spinning');
  showToast('Zaktualizowano');
}

document.getElementById('topbarDate').textContent =
  new Date().toLocaleDateString('pl-PL',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).toUpperCase();

document.querySelectorAll('.dose-tab').forEach(t=>t.classList.remove('active'));
document.getElementById('tab-'+currentDose).classList.add('active');
loadDose(currentDose);

// ══ Deep-linki: #archive/data/dawka/slug ORAZ #dawka/slug ══════════════
// Wydzielone z IIFE do nazwanych funkcji + nasłuch `hashchange`, żeby działały nie tylko przy STARCIE
// strony, ale i przy zmianie hasha W TRAKCIE. Klik w węzeł „Wątków dnia" ustawia location.hash na już
// załadowanej stronie — bez tego listenera nic się nie otwierało (feature był martwy: overlay się zamykał
// i koniec). Teraz każda zmiana hasha (klik węzła sagi, wstecz/naprzód) routuje do właściwego newsa.
function routeArchiveHash() {
  const hash = location.hash.slice(1);
  const parts = hash.split('/');
  if (parts[0] !== 'archive' || parts.length < 4) return false;
  const dateStr = parts[1], slug = parts[3];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || !slug) return false;

  document.getElementById('archiveOverlay').classList.add('show');
  showArchiveDay(dateStr, slug);
  return true;
}

function routeDoseHash() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const sep = hash.indexOf('/');
  if (sep === -1) return;
  const dose = hash.slice(0, sep);
  const slug = hash.slice(sep + 1);
  if (!['morning','afternoon','evening'].includes(dose) || !slug) return;

  if (dose !== currentDose) switchDose(dose);

  function tryOpen(attempts) {
    const items = cache[dose];
    if (!items) {
      if (attempts < 25) setTimeout(() => tryOpen(attempts + 1), 200);
      return;
    }
    let found = null, parent = null;
    outer: for (const it of items) {
      if (itemSlug(it.text) === slug) { found = it; break; }
      if (it.subItems) {
        for (const sub of it.subItems) {
          if (itemSlug(sub.text) === slug) { found = sub; parent = it; break outer; }
        }
      }
    }
    // Sluga nie ma w bieżącej dawce — zanim odpuścimy, poszukaj go w archiwum.
    // 🔴 Po co: stuby `s/<slug>.html` (podgląd linku na X/FB) mają retencję 14 DNI, ale ich cel
    // `/#<dawka>/<slug>` bot wylicza z BIEŻĄCEGO briefs.json, a news wypada do archiwum już
    // następnego dnia. Bez tego każdy udostępniony link umierał po dobie: stub przekierowywał,
    // front nie znajdował sluga i zostawiał czytelnika na pustej stronie głównej, bez komunikatu.
    // Fallback jest po stronie FRONTU celowo — naprawia też linki JUŻ wrzucone na X, czego
    // zmiana w bocie nie zrobi (stuby są odtwarzane z bieżącej dawki, nie przepisywane wstecz).
    if (!found) { otworzSlugZArchiwum(slug); return; }

    const isGroup = found.subItems && found.subItems.length > 0;

    // Desktop ma osobny layout (lista + panel szczegółów po prawej), więc mobilne toggle/scroll
    // nie działają na jego DOM — link udostępniony z telefonu nic tu nie otwierał. Otwieramy news
    // przez desktopowe API (dtPickItem), w razie potrzeby rozwijając najpierw jego klaster.
    if (isDesktop()) {
      if (!dtItemsMap[found.id]) {           // desktopowy feed jeszcze nie zbudowany — spróbuj później
        if (attempts < 25) setTimeout(() => tryOpen(attempts + 1), 200);
        return;
      }
      if (parent) {
        const g = document.getElementById('dtg-' + parent.id);
        if (g && g.style.display === 'none') dtToggleGroup(parent.id);
      } else if (isGroup) {
        const g = document.getElementById('dtg-' + found.id);
        if (g && g.style.display === 'none') dtToggleGroup(found.id);
      }
      dtPickItem(found.id);
      setTimeout(() => {
        const el = document.getElementById('dts-' + found.id) || document.getElementById('dti-' + found.id);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.classList.add('deep-link-highlight');
        setTimeout(() => el.classList.remove('deep-link-highlight'), 2000);
      }, 120);
      return;
    }

    // Sub-item w klastrze jest ukryty w zwiniętym kontenerze — najpierw otwórz nadrzędną grupę,
    // dopiero potem sam podpunkt. Bez tego scrollIntoView skacze do niewidocznego elementu.
    if (parent) {
      const groupEl = document.getElementById('group-' + parent.id);
      if (groupEl && !groupEl.classList.contains('open')) toggleGroup(parent.id);
    }

    setTimeout(() => {
      let el;
      if (isGroup) {
        // Udostępniono nagłówek klastra — otwórz grupę i podświetl jej nagłówek
        el = document.getElementById('group-' + found.id);
        if (el && !el.classList.contains('open')) toggleGroup(found.id);
      } else {
        el = document.getElementById('item-' + found.id);
        // toggleGroup mógł już auto-otworzyć jedyny podpunkt — otwieraj tylko jeśli zamknięty
        if (el && !el.classList.contains('open')) toggleSubItem(found.id);
      }
      if (!el) return;
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.classList.add('deep-link-highlight');
        setTimeout(() => el.classList.remove('deep-link-highlight'), 2000);
      }, 160);
    }, parent ? 140 : 0);
  }
  setTimeout(() => tryOpen(0), 150);
}

// Szuka sluga w archiwum i otwiera go w nakładce archiwum. Wołane WYŁĄCZNIE ze ścieżki awaryjnej
// routeDoseHash (news wypadł z bieżącej dawki), więc normalne wejścia nic tu nie płacą.
// Szukamy najwyżej tyle dni wstecz, ile żyje stub — starszy link i tak nie ma już swojej strony.
const STUB_RETENCJA_DNI = 14;
async function otworzSlugZArchiwum(slug) {
  try {
    if (!archiveDatesCache) {
      const r = await fetch('./archive/index.json', { cache: 'no-store' });
      archiveDatesCache = r.ok ? await r.json() : [];
    }
    const daty = (archiveDatesCache || []).slice()
      .sort((a, b) => b.localeCompare(a))          // najnowsze najpierw — typowy link jest świeży
      .slice(0, STUB_RETENCJA_DNI);
    // Sekwencyjnie, nie Promise.all: przy trafieniu w 1. dniu (najczęstszy przypadek) pobieramy
    // JEDEN plik zamiast czternastu. Dzień archiwum waży ~200 KB, więc równoległość byłaby tu
    // kosztem zamiast zyskiem.
    for (const dateStr of daty) {
      let dayData = archiveDayCache[dateStr];
      if (!dayData) {
        const r = await fetch(`./archive/${dateStr}.json`, { cache: 'no-store' });
        if (!r.ok) continue;                        // 404/5xx — próbuj kolejnego dnia
        dayData = await r.json();
        archiveDayCache[dateStr] = dayData;
      }
      for (const key of ['morning', 'afternoon', 'evening']) {
        const dose = dayData[key];
        if (!dose || !dose.items) continue;
        for (const it of dose.items) {
          const trafienie = itemSlug(it.text) === slug
            || (it.subItems || []).some(sub => itemSlug(sub.text) === slug);
          if (trafienie) {
            document.getElementById('archiveOverlay').classList.add('show');
            showArchiveDay(dateStr, slug);          // sam podświetli i rozwinie właściwy wpis
            return true;
          }
        }
      }
    }
  } catch (_) { /* brak archiwum / zły JSON — zostaw czytelnika na stronie głównej */ }
  return false;
}

// Startowy routing + nasłuch zmiany hasha (klik w węzeł sagi z „Wątków dnia", wstecz/naprzód).
function routeHashDeepLink() {
  if (routeArchiveHash()) return;
  routeDoseHash();
}
routeHashDeepLink();
window.addEventListener('hashchange', routeHashDeepLink);

// ══ Swipe między dawkami ══════════════════════════════
(function() {
  const DOSES = ['morning', 'afternoon', 'evening'];
  let touchStartX = 0, touchStartY = 0;
  const scrollArea = document.querySelector('.scroll-area');
  scrollArea.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  scrollArea.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = DOSES.indexOf(currentDose);
    const peeking = document.getElementById('mobSwpPanel').classList.contains('peek');
    if (dx < 0 && idx < DOSES.length - 1) { if (peeking) mobSwpClose(); switchDose(DOSES[idx + 1]); }
    else if (dx > 0 && idx > 0) switchDose(DOSES[idx - 1]);
    else if (dx > 0 && idx === 0) { peeking ? mobSwpOpen() : mobSwpPeek(); }
    else if (dx < 0 && peeking) mobSwpClose();
  }, { passive: true });
})();

// ══ Dark mode ═════════════════════════════════════════
(function() {
  // Domyślnie jasny (dzienny) motyw na pierwszej wizycie — nie dziedziczymy trybu ciemnego z ustawień systemu.
  const saved = localStorage.getItem('brifup_theme');
  const theme = saved || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
})();

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('brifup_theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', next === 'dark' ? '#0f0f0f' : '#ffffff');
}

// ══ Pull-to-refresh ════════════════════════════════════
(function() {
  const ptr = document.getElementById('ptr');
  const area = document.getElementById('scrollArea');
  let startY = 0, pulling = false, refreshing = false;

  area.addEventListener('touchstart', e => {
    if (area.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });

  area.addEventListener('touchmove', e => {
    if (!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 10) {
      ptr.classList.add('pulling');
      ptr.innerHTML = dy > 60 ? '<span class="ptr-arrow">↑ Puść by odświeżyć</span>' : '<span class="ptr-arrow">↓ Odśwież</span>';
    } else {
      ptr.classList.remove('pulling');
    }
  }, { passive: true });

  area.addEventListener('touchend', e => {
    if (!pulling) return;
    const dy = e.changedTouches[0].clientY - startY;
    pulling = false;
    if (dy > 60 && !refreshing) {
      refreshing = true;
      ptr.innerHTML = '<div class="ptr-spinner"></div>';
      ptr.classList.add('refreshing');
      refresh().then(() => {
        ptr.classList.remove('pulling', 'refreshing');

        refreshing = false;
      });
    } else {
      ptr.classList.remove('pulling', 'refreshing');
    }
  }, { passive: true });
})();

// ══ PWA — rejestracja Service Workera ════════════════
let swRegistration = null;

// Zabezpieczenie przed pętlą przeładowań: oba mechanizmy odświeżania niżej (nowy SW przejął
// kontrolę / wykryto nowy index.html) odpalają się niezależnie od siebie i przy KAŻDYM powrocie
// do apki (visibilitychange) — bez wspólnego, jednorazowego bezpiecznika mogłyby zapętlić się
// w reload-po-reload, zwłaszcza na wolnym połączeniu, gdzie sam reload nie zdąży się dokończyć,
// zanim znów zostanie wykryta "nowa wersja". sessionStorage (nie zwykła zmienna) przeżywa sam
// reload, więc realnie ogranicza to do JEDNEGO przeładowania na całą sesję karty/apki.
// Watchdog białego ekranu (2026-07-17): jeśli po 8 s NIC się nie wyrenderowało (ani skeleton,
// ani dawka — znak, że powłoka z cache była zepsuta albo JS padł przy starcie), raz na sesję
// czyścimy cache SW i przeładowujemy. Normalny start renderuje skeleton w <1 s, więc watchdog
// nie ma prawa odpalić się przy działającej apce.
setTimeout(async () => {
  try {
    const content = document.getElementById('content');
    const dt = document.getElementById('dtFeedList');
    const pusto = (!content || !content.childElementCount) && (!dt || !dt.childElementCount);
    if (pusto && !sessionStorage.getItem('brifup_watchdog')) {
      sessionStorage.setItem('brifup_watchdog', '1');
      if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
      location.reload();
    }
  } catch (_) {}
}, 8000);

function reloadOnce(powod) {
  if (sessionStorage.getItem('brifup_reloaded_for_update')) return;
  sessionStorage.setItem('brifup_reloaded_for_update', '1');
  console.log('Odświeżam raz z powodu:', powod);
  window.location.reload();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => { swRegistration = reg; console.log('Service Worker zarejestrowany'); })
      .catch((err) => console.warn('SW registration failed:', err));
  });
  // Auto-reload gdy nowy SW przejmie kontrolę (nowa wersja apki)
  navigator.serviceWorker.addEventListener('controllerchange', () => reloadOnce('nowy Service Worker'));
}

// ══ Licznik wejść (2026-08-01) ════════
// Woła własną Edge Function w Supabase, NIE zewnętrzny analytics. Powody
// (adblock, brak baneru cookies, dane u nas) opisane w supabase/functions/licznik/index.ts.
// Tu nie ma ŻADNEGO ciasteczka ani wpisu w localStorage — wysyłamy sam adres strony
// i referrera, a kto to był, rozstrzyga się po stronie funkcji (hash z solą dnia).
// ⚠️ SW przepuszcza POST prosto do sieci (service-worker.js, gałąź „nie-GET"),
// więc beacon nie wymaga bumpa CACHE_NAME ani wyjątku w cache'u.
(function licznikWejsc() {
  // Tylko produkcja. Bez tego lokalny podgląd i sandbox dosypywałyby wejść do statystyk,
  // a właściciel patrzyłby na liczby napompowane własnym testowaniem.
  if (!location.hostname.endsWith('brifup.com')) return;

  // ⚠️ Wykluczenie WŁASNYCH urządzeń właściciela (2026-08-04). Flaga w localStorage — beacon
  // w ogóle nie wychodzi. CELOWO nie po IP: właściciel chodzi po VPN (adres zmienny i
  // współdzielony — filtr po IP wycinałby też obcych czytelników za tym samym VPN-em),
  // a licznik z założenia nie zapisuje IP. Flagę ustawia automatycznie logowanie do knagi
  // (tam wchodzi tylko właściciel) albo ręcznie wejście na brifup.com/?licznik=off
  // (cofnięcie: ?licznik=on). To NIE jest identyfikator śledzący — deklaracja „zero wpisów
  // w localStorage" dotyczy CZYTELNIKÓW; ta flaga wyłącza pomiar, niczego nie mierzy.
  try {
    const q = new URLSearchParams(location.search).get('licznik');
    if (q === 'off') localStorage.setItem('brifup_pomin_licznik', '1');
    if (q === 'on') localStorage.removeItem('brifup_pomin_licznik');
    if (localStorage.getItem('brifup_pomin_licznik') === '1') return;
  } catch (_) {}

  const ENDPOINT = 'https://utmvokfjvrthvcmxzowc.supabase.co/functions/v1/licznik';
  let ostatnieZgloszenie = 0;

  // `typ` rozróżnia REALNE ZAŁADOWANIE STRONY od powrotu do już otwartej apki
  // (2026-08-05). Bez tego obie rzeczy były jednym „wyświetleniem", więc nie dało się
  // ruszyć progu wznowień bez napompowania licznika odsłon. ⚠️ Wartości muszą się
  // zgadzać co do znaku z `check (typ in (...))` w supabase_schema.sql, sekcja 9d —
  // inna etykieta zostanie odrzucona przez bazę i wejście przepadnie w całości.
  function zglos(typ) {
    ostatnieZgloszenie = Date.now();
    try {
      fetch(ENDPOINT, {
        method: 'POST',
        keepalive: true,               // przeżywa zamknięcie karty
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sciezka: location.pathname, referrer: document.referrer || '', typ }),
      }).catch(() => {});              // licznik NIGDY nie może popsuć strony
    } catch (_) {}
  }

  zglos('wejscie');

  // Dlaczego jeszcze wznowienie: w zainstalowanej PWA system WZNAWIA istniejące okno
  // zamiast ładować stronę od nowa (ta sama mechanika, dla której istnieje
  // `checkAppShellUpdate`). Bez tego najbardziej lojalni czytelnicy — ci z apką na
  // ekranie głównym — byliby liczeni raz na instalację, a nie raz na wizytę.
  // 30 minut to standardowy próg końca sesji; krótsze przełączenie się nie liczy.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - ostatnieZgloszenie > 30 * 60 * 1000) zglos('wznowienie');
  });
})();

// ══ Wykrywanie nowej wersji apki (index.html) ════════
// W zainstalowanej PWA system zwykle WZNAWIA istniejące okno bez nawigacji
// sieciowej, więc świeży index.html nie jest pobierany aż do pełnego restartu
// (w Chrome każde wejście to realna nawigacja, dlatego tam zmiany widać od razu).
// Tu przy każdym powrocie na pierwszy plan porównujemy ETag/Last-Modified
// index.html z wersją, z której wystartowała apka — jeśli się zmienił,
// przeładowujemy. Działa automatycznie, bez ręcznego bumpowania wersji.
let loadedAppTag = null;
async function checkAppShellUpdate() {
  try {
    // Zmuś przeglądarkę do ponownego sprawdzenia samego service-workera
    if (swRegistration) { swRegistration.update().catch(() => {}); }
    // HEAD wystarcza do porównania wersji — pełny index.html (~154 KB) ściągamy TYLKO gdy się
    // zmienił (wcześniej pełny GET przy KAŻDYM powrocie do apki = spory transfer na komórce).
    // Fallback na pełny GET, gdyby HEAD nie zwrócił żadnego nagłówka wersji.
    let res = await fetch('./index.html', { method: 'HEAD', cache: 'no-store' });
    let tag = res.ok ? (res.headers.get('etag') || res.headers.get('last-modified') || res.headers.get('content-length')) : null;
    if (!tag) {
      res = await fetch('./index.html', { cache: 'reload' });
      tag = res.headers.get('etag') || res.headers.get('last-modified') || res.headers.get('content-length');
    }
    if (!tag) return;
    if (loadedAppTag === null) { loadedAppTag = tag; return; } // pierwsza wizyta = wersja bazowa
    if (tag !== loadedAppTag) {
      loadedAppTag = tag;
      // PRZED reloadem odśwież cache SW pełnym GET-em (nawigacja po reloadzie serwuje z cache —
      // stale-while-revalidate — więc bez tego reload pokazałby jeszcze STARĄ powłokę).
      try { await fetch('./index.html', { cache: 'reload' }); } catch (_) {}
      reloadOnce('nowa wersja index.html');
    }
  } catch (_) { /* offline — zostajemy na obecnej wersji */ }
}
window.addEventListener('load', () => { checkAppShellUpdate(); });

  }

    return;
  }
  try {
    if (OneSignal.User.PushSubscription.optedIn) {
      await OneSignal.User.PushSubscription.optOut();
      showToast('Powiadomienia wyłączone');

      await OneSignal.Notifications.requestPermission();
      if (Notification.permission === 'denied') {

        return;
