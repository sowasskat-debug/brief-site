let currentDose = getCurrentDose();
let cache = {};
let doseDates = {};   // data (YYYY-MM-DD) treści każdej dawki z briefs.json — do wykrycia „wczorajszego wydania"
let lastScrollY = 0, tabsHidden = false;
let suppressScrollHide = false;

const scrollArea = document.getElementById('scrollArea');
scrollArea.addEventListener('scroll', function() {
  const sy = this.scrollTop;
  const delta = sy - lastScrollY;

  // Ignoruj skoki spowodowane zmianą layoutu (np. otwarcie/zamknięcie klastra),
  // a nie realnym przewijaniem palcem — duży, nagły skok w jedną ramkę.
  if (suppressScrollHide || Math.abs(delta) > 150) {
    lastScrollY = sy;
    return;
  }

  const tabs = document.getElementById('doseTabs');
  if (delta > 0 && sy > 40 && !tabsHidden) {
    tabs.classList.add('hidden'); this.classList.add('tabs-hidden'); tabsHidden = true;
  } else if (delta < -8 && tabsHidden) {
    tabs.classList.remove('hidden'); this.classList.remove('tabs-hidden'); tabsHidden = false;
  }
  lastScrollY = sy;
}, { passive: true });

function getCurrentDose() {
  const h = new Date().getHours();
  return h < 11 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
}
// Data DZIŚ w formacie 'YYYY-MM-DD' (lokalna, jak bot dla Europe/Warsaw) — do wykrycia starej dawki
function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Czy oglądana dawka to jeszcze wczorajsze wydanie (dzisiejsze jeszcze nie powstało)?
function isPrevEdition(dose) {
  const d = doseDates[dose];
  return !!d && d < todayLocalISO();
}
// 'YYYY-MM-DD' -> np. '1 lip'
function formatDoseDate(iso) {
  const p = (iso || '').split('-').map(Number);
  if (p.length !== 3) return '';
  return new Date(p[0], p[1]-1, p[2]).toLocaleDateString('pl-PL', { day:'numeric', month:'short' });
}
function uid() { return Math.random().toString(36).slice(2,9); }
function esc(s='') { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,' '); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ══ briefs.json — generowany przez bota na Telegramie ═
// Świeżość per-dawka jest już zarządzana po stronie bota (Europe/Warsaw),
// front-end ufa serwerowi i nie porównuje dat między różnymi zegarami/strefami.
async function fetchFromBriefsJson(dose) {
  try {
    // Znak zapytania z timestampem: CDN przed GitHub Pages (Cloudflare itp.) cache'uje
    // po pełnym URL, a nagłówek cache:'no-store' dotyczy tylko cache przeglądarki —
    // bez unikalnego query stringa CDN mógł serwować nieaktualną wersję pliku.
    const r = await fetch(`./briefs.json?_=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return null;
    const d = await r.json();
    const doseData = d?.[dose];
    if (!doseData || !doseData.items?.length) return null;
    doseDates[dose] = doseData.date || null;   // data treści tej dawki (do oznaczenia starego wydania)
    return doseData.items;
  } catch(e) { return null; }
}

async function fetchFromSupabase(dose) {
  if (SUPABASE_URL === 'TWOJ_SUPABASE_URL') return null;
  const today = new Date().toISOString().split('T')[0];
  const res = await fetch(`${SUPABASE_URL}/rest/v1/briefs?dose=eq.${dose}&date=eq.${today}&order=created_at.desc&limit=1`, {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` }
  });
  const d = await res.json();
  if (d?.length > 0) { doseDates[dose] = today; return d[0].items; }
  return null;
}

async function loadDose(dose, force=false) {
  if (cache[dose] && !force) { renderDose(dose, cache[dose]); return; }
  renderSkeleton();
  doseDates[dose] = null;   // reset — ustawi się przy udanym pobraniu z briefs.json/supabase
  try {
    let items = await fetchFromBriefsJson(dose);

    if (!items) items = await fetchFromSupabase(dose);

    if (!items) items = SAMPLE[dose];

    cache[dose] = items.map(i => ({ ...i, id: uid(), subItems: (i.subItems || []).map(sub => ({ ...sub, id: uid() })) }));
    // Sub-itemy w klastrach: newest-first. Top-level: zachowaj [0] jako top story wybrany przez bota,
    // resztę sortuj newest-first.
    cache[dose].forEach(it => { it.subItems = sortNewestFirst(it.subItems); });
    const [topStory, ...rest] = cache[dose];
    cache[dose] = topStory ? [topStory, ...sortNewestFirst(rest)] : [];
    renderDose(dose, cache[dose]);
  } catch(e) {
    cache[dose] = SAMPLE[dose].map(i => ({ ...i, id: uid(), subItems: (i.subItems || []).map(sub => ({ ...sub, id: uid() })) }));
    cache[dose].forEach(it => { it.subItems = sortNewestFirst(it.subItems); });
    cache[dose] = sortNewestFirst(cache[dose]);
    renderDose(dose, cache[dose]);
  }
}

function renderSkeleton() {
  document.getElementById('content').innerHTML = `
    <div class="edition-bar">
      <div class="skel" style="width:110px;height:8px"></div>
      <div class="skel" style="width:50px;height:8px"></div>
    </div>
    <div style="padding:20px 16px;background:#fff;border-bottom:2px solid #0a0a0a;display:flex;flex-direction:column;gap:12px">
      <div class="skel" style="width:70px;height:8px"></div>
      <div class="skel" style="width:100%;height:20px"></div>
      <div class="skel" style="width:85%;height:20px"></div>
      <div class="skel" style="width:55%;height:20px"></div>
      <div class="skel" style="width:40%;height:8px"></div>
    </div>
    <div class="section-rule"><div class="section-rule-line"></div><div class="section-rule-label">Więcej Tematów</div><div class="section-rule-line"></div></div>
    ${[1,2,3,4,5,6].map(()=>`
      <div style="display:flex;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e2e2e2">
        <div class="skel" style="width:18px;height:9px;flex-shrink:0;margin-top:3px"></div>

        </div>
      </div>`).join('')}`;
}

function formatAddedAt(item) {
  if (!item.added_at) return '';
  const [datePart, timePart] = item.added_at.split(' ');
  if (!datePart || !timePart) return '';
  const [, m, d] = datePart.split('-');
  return `${d}.${m} · ${timePart}`;
}

// ── Sortowanie do wyświetlania: NAJNOWSZE ZAWSZE NA GÓRZE ──────────────
// Autorytatywne, deterministyczne, po stronie frontu — NIE polegamy na kolejności
// z bota/DeepSeeka (ta bywa zawodna). Front to ostatnia warstwa, więc gwarantuje
// poprawną kolejność niezależnie od tego, co przyjdzie w briefs.json.
function itemTimestamp(it) {
  // Dla klastra bierzemy NAJNOWSZY sub-item, żeby klaster ze świeżym newsem szedł do góry
  const cands = (it.subItems && it.subItems.length) ? it.subItems : [it];
  let best = 0;
  for (const s of cands) {
    if (!s || !s.added_at) continue;
    const t = Date.parse(String(s.added_at).replace(' ', 'T'));
    if (!isNaN(t) && t > best) best = t;
  }
  return best; // brak daty → 0 → ląduje na dole
}
function sortNewestFirst(items) {
  // slice() — nie mutujemy oryginału; stabilny sort zachowuje kolejność przy równych czasach
  return (items || []).slice().sort((a, b) => itemTimestamp(b) - itemTimestamp(a));
}

function itemSlug(text) {
  let h = 5381;
  for (let i = 0; i < Math.min(text.length, 80); i++) {
    h = ((h << 5) + h) ^ text.charCodeAt(i);
    h = h >>> 0;
  }
  return h.toString(36);
}

async function shareItem(url, title) {
  if (navigator.share) {
    try {
      await navigator.share({ title: 'BrifUp', text: title, url });
      return;
    } catch(e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Link skopiowany');
  } catch(e) {
    showToast('Nie można skopiować linku');
  }
}

function escAttr(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

// Linia "Wpływ na rynek": koloruje strzałki ↑ (zielony) / ↓ (czerwony)
function impactHtml(item) {
  if (!item.impact) return '';
  const colored = item.impact
    .replace(/↑/g, '<span class="imp-up">↑</span>')
    .replace(/↓/g, '<span class="imp-down">↓</span>');
  return `<div class="impact-box">
    <span class="impact-label">Wpływ na rynek</span>
    <span class="impact-text">${colored}</span>
  </div>`;
}

function expandBlock(item) {
  const slug = itemSlug(item.text);
  const shareUrl = `https://brifup.com/#${currentDose}/${slug}`;
  const shareBtn = `<button class="expand-share-btn"
    onclick="event.stopPropagation();shareItem('${escAttr(shareUrl)}','${escAttr(item.text)}')"
    ><span class="expand-share-icon">↑</span>Udostępnij</button>`;

  if (item.article) {
    const readBtn = item.source_url && item.source_url !== '#'
      ? `<a class="expand-read-btn" href="${item.source_url}" target="_blank">Czytaj →</a>`
      : item.rssLink
      ? `<a class="expand-read-btn" href="${item.rssLink}" target="_blank">Czytaj →</a>`
      : '';
    const imgHtml = item.image_url
      ? `<img class="expand-image" src="${escAttr(item.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
      : '';
    return `
      ${imgHtml}
      <div class="expand-article">${item.article}</div>
      ${impactHtml(item)}
      <div class="expand-divider"></div>
      <div class="expand-source-row">
        <div class="expand-source-left">
          <span class="expand-source-tag">Źródło</span>
          <span class="expand-sep">/</span>
          <span class="expand-source-name">${item.source_name||'—'}</span>
        </div>
        <div class="expand-actions">${shareBtn}${readBtn}</div>
      </div>`;
  }
  return `
    <div class="expand-loading">Brak rozszerzonego artykułu dla tego newsa.</div>
    <div class="expand-share-row">${shareBtn}</div>`;
}

function renderSubItems(subItems) {
  if (!subItems || subItems.length === 0) return '';
  return subItems.map(sub => `
    <div class="sub-item" id="item-${sub.id}" role="button" tabindex="0" aria-expanded="false" onclick="event.stopPropagation();toggleSubItem('${sub.id}')">
      <span class="sub-item-flag">${sub.flag||'📰'}</span>
      <div class="sub-item-text">${sub.text}${sub.added_at ? `<div class="item-time">${formatAddedAt(sub)}</div>` : ''}</div>
      <div class="sub-item-arrow">›</div>
    </div>
    <div class="card-expand" id="exp-${sub.id}">${expandBlock(sub)}</div>
  `).join('');
}

// ══ Archiwum — przeglądanie dawek z poprzednich dni ══════════════════
// Bot przy każdym przejściu na nowy dzień zapisuje zamykaną dawkę do
// archive/{data}.json (ten sam kształt co briefs.json) i rejestruje datę
// w archive/index.json. Tu tylko czytamy te pliki — bez zapisu.
let archiveDatesCache = null;
let archiveDayCache = {};

function openArchive() {
  document.getElementById('archiveOverlay').classList.add('show');
  showArchiveList();
}
// Otwiera overlay od razu na konkretnym dniu (np. z bocznego panelu desktopu) — BEZ wywoływania
// showArchiveList() równolegle, bo dwa jednoczesne fetch-e mogłyby się wyścigowo nadpisać w body.innerHTML.
function openArchiveToDay(dateStr) {
  document.getElementById('archiveOverlay').classList.add('show');
  showArchiveDay(dateStr);
}
function closeArchive() {
  document.getElementById('archiveOverlay').classList.remove('show');
}

async function showArchiveList() {
  document.getElementById('archiveTitle').textContent = 'Archiwum';
  document.getElementById('archiveBack').style.visibility = 'hidden';
  const body = document.getElementById('archiveBody');
  body.innerHTML = '<div class="archive-empty">Ładowanie…</div>';
  try {
    if (!archiveDatesCache) {
      const r = await fetch('./archive/index.json', { cache: 'no-store' });
      archiveDatesCache = r.ok ? await r.json() : [];
    }
    if (!archiveDatesCache || !archiveDatesCache.length) {
      body.innerHTML = '<div class="archive-empty">Archiwum jest jeszcze puste.<br>Pierwsze dawki pojawią się tu automatycznie następnego dnia.</div>';
      return;
    }
    const sorted = archiveDatesCache.slice().sort((a, b) => b.localeCompare(a)); // najnowsze na górze
    body.innerHTML = sorted.map(d => {
      const dt = new Date(d + 'T00:00:00');
      const main = dt.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
      const sub = dt.toLocaleDateString('pl-PL', { weekday: 'long' });
      return `<div class="archive-date-row" onclick="showArchiveDay('${d}')">
        <div><div class="archive-date-main">${main}</div><div class="archive-date-sub">${sub}</div></div>
        <div class="archive-date-arrow">›</div>
      </div>`;
    }).join('');
  } catch (e) {
    body.innerHTML = '<div class="archive-empty">Nie udało się wczytać archiwum.</div>';
  }
}

// highlightSlug: opcjonalny slug (z deep-linku #archive/{data}/{dawka}/{slug}) — po wyrenderowaniu
// otwiera i podświetla dokładnie ten news/klaster, tak samo jak deep-link do żywej dawki.
async function showArchiveDay(dateStr, highlightSlug) {
  document.getElementById('archiveTitle').textContent = dateStr;
  document.getElementById('archiveBack').style.visibility = 'visible';
  const body = document.getElementById('archiveBody');
  body.innerHTML = '<div class="archive-empty">Ładowanie…</div>';
  try {
    let dayData = archiveDayCache[dateStr];
    if (!dayData) {
      const r = await fetch(`./archive/${dateStr}.json`, { cache: 'no-store' });
      dayData = r.ok ? await r.json() : {};
      archiveDayCache[dateStr] = dayData;
    }
    const doseNames = { morning: '☀ Poranna', afternoon: '◑ Popołudniowa', evening: '☽ Wieczorna' };
    let html = '';
    let highlight = null; // { id, isGroup, parentId }
    for (const key of ['morning', 'afternoon', 'evening']) {
      const dose = dayData[key];
      if (!dose || !dose.items || !dose.items.length) continue;
      const items = sortNewestFirst(dose.items).map(i => ({
        ...i, id: 'a-' + uid(),
        subItems: sortNewestFirst(i.subItems).map(s => ({ ...s, id: 'a-' + uid() }))
      }));
      if (highlightSlug && !highlight) {
        outer: for (const it of items) {
          if (itemSlug(it.text) === highlightSlug) { highlight = { id: it.id, isGroup: !!(it.subItems && it.subItems.length) }; break; }
          if (it.subItems) {
            for (const sub of it.subItems) {
              if (itemSlug(sub.text) === highlightSlug) { highlight = { id: sub.id, isGroup: false, parentId: it.id }; break outer; }
            }
          }
        }
      }
      html += `<div class="archive-day-section-title">${doseNames[key]}</div>`;
      html += items.map((item, idx) => renderArchiveItem(item, idx, dateStr, key)).join('');
    }
    body.innerHTML = html || '<div class="archive-empty">Brak zapisanych newsów dla tego dnia.</div>';

    if (highlight) {
      if (highlight.parentId) {
        const groupEl = document.getElementById('group-' + highlight.parentId);
        if (groupEl && !groupEl.classList.contains('open')) toggleGroup(highlight.parentId);
      }
      setTimeout(() => {
        let el;
        if (highlight.isGroup) {
          el = document.getElementById('group-' + highlight.id);
          if (el && !el.classList.contains('open')) toggleGroup(highlight.id);
        } else {
          el = document.getElementById('item-' + highlight.id);
          if (el && !el.classList.contains('open')) toggleSubItem(highlight.id);
        }
        if (!el) return;
        setTimeout(() => {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('deep-link-highlight');
          setTimeout(() => el.classList.remove('deep-link-highlight'), 2000);
        }, 160);
      }, highlight.parentId ? 140 : 0);
    }
  } catch (e) {
    body.innerHTML = '<div class="archive-empty">Nie udało się wczytać tej dawki.</div>';
  }
}

function renderArchiveItem(item, idx, dateStr, dose) {
  const isGroup = item.subItems && item.subItems.length > 0;
  if (isGroup) {
    return `
      <div class="news-item" id="group-${item.id}" role="button" tabindex="0" aria-expanded="false" onclick="toggleGroup('${item.id}')">
        <div class="news-num">${String(idx + 1).padStart(2, '0')}</div>
        <div class="news-body"><span class="news-flag">${item.flag || '📰'}</span><div class="news-title">${item.text}</div></div>
        <div class="news-arrow">›</div>
      </div>
      <div class="sub-items-container" id="subc-${item.id}">${renderArchiveSubItems(item.subItems, dateStr, dose)}</div>`;
  }
  return `
    <div class="news-item" id="item-${item.id}" role="button" tabindex="0" aria-expanded="false" onclick="toggleSubItem('${item.id}')">
      <div class="news-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="news-body">
        <span class="news-flag">${item.flag || '📰'}</span>
        <div class="news-title">${item.text}</div>
        ${item.added_at ? `<div class="item-time">${formatAddedAt(item)}</div>` : ''}
      </div>
      <div class="news-arrow">›</div>
    </div>
    <div class="card-expand" id="exp-${item.id}">${expandBlockArchive(item, dateStr, dose)}</div>`;
}
function renderArchiveSubItems(subItems, dateStr, dose) {
  if (!subItems || !subItems.length) return '';
  return subItems.map(sub => `
    <div class="sub-item" id="item-${sub.id}" role="button" tabindex="0" aria-expanded="false" onclick="event.stopPropagation();toggleSubItem('${sub.id}')">
      <span class="sub-item-flag">${sub.flag || '📰'}</span>
      <div class="sub-item-text">${sub.text}${sub.added_at ? `<div class="item-time">${formatAddedAt(sub)}</div>` : ''}</div>
      <div class="sub-item-arrow">›</div>
    </div>
    <div class="card-expand" id="exp-${sub.id}">${expandBlockArchive(sub, dateStr, dose)}</div>`).join('');
}
// Jak expandBlock, ale z linkiem w formacie #archive/{data}/{dawka}/{slug} — deep-linki do archiwum
// otwierają ten konkretny dzień/dawkę zamiast dzisiejszych danych.
function expandBlockArchive(item, dateStr, dose) {
  const shareBtn = (dateStr && dose) ? (() => {
    const slug = itemSlug(item.text);
    const shareUrl = `https://brifup.com/#archive/${dateStr}/${dose}/${slug}`;
    return `<button class="expand-share-btn"
      onclick="event.stopPropagation();shareItem('${escAttr(shareUrl)}','${escAttr(item.text)}')"
      ><span class="expand-share-icon">↑</span>Udostępnij</button>`;
  })() : '';
  if (item.article) {
    const readBtn = item.source_url && item.source_url !== '#'
      ? `<a class="expand-read-btn" href="${item.source_url}" target="_blank">Czytaj →</a>` : '';
    const imgHtml = item.image_url
      ? `<img class="expand-image" src="${escAttr(item.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
      : '';
    return `
      ${imgHtml}
      <div class="expand-article">${item.article}</div>
      ${impactHtml(item)}
      <div class="expand-divider"></div>
      <div class="expand-source-row">
        <div class="expand-source-left">
          <span class="expand-source-tag">Źródło</span>
          <span class="expand-sep">/</span>
          <span class="expand-source-name">${item.source_name || '—'}</span>
        </div>
        <div class="expand-actions">${shareBtn}${readBtn}</div>
      </div>`;
  }
  return `
    <div class="expand-loading">Brak rozszerzonego artykułu dla tego newsa.</div>
    <div class="expand-share-row">${shareBtn}</div>`;
}

function escAttr(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderDose(dose, items) {
  const cfg = DOSE_CFG[dose];
  if (!items || items.length === 0) return;
  const hero = items[0];
  const isHeroGroup = hero.subItems && hero.subItems.length > 0;

  const heroBlock = isHeroGroup ? `
    <div class="hero-card" id="group-${hero.id}" data-text="${escAttr(hero.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleGroup('${hero.id}')">
      <div class="hero-kicker">
        <span class="hero-flag">${hero.flag||'📰'}</span>
        <span class="hero-kicker-label ${cfg.kickerClass}">${cfg.kicker}</span>
      </div>
      <div class="hero-title">${hero.text}</div>
      <div class="hero-footer">
        <span class="hero-source">${hero.subItems.length} powiązane newsy</span>
        <span class="hero-arrow">›</span>
      </div>
    </div>
    <div class="sub-items-container" id="subc-${hero.id}">
      ${renderSubItems(hero.subItems)}
    </div>`
    : `
    <div class="hero-card" id="item-${hero.id}" data-text="${escAttr(hero.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleSubItem('${hero.id}')">
      <div class="hero-kicker">
        <span class="hero-flag">${hero.flag||'📰'}</span>
        <span class="hero-kicker-label ${cfg.kickerClass}">${cfg.kicker}</span>
      </div>
      <div class="hero-title">${hero.text}</div>
      ${hero.added_at ? `<div class="item-time">${formatAddedAt(hero)}</div>` : ''}
      <div class="hero-footer">
        <span class="hero-source">${hero.source_name || 'Czytaj pełny artykuł'}</span>
        <span class="hero-arrow">›</span>
      </div>
    </div>
    <div class="card-expand" id="exp-${hero.id}">${expandBlock(hero)}</div>`;

  const restBlocks = items.slice(1).map((item, i) => {
    const isGroup = item.subItems && item.subItems.length > 0;
    if (isGroup) {
      return `
        <div class="news-item" id="group-${item.id}" data-text="${escAttr(item.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleGroup('${item.id}')">
          <div class="news-num">0${i+2}</div>
          <div class="news-body">
            <span class="news-flag">${item.flag||'📰'}</span>
            <div class="news-title">${item.text}</div>
          </div>
          <div class="news-arrow">›</div>
        </div>
        <div class="sub-items-container" id="subc-${item.id}">
          ${renderSubItems(item.subItems)}
        </div>`;
    } else {
      return `
        <div class="news-item" id="item-${item.id}" data-text="${escAttr(item.text)}" role="button" tabindex="0" aria-expanded="false" onclick="toggleSubItem('${item.id}')">
          <div class="news-num">0${i+2}</div>
          <div class="news-body">
            <span class="news-flag">${item.flag||'📰'}</span>
            <div class="news-title">${item.text}</div>
            ${item.added_at ? `<div class="item-time">${formatAddedAt(item)}</div>` : ''}
          </div>
          <div class="news-arrow">›</div>
        </div>
        <div class="card-expand" id="exp-${item.id}">${expandBlock(item)}</div>`;
    }
  }).join('');

  const editionBar = isPrevEdition(dose)
    ? `<div class="prevbar"><span class="pb-ico">◷</span><span class="pb-txt">Wczorajsze wydanie</span><span class="pb-dot">·</span><span class="pb-meta">${formatDoseDate(doseDates[dose])} · nowe ~${cfg.time}</span></div>`
    : `<div class="edition-bar"><div class="edition-name">${cfg.edition}</div><div class="edition-time">${cfg.time} · ${new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'short'})}</div></div>`;

  document.getElementById('content').innerHTML = `
    ${editionBar}
    ${heroBlock}
    <div class="section-rule">
      <div class="section-rule-line"></div>
      <div class="section-rule-label">Więcej tematów</div>
      <div class="section-rule-line"></div>
    </div>
    ${restBlocks}`;

  renderDesktop(dose, items);
  updatePageMeta(dose, cfg, items);
  scrollArea.scrollTop = 0;
}

// Tytuł karty i dane strukturalne odzwierciedlają to, co faktycznie jest na ekranie —
// bez tego każda dawka i każdy news dzielą ten sam gołý "BrifUp" w tytule zakładki,
// a wyszukiwarki (na tyle, na ile w ogóle wykonają JS) nie widzą żadnej treści newsów.
function updatePageMeta(dose, cfg, items) {
  const top = items[0];
  if (top?.text) document.title = `${top.text} — ${cfg.label} — Brif.up`;

  const ld = {
    '@context': 'https://schema.org',
    '@type': 'ItemList',
    name: `Brif.up — ${cfg.label}`,
    itemListElement: items.slice(0, 15).map((it, i) => ({
      '@type': 'ListItem',
      position: i + 1,
      item: {
        '@type': 'NewsArticle',
        headline: it.text,
        ...(it.article ? { description: it.article } : {}),
        ...(it.source_url && it.source_url !== '#' ? { url: it.source_url } : {}),
        ...(it.source_name ? { publisher: { '@type': 'Organization', name: it.source_name } } : {}),
        ...(it.added_at ? { datePublished: it.added_at.replace(' ', 'T') + ':00+02:00' } : {}),
      }
    }))
  };
  let script = document.getElementById('ld-json');
  if (!script) {
    script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'ld-json';
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(ld);
}

// ── Poziom 1: otwórz/zamknij GRUPĘ (klaster tematyczny) ──
// Otwiera/zamyka kartę i trzyma stan "rozwinięte" widoczny też dla czytników ekranu
// (samo .open to tylko wygląd — bez tego czytnik nie wie, że coś się rozwinęło).
function setCardOpen(el, isOpen) {
  el.classList.toggle('open', isOpen);
  el.setAttribute('aria-expanded', String(isOpen));
}

// Karty (.hero-card, .news-item, .sub-item) mają role="button" + tabindex, więc łapią fokus
// z Tab — ale sam onclick nie reaguje na klawiaturę. Enter/Spacja na dowolnej z nich robi
// dokładnie to, co kliknięcie (event delegation — działa też dla kart dorenderowanych później).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.hero-card, .news-item, .sub-item');
  if (!card) return;
  e.preventDefault(); // Spacja inaczej przewinęłaby stronę
  card.click();
});

function toggleGroup(groupId) {
  const groupEl = document.getElementById('group-'+groupId);
  const subcEl  = document.getElementById('subc-'+groupId);
  if (!groupEl || !subcEl) return;
  const isOpen = groupEl.classList.contains('open');

  // Layout zmieni wysokość strony — zignoruj wynikły z tego scroll event,
  // żeby taby Poranna/Południowa/Wieczorna nie chowały się przy zwykłym kliknięciu.
  suppressScrollHide = true;
  setTimeout(() => { suppressScrollHide = false; }, 400);

  // Zamknij WSZYSTKIE grupy i sub-itemy (i ich expandy) na poziomie głównym
  document.querySelectorAll('.hero-card.open, .news-item.open').forEach(c => setCardOpen(c, false));
  document.querySelectorAll('.sub-item.open').forEach(c => setCardOpen(c, false));

  if (!isOpen) {
    setCardOpen(groupEl, true);
    // Jeśli grupa ma tylko 1 podpunkt — otwórz go automatycznie
    const subItems = subcEl.querySelectorAll('.sub-item');
    if (subItems.length === 1) {
      const onlyId = subItems[0].id.replace('item-','');
      setTimeout(() => toggleSubItem(onlyId), 60);
    }
  }
}

// ── Poziom 2: otwórz/zamknij POJEDYNCZY news → pokazuje artykuł ──
function toggleSubItem(id) {
  const itemEl = document.getElementById('item-'+id);
  const exp    = document.getElementById('exp-'+id);
  if (!itemEl || !exp) return;
  const isOpen = itemEl.classList.contains('open');

  suppressScrollHide = true;
  setTimeout(() => { suppressScrollHide = false; }, 400);

  // Zamknij inne otwarte sub-itemy (ale NIE zamykaj nadrzędnej grupy)
  document.querySelectorAll('.sub-item.open').forEach(c => {
    if (c.id !== 'item-'+id) setCardOpen(c, false);
  });

  setCardOpen(itemEl, !isOpen);
}

function switchDose(dose) {
  currentDose = dose;
  suppressScrollHide = true;
  setTimeout(() => { suppressScrollHide = false; }, 400);
  document.querySelectorAll('.dose-tab').forEach(t=>t.classList.remove('active'));

}

// ══ Deep link do archiwum: brifup.com/#archive/2026-07-03/afternoon/slug ══
(function() {
  const hash = location.hash.slice(1);
  const parts = hash.split('/');
  if (parts[0] !== 'archive' || parts.length < 4) return;
  const dateStr = parts[1], slug = parts[3];
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || !slug) return;

  document.getElementById('archiveOverlay').classList.add('show');
  showArchiveDay(dateStr, slug);
})();

// ══ Deep link: brifup.com/#morning/slug ═══════════════
(function() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const sep = hash.indexOf('/');
  if (sep === -1) return;
  const dose = hash.slice(0, sep);
  const slug = hash.slice(sep + 1);
  if (!['morning','afternoon','evening'].includes(dose) || !slug) return;

  if (dose !== currentDose) switchDose(dose);

  function tryOpen(attempts) {
    const items = cache[dose];
    if (!items) {
      if (attempts < 25) setTimeout(() => tryOpen(attempts + 1), 200);
      return;
    }
    let found = null, parent = null;
    outer: for (const it of items) {
      if (itemSlug(it.text) === slug) { found = it; break; }
      if (it.subItems) {
        for (const sub of it.subItems) {
          if (itemSlug(sub.text) === slug) { found = sub; parent = it; break outer; }
        }
      }
    }
    if (!found) return;

    const isGroup = found.subItems && found.subItems.length > 0;

    // Sub-item w klastrze jest ukryty w zwiniętym kontenerze — najpierw otwórz nadrzędną grupę,
    // dopiero potem sam podpunkt. Bez tego scrollIntoView skacze do niewidocznego elementu.
    if (parent) {
      const groupEl = document.getElementById('group-' + parent.id);
      if (groupEl && !groupEl.classList.contains('open')) toggleGroup(parent.id);
    }

    setTimeout(() => {
      let el;
      if (isGroup) {
        // Udostępniono nagłówek klastra — otwórz grupę i podświetl jej nagłówek
        el = document.getElementById('group-' + found.id);
        if (el && !el.classList.contains('open')) toggleGroup(found.id);
      } else {
        el = document.getElementById('item-' + found.id);
        // toggleGroup mógł już auto-otworzyć jedyny podpunkt — otwieraj tylko jeśli zamknięty
        if (el && !el.classList.contains('open')) toggleSubItem(found.id);
      }
      if (!el) return;
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('deep-link-highlight');
        setTimeout(() => el.classList.remove('deep-link-highlight'), 2000);
      }, 160);
    }, parent ? 140 : 0);
  }
  setTimeout(() => tryOpen(0), 150);
})();

// ══ Swipe między dawkami ══════════════════════════════
(function() {
  const DOSES = ['morning', 'afternoon', 'evening'];
  let touchStartX = 0, touchStartY = 0;
  const scrollArea = document.querySelector('.scroll-area');
  scrollArea.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  scrollArea.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = DOSES.indexOf(currentDose);
    if (dx < 0 && idx < DOSES.length - 1) switchDose(DOSES[idx + 1]);
    else if (dx > 0 && idx > 0) switchDose(DOSES[idx - 1]);
  }, { passive: true });
})();

// ══ Pull-to-refresh ════════════════════════════════════
(function() {
  const ptr = document.getElementById('ptr');
  const area = document.getElementById('scrollArea');
  let startY = 0, pulling = false, refreshing = false;

  area.addEventListener('touchstart', e => {
    if (area.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });

  area.addEventListener('touchmove', e => {
    if (!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 10) {
      ptr.classList.add('pulling');
      ptr.innerHTML = dy > 60 ? '<span class="ptr-arrow">↑ Puść by odświeżyć</span>' : '<span class="ptr-arrow">↓ Odśwież</span>';
    } else {
      ptr.classList.remove('pulling');
    }
  }, { passive: true });

  area.addEventListener('touchend', e => {
    if (!pulling) return;
    const dy = e.changedTouches[0].clientY - startY;
    pulling = false;
    if (dy > 60 && !refreshing) {
      refreshing = true;
      ptr.innerHTML = '<div class="ptr-spinner"></div>';
      ptr.classList.add('refreshing');
      refresh().then(() => {
        ptr.classList.remove('pulling', 'refreshing');
        ptr.innerHTML = '<span class="ptr-arrow">↓ Odśwież</span>';
        refreshing = false;
      });
    } else {
      ptr.classList.remove('pulling', 'refreshing');
    }
  }, { passive: true });
})();

// ══ PWA — rejestracja Service Workera ════════════════
let swRegistration = null;

// Zabezpieczenie przed pętlą przeładowań: oba mechanizmy odświeżania niżej (nowy SW przejął
// kontrolę / wykryto nowy index.html) odpalają się niezależnie od siebie i przy KAŻDYM powrocie
// do apki (visibilitychange) — bez wspólnego, jednorazowego bezpiecznika mogłyby zapętlić się
// w reload-po-reload, zwłaszcza na wolnym połączeniu, gdzie sam reload nie zdąży się dokończyć,
// zanim znów zostanie wykryta "nowa wersja". sessionStorage (nie zwykła zmienna) przeżywa sam
// reload, więc realnie ogranicza to do JEDNEGO przeładowania na całą sesję karty/apki.
function reloadOnce(powod) {
  if (sessionStorage.getItem('brifup_reloaded_for_update')) return;
  sessionStorage.setItem('brifup_reloaded_for_update', '1');
  console.log('Odświeżam raz z powodu:', powod);
  window.location.reload();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => { swRegistration = reg; console.log('Service Worker zarejestrowany'); })
      .catch((err) => console.warn('SW registration failed:', err));
  });
  // Auto-reload gdy nowy SW przejmie kontrolę (nowa wersja apki)
  navigator.serviceWorker.addEventListener('controllerchange', () => reloadOnce('nowy Service Worker'));
}

// ══ Wykrywanie nowej wersji apki (index.html) ════════
// W zainstalowanej PWA system zwykle WZNAWIA istniejące okno bez nawigacji
// sieciowej, więc świeży index.html nie jest pobierany aż do pełnego restartu
// (w Chrome każde wejście to realna nawigacja, dlatego tam zmiany widać od razu).
// Tu przy każdym powrocie na pierwszy plan porównujemy ETag/Last-Modified
// index.html z wersją, z której wystartowała apka — jeśli się zmienił,
// przeładowujemy. Działa automatycznie, bez ręcznego bumpowania wersji.
let loadedAppTag = null;
async function checkAppShellUpdate() {
  try {
    // Zmuś przeglądarkę do ponownego sprawdzenia samego service-workera
    if (swRegistration) { swRegistration.update().catch(() => {}); }
    const res = await fetch('./index.html', { cache: 'reload' });
    const tag = res.headers.get('etag') || res.headers.get('last-modified') || res.headers.get('content-length');
    if (!tag) return;
    if (loadedAppTag === null) { loadedAppTag = tag; return; } // pierwsza wizyta = wersja bazowa
    if (tag !== loadedAppTag) { loadedAppTag = tag; reloadOnce('nowa wersja index.html'); }
  } catch (_) { /* offline — zostajemy na obecnej wersji */ }
}
window.addEventListener('load', () => { checkAppShellUpdate(); });

// ══ OneSignal — push notifications ════════════════════
const ONESIGNAL_APP_ID = '20698631-0f06-4308-a11e-4a0388c68853';

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  if (ONESIGNAL_APP_ID === 'TWOJ_ONESIGNAL_APP_ID') return;
  await OneSignal.init({ appId: ONESIGNAL_APP_ID });
  updateBellBtn();
  OneSignal.User.PushSubscription.addEventListener('change', updateBellBtn);
});

function updateBellBtn() {
  const btn = document.getElementById('bellBtn');
  if (!btn || !window.OneSignal) return;
  const subscribed = OneSignal.User.PushSubscription.optedIn;
  btn.classList.toggle('active', !!subscribed);
  btn.classList.toggle('inactive', !subscribed);
}

async function togglePush() {
  if (ONESIGNAL_APP_ID === 'TWOJ_ONESIGNAL_APP_ID') {
    showToast('Powiadomienia jeszcze niedostępne');
    return;
  }
  if (!window.OneSignal) {
    showToast('Nie można załadować powiadomień — sprawdź AdBlock lub połączenie');
    return;
  }
  try {
    if (OneSignal.User.PushSubscription.optedIn) {
      await OneSignal.User.PushSubscription.optOut();
      showToast('Powiadomienia wyłączone');
    } else {
      await OneSignal.Notifications.requestPermission();
      if (Notification.permission === 'denied') {
        showToast('Powiadomienia zablokowane — odblokuj w ustawieniach Chrome');
        return;
      }
      await OneSignal.User.PushSubscription.optIn();
      showToast('Powiadomienia włączone');
    }
    updateBellBtn();
  } catch (e) {
    showToast('Błąd: ' + (e.message || 'spróbuj ponownie'));
  }
}

function dtGetCategory(item) {
  const t = (item.text || '').toLowerCase();
  if (/\bfed\b|ebc\b|ecb\b|boj\b|nbp\b|monetarn|inflacj|stopa proc|stóp proc|stopy proc|obniżk stóp|podwyżk stóp|oprocentow|rrr\b|bank centraln|rezerw federal|polityk pieniężn/.test(t)) return 'Fed / Banki';
  if (/geopolit|wojn|armi|iran|ukrain|\brosj|chin[iy]|chińsk|izrael|palestyn|konflikt zbrojn|dron|rakiet|kijów|kijowie|moskw|kreml|żołnier|eliminowan|pentagon|zelenski|zełenski|putin|oblężen|ofensyw|batalion|brygad|ostrzał|bombardow|inwazj|okupac|rozejm|zawieszenie broni|wywiad wojsk|cia\b|fsb\b|zbrojn|obronn|marynark|okręt|pocisk|cieśnin|hormuz|ormuz|suez|damaszk|syri|libi|jemen|huti|wagnera|africa corps|straty bojow|wycofan wojsk|eskalac|deeskalac|budanow|hezbol|sankcj|taliba|generał|wojsk\b|sabotaż|nord stream|sudan\b|kongo\b/.test(t)) return 'Geopolityka';
  if (/\bai\b|sztuczn intel|chip|nvidia|intel\b|apple\b|google\b|microsoft|openai|technolog|startup|meta\b|amazon\b|spacex|deepseek|anthropic|gemini|llm\b|blockchain|krypto|bitcoin|ethereum|sam altman|elon musk|model językow|robot|satelit|starlink|tesla\b|alibaba/.test(t)) return 'Tech / AI';
  if (/\brop[ay]\b|ropa naft|gaz ziemn|gaz\b|złot[ao]\b|metal|surowc|opec|brent|barrel|węgiel|miedź|kaw[aęy]\b|soja\b|pszenica|kukurydza|zboż|żywność|paliw|energetyk|energia\b|jądrowa|atomow|lng\b|skroplony gaz/.test(t)) return 'Surowce';
  if (/sejm|senat\b|rząd|premier|prezydent|ministerstw|minister\b|koalicj|partie\b|partia\b|wybor|ustaw\b|ustawa|weto\b|opozycj|parlament|tusk|duda\b|trump|biden|harris\b|macron|scholz|orbán|orban|kongres\b|biały dom|white house|administracj|cła\b|ceł\b|taryf|nato\b|unia europejsk|komisja europejsk|trybunał|prokurat|kampania wybor|le pen|sąd\b|wyrok|skazuj|uniewinni|kandydow|partyjn|polityczn/.test(t)) return 'Polityka';
  if (/policj|narkotyk|przemyt|aresztowan|zatrzyman|konfiskat|morderst|zabójst|przestępst|\bfifa\b|piłka nożn|igrzysk|olimpiad|wulkan|erupcj|trzęsienie ziemi|powódź|tsunami|huragan|tornado|epidemi|pandemi|szczepionk|chorob|wirus\b|festiwal|katastrofa|wypadek\b|cristiano|messi|lebron|watykan|papież|mdma\b|kokain|heroiny|heroina|fentanyl|fifa\b|nfl\b|nba\b|formula 1|formula one/.test(t)) return 'Świat';
  return 'Rynki';
}

const DT_CAT_COLORS = {
  'Fed / Banki':'#ef4444','Geopolityka':'#f97316','Tech / AI':'#06b6d4','Surowce':'#22c55e','Polityka':'#8b5cf6','Świat':'#0ea5e9','Rynki':'#6366f1'
};

function dtRenderSidebar(items) {
  const counts = {};
  function countIt(it) { const c = dtGetCategory(it); counts[c] = (counts[c]||0)+1; }
  items.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  dtArchiveAllItems.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  const catsEl = document.getElementById('dtCategories');
  if (catsEl) {
    const order = ['Fed / Banki','Geopolityka','Polityka','Tech / AI','Surowce','Świat','Rynki'];
    catsEl.innerHTML = '<div class="dt-index-title">Tematy</div>' +
      order.filter(c => counts[c]).map(c =>
        `<div class="dt-index-item" onclick="dtFilterCat(this)">
          <div class="dt-index-dot" style="background:${DT_CAT_COLORS[c]}"></div>
          <span class="dt-index-label">${c}</span>
          <span class="dt-index-n">${counts[c]}</span>
        </div>`
      ).join('');
  }
  dtRenderArchiveSidebar();
}

async function dtRenderArchiveSidebar() {
  const archEl = document.getElementById('dtArchive');
  if (!archEl) return;
  try {
    if (!archiveDatesCache) {
      const r = await fetch('./archive/index.json', { cache: 'no-store' });
      archiveDatesCache = r.ok ? await r.json() : [];
    }
    if (!archiveDatesCache || !archiveDatesCache.length) {
      archEl.innerHTML = '<div class="dt-index-title">Archiwum</div><div class="dt-index-item dim"><span class="dt-index-label">Jeszcze puste</span></div>';
      return;
    }
    const sorted = archiveDatesCache.slice().sort((a, b) => b.localeCompare(a));
    let html = '<div class="dt-index-title">Archiwum</div>';
    html += sorted.slice(0, 5).map(d => {
      const dt = new Date(d + 'T00:00:00');
      const label = dt.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
      return `<div class="dt-index-item" onclick="openArchiveToDay('${d}')"><div class="dt-index-dot" style="background:#8a8577"></div><span class="dt-index-label">${label}</span></div>`;
    }).join('');
    if (sorted.length > 5) {
      html += `<div class="dt-index-item" onclick="openArchive()"><span class="dt-index-label" style="color:var(--muted)">Zobacz wszystkie →</span></div>`;
    }
    archEl.innerHTML = html;

    if (!dtArchiveLoaded) {
      dtArchiveLoaded = true;
      dtArchiveAllItems = [];
      for (const d of sorted) {
        try {
          if (!archiveDayCache[d]) {
            const r = await fetch(`./archive/${d}.json`, { cache: 'no-store' });
            if (r.ok) archiveDayCache[d] = await r.json();
          }
          if (archiveDayCache[d]) {
            for (const dose of ['morning','afternoon','evening']) {
              const doseData = archiveDayCache[d][dose];
              if (doseData?.items) {
                doseData.items.forEach(it => dtArchiveAllItems.push({...it, _archiveDate: d, _dose: dose}));
              }
            }
          }
        } catch(e) {}
      }
      dtRenderSidebarCounts();
    }
  } catch (e) {
    archEl.innerHTML = '<div class="dt-index-title">Archiwum</div>';
  }
}

function dtRenderSidebarCounts() {
  const counts = {};
  function countIt(it) { const c = dtGetCategory(it); counts[c] = (counts[c]||0)+1; }
  dtAllItems.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  dtArchiveAllItems.forEach(it => it.subItems?.length > 0 ? it.subItems.forEach(countIt) : countIt(it));
  const catsEl = document.getElementById('dtCategories');
  if (!catsEl) return;
  const order = ['Fed / Banki','Geopolityka','Polityka','Tech / AI','Surowce','Świat','Rynki'];
  const activeFilter = dtActiveFilter;
  catsEl.innerHTML = '<div class="dt-index-title">Tematy</div>' +
    order.filter(c => counts[c]).map(c =>
      `<div class="dt-index-item${activeFilter===c?' active':''}" onclick="dtFilterCat(this)">
        <div class="dt-index-dot" style="background:${DT_CAT_COLORS[c]}"></div>
        <span class="dt-index-label">${c}</span>
        <span class="dt-index-n">${counts[c]}</span>
      </div>`
    ).join('');
}

function dtFilterCat(el) {
  const cat = el.querySelector('.dt-index-label')?.textContent;
  if (!cat) return;
  const wasActive = dtActiveFilter === cat;
  document.querySelectorAll('#dtCategories .dt-index-item').forEach(e => e.classList.remove('active'));
  if (wasActive) {
    dtActiveFilter = null;
    dtRenderFeed(dtAllItems);
    const fcEl = document.getElementById('dtFeedCount');
    if (fcEl) fcEl.textContent = `${dtAllItems.reduce((s,it) => s + (it.subItems?.length > 0 ? it.subItems.length : 1), 0)} wpisów`;
  } else {
    dtActiveFilter = cat;
    el.classList.add('active');
    const matchesCat = it => it.subItems?.length > 0 ? it.subItems.some(sub => dtGetCategory(sub) === cat) : dtGetCategory(it) === cat;
    const today = new Date().toISOString().slice(0,10);
    const byDate = {};
    const todayMatching = dtAllItems.filter(matchesCat);
    if (todayMatching.length) byDate[today] = todayMatching;
    dtArchiveAllItems.filter(matchesCat).forEach(it => {
      const d = it._archiveDate;
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(it);
    });
    const sortedDates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));
    dtRenderFeedCrossDay(byDate, sortedDates, today);
    const total = sortedDates.reduce((s,d) => s + byDate[d].reduce((ss,it) => ss + (it.subItems?.length > 0 ? it.subItems.length : 1), 0), 0);
    const fcEl = document.getElementById('dtFeedCount');
    if (fcEl) fcEl.textContent = `${total} wpisów`;
  }
  dtShowEmpty();
}

function dtRenderFeedCrossDay(byDate, sortedDates, today) {
  let html = '';
  let globalIdx = 0;
  sortedDates.forEach(d => {
    const label = d === today
      ? 'Dziś'
      : new Date(d + 'T00:00:00').toLocaleDateString('pl-PL', {day:'numeric', month:'long', year:'numeric'});
    html += `<div style="padding:8px 12px 4px;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--border)">${label}</div>`;
    byDate[d].forEach(item => {
      globalIdx++;
      const num = String(globalIdx).padStart(3,'0');
      const isGroup = item.subItems?.length > 0;
      if (isGroup) {
        const subsHtml = item.subItems.map(sub =>
          `<div class="dt-sub-item" id="dts-${sub.id}" onclick="event.stopPropagation();dtPickItem('${sub.id}')">
            <span class="dt-sub-flag">${sub.flag||'📰'}</span>
            <div class="dt-sub-text">${sub.text}</div>
          </div>`
        ).join('');
        html += `<div class="dt-item group-header" id="dti-${item.id}" onclick="dtToggleGroup('${item.id}')">
          <div class="dt-item-num">${num}</div>
          <div class="dt-item-flag">${item.flag||'📰'}</div>
          <div class="dt-item-body">
            <div class="dt-item-headline">${item.text}</div>
            <div class="dt-item-meta"><span>↓ ${item.subItems.length} powiązane</span></div>
          </div>
        </div>
        <div class="dt-group-subs" id="dtg-${item.id}" style="display:none">${subsHtml}</div>`;
      } else {
        const t = formatAddedAt(item);
        html += `<div class="dt-item" id="dti-${item.id}" onclick="dtPickItem('${item.id}')">
          <div class="dt-item-num">${num}</div>
          <div class="dt-item-flag">${item.flag||'📰'}</div>
          <div class="dt-item-body">
            <div class="dt-item-headline">${item.text}</div>
            ${(t||item.source_name)?`<div class="dt-item-meta">${t?`<span>${t}</span>`:''} ${item.source_name?`<span>${item.source_name}</span>`:''}</div>`:''}
          </div>
        </div>`;
      }
    });
  });
  const feedList = document.getElementById('dtFeedList');
  if (feedList) feedList.innerHTML = html;
}

function dtRenderFeed(items) {
  let html = '';
  items.forEach((item, i) => {
    const num = String(i+1).padStart(3,'0');
    const isGroup = item.subItems?.length > 0;
    const isTop = !!item.top;
    if (isGroup) {
      const subsHtml = item.subItems.map(sub =>
        `<div class="dt-sub-item" id="dts-${sub.id}" onclick="event.stopPropagation();dtPickItem('${sub.id}')">
          <span class="dt-sub-flag">${sub.flag||'📰'}</span>
          <div class="dt-sub-text">${sub.text}</div>
        </div>`
      ).join('');
      html += `<div class="dt-item group-header${isTop?' top-item':''}" id="dti-${item.id}" onclick="dtToggleGroup('${item.id}')">
        <div class="dt-item-num">${num}</div>
        <div class="dt-item-flag">${item.flag||'📰'}</div>
        <div class="dt-item-body">
          ${isTop?'<div class="dt-item-badges"><span class="dt-badge dt-badge-brk">BREAKING</span></div>':''}
          <div class="dt-item-headline">${item.text}</div>
          <div class="dt-item-meta"><span>↓ ${item.subItems.length} powiązane</span></div>
        </div>
      </div>
      <div class="dt-group-subs" id="dtg-${item.id}" style="display:none">${subsHtml}</div>`;
    } else {
      const t = formatAddedAt(item);
      html += `<div class="dt-item${isTop?' top-item':''}" id="dti-${item.id}" onclick="dtPickItem('${item.id}')">
        <div class="dt-item-num">${num}</div>
        <div class="dt-item-flag">${item.flag||'📰'}</div>
        <div class="dt-item-body">
          ${isTop?'<div class="dt-item-badges"><span class="dt-badge dt-badge-brk">BREAKING</span></div>':''}
          <div class="dt-item-headline">${item.text}</div>
          ${(t||item.source_name)?`<div class="dt-item-meta">${t?`<span>${t}</span>`:''} ${item.source_name?`<span>${item.source_name}</span>`:''}</div>`:''}
        </div>
      </div>`;
    }
  });
  const feedList = document.getElementById('dtFeedList');
  if (feedList) feedList.innerHTML = html;
}

function renderDesktop(dose, items) {
  if (!isDesktop()) return;
  dtItemsMap = {};
  dtAllItems = items;
  dtActiveFilter = null;
  items.forEach(it => {
    dtItemsMap[it.id] = it;
    (it.subItems||[]).forEach(sub => { dtItemsMap[sub.id] = sub; });
  });

  const doseNames = {morning:'Poranne',afternoon:'Popołudniowe',evening:'Wieczorne'};
  const dateStr = new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();
  const ftEl = document.getElementById('dtFeedTitle');
  const fcEl = document.getElementById('dtFeedCount');
  if (ftEl) ftEl.textContent = isPrevEdition(dose)
    ? `${doseNames[dose]} · ◷ WCZORAJSZE WYDANIE (${formatDoseDate(doseDates[dose])})`
    : `${doseNames[dose]} · ${dateStr}`;
  if (fcEl) {
    const total = items.reduce((s,it) => s + (it.subItems?.length > 0 ? it.subItems.length : 1), 0);
    fcEl.textContent = `${total} wpisów`;
  }

  dtRenderFeed(items);
  dtRenderSidebar(items);
  dtShowEmpty();
}

function dtToggleGroup(id) {
  const g = document.getElementById(`dtg-${id}`);
  const h = document.getElementById(`dti-${id}`);
  if (!g) return;
  const open = g.style.display !== 'none';
  g.style.display = open ? 'none' : 'block';
  h?.classList.toggle('selected', !open);
  if (open) {
    document.querySelectorAll('.dt-sub-item.selected').forEach(e => e.classList.remove('selected'));
    dtShowEmpty();
  }
}

function dtPickItem(id) {
  const item = dtItemsMap[id];
  if (!item) return;
  document.querySelectorAll('.dt-item.selected,.dt-sub-item.selected').forEach(e => e.classList.remove('selected'));
  (document.getElementById(`dti-${id}`) || document.getElementById(`dts-${id}`))?.classList.add('selected');
  dtCurrentItemId = id;
  dtShowDetail(item);
}

function dtShowEmpty() {
  const det = document.getElementById('dtDetail');
  if (det) det.innerHTML = `<div class="dt-detail-empty"><div class="dt-detail-empty-icon">→</div><div class="dt-detail-empty-text">Wybierz news aby przeczytać artykuł</div></div>`;
  dtCurrentItemId = null;
}

function dtShowDetail(item) {
  const det = document.getElementById('dtDetail');
  if (!det) return;
  const cat = dtGetCategory(item);
  const time = formatAddedAt(item);
  const readBtn = (item.source_url && item.source_url !== '#')
    ? `<a class="dt-read-btn" href="${item.source_url}" target="_blank" rel="noopener">CZYTAJ →</a>`
    : (item.rssLink ? `<a class="dt-read-btn" href="${item.rssLink}" target="_blank" rel="noopener">CZYTAJ →</a>` : '');
  // Udostępnianie także w wersji desktop (dotąd był tylko na mobile). Archiwalny wpis niesie
  // _archiveDate/_dose — wtedy link prowadzi do konkretnego dnia/dawki, inaczej do bieżącej dawki.
  const shareSlug = itemSlug(item.text);
  const shareUrl = (item._archiveDate && item._dose)
    ? `https://brifup.com/#archive/${item._archiveDate}/${item._dose}/${shareSlug}`
    : `https://brifup.com/#${currentDose}/${shareSlug}`;
  const shareBtn = `<button class="dt-share-btn" onclick="shareItem('${escAttr(shareUrl)}','${escAttr(item.text)}')"><span class="dt-share-icon">↑</span>Udostępnij</button>`;
  const allItems = cache[currentDose] || [];
  const related = [];
  for (const it of allItems) {
    if (related.length >= 3) break;
    const cands = it.subItems?.length > 0 ? it.subItems : [it];
    for (const c of cands) {
      if (c.id !== item.id && related.length < 3) related.push(c);
    }
  }
  det.innerHTML = `
    <div class="dt-detail-content">
      <div class="dt-detail-flag">${item.flag||'📰'}</div>
      <div class="dt-detail-badges"><span class="dt-detail-badge">${cat.toUpperCase()}</span></div>
      <div class="dt-detail-headline">${item.text}</div>
      <div class="dt-detail-time">${time||'—'}</div>
      ${item.article
        ? `<div class="dt-detail-body">${item.article}</div>`
        : `<div class="dt-detail-no-article">Brak rozszerzonego artykułu dla tego wpisu.</div>`}
      ${impactHtml(item)}
      <div class="dt-source-row">
        <div>
          <div class="dt-source-label">ŹRÓDŁO</div>
          <div class="dt-source-name">${item.source_name||'—'}</div>
        </div>
        <div class="dt-detail-actions">${shareBtn}${readBtn}</div>
      </div>
    </div>
    ${related.length ? `<div class="dt-related">
      <div class="dt-related-title">Inne wpisy</div>
      ${related.map(r=>`<div class="dt-related-item" onclick="dtPickItem('${r.id}')"><span>${r.flag||'📰'}</span><span>${r.text.length>80?r.text.slice(0,80)+'…':r.text}</span></div>`).join('')}
    </div>` : ''}`;
}

// ══ Wymuś świeże dane przy każdym powrocie do apki ════
// (np. po wznowieniu z tła zamiast pełnego przeładowania strony)
// Po wznowieniu apki dawka ma pasować do AKTUALNEJ godziny (rano→poranna, po 17→wieczorna itd.),
// a nie zostać na tej, którą otwarto wcześniej. getCurrentDose() liczymy na nowo z zegara —
// bez tego, gdy apka wisiała w tle przez zmianę okna (np. przez północ), pokazywała starą dawkę.
function syncDoseToTime() {
  const powinnaByc = getCurrentDose();
  if (powinnaByc !== currentDose) {
    delete cache[powinnaByc];      // świeże dane dla nowej dawki
    switchDose(powinnaByc);        // przełącza taby + ładuje właściwą dawkę
  } else {
    delete cache[currentDose];
    loadDose(currentDose, true);   // ta sama dawka → tylko odśwież dane
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    checkAppShellUpdate();   // nowa wersja apki? → przeładuj
    syncDoseToTime();        // dawka zgodna z aktualną godziną + świeże dane
  }
});
window.addEventListener('pageshow', (event) => {
  if (event.persisted) {
    syncDoseToTime();
  }
});

// ══ ADMIN — long-press delete ══════════════════════════════════════════════
// Aktywacja jednorazowa: otwórz brifup.com?admin=TWÓJ_PAT_GITHUB
// Potem: przytrzymaj news 2s → pojawia się ×, kliknij żeby usunąć
(() => {
  const OWNER = 'sowasskat-debug', REPO = 'brief-site', PATH = 'briefs.json';

  // atob/btoa zwykłe operują na Latin1 — psują polskie znaki (ą,ę,ł,ń itd.) w treści JSON.
  // Trzeba przejść przez encodeURIComponent/decodeURIComponent, tak jak w admin.html.
  function utf8ToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64ToUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }

  // jednorazowa aktywacja przez URL — token wygasa po 14 dniach, żeby nie siedzieć
  // w localStorage w nieskończoność (localStorage, w przeciwieństwie do sessionStorage,
  // przeżywa zamknięcie przeglądarki i jest czytelny dla każdego wstrzykniętego skryptu).
  const ADMIN_PAT_TTL_MS = 14 * 24 * 60 * 60 * 1000;
  const urlPat = new URLSearchParams(location.search).get('admin');
  if (urlPat) {
    localStorage.setItem('brifAdminPat', JSON.stringify({ pat: urlPat, exp: Date.now() + ADMIN_PAT_TTL_MS }));
    history.replaceState(null, '', location.pathname + location.hash);
  }

  function getAdminPat() {
    const raw = localStorage.getItem('brifAdminPat');
    if (!raw) return null;
    let parsed;
    try { parsed = JSON.parse(raw); } catch { parsed = null; }
    // wsteczna zgodność ze starym formatem (goły string bez wygaśnięcia) — potraktuj jako
    // aktywowany teraz, żeby dostał świeże 14 dni zamiast zostać martwym na zawsze
    if (!parsed || typeof parsed !== 'object') {
      localStorage.setItem('brifAdminPat', JSON.stringify({ pat: raw, exp: Date.now() + ADMIN_PAT_TTL_MS }));
      return raw;
    }
    if (Date.now() > parsed.exp) {
      localStorage.removeItem('brifAdminPat');
      return null;
    }
    return parsed.pat;
  }

  // usuwa przycisk × z aktualnie aktywnego elementu
  let activeDelBtn = null;
  function clearDelBtn() {
    if (activeDelBtn) { activeDelBtn.remove(); activeDelBtn = null; }
  }
  document.addEventListener('click', (e) => {
    if (activeDelBtn && !activeDelBtn.contains(e.target)) clearDelBtn();
  });

  // long-press handler — podpinamy na content (event delegation)
  let pressTimer = null;
  let pressStartX = 0, pressStartY = 0;
  const content = document.getElementById('content');

  function attachLongPress() {
    content.addEventListener('pointerdown', (e) => {
      if (!getAdminPat()) return;
      const card = e.target.closest('.hero-card, .news-item');
      if (!card || e.target.closest('.admin-del-btn')) return;
      pressStartX = e.clientX; pressStartY = e.clientY;
      pressTimer = setTimeout(() => {
        clearDelBtn();
        const btn = document.createElement('button');
        btn.className = 'admin-del-btn';
        btn.textContent = '×';
        btn.addEventListener('pointerdown', (ev) => ev.stopPropagation());
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          showReasonPopup(card.dataset.text, card);
        });
        card.appendChild(btn);
        activeDelBtn = btn;
        navigator.vibrate && navigator.vibrate(40);
      }, 2000);
    });
    content.addEventListener('pointerup', () => clearTimeout(pressTimer));
    content.addEventListener('pointercancel', () => clearTimeout(pressTimer));
    // anuluj tylko gdy palec przesunął się o >12px (tolerancja na drżenie)
    content.addEventListener('pointermove', (e) => {
      const dx = e.clientX - pressStartX, dy = e.clientY - pressStartY;
      if (Math.sqrt(dx*dx + dy*dy) > 12) clearTimeout(pressTimer);
    });
  }

  function showReasonPopup(itemText, cardEl) {
    const overlay = document.createElement('div');
    overlay.className = 'admin-reason-overlay';
    overlay.innerHTML = `
      <div class="admin-reason-box">
        <div class="admin-reason-title">Dlaczego usuwasz ten news?</div>
        <input class="admin-reason-input" type="text" placeholder="np. polityka krajowa, ustawa mieszkaniowa…" maxlength="80" />
        <div class="admin-reason-actions">
          <button class="admin-reason-cancel">Anuluj</button>
          <button class="admin-reason-confirm">Usuń</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('.admin-reason-input');
    setTimeout(() => input.focus(), 100);

    let handled = false;
    function doCancel(e) {
      if (handled) return; handled = true;
      e.preventDefault(); e.stopPropagation();
      overlay.remove(); clearDelBtn();
    }
    function doConfirm(e) {
      if (handled) return; handled = true;
      e.preventDefault(); e.stopPropagation();
      const reason = input.value.trim();
      overlay.remove();
      clearDelBtn();
      adminDeleteItem(itemText, cardEl, reason);
    }
    // pointerdown zamiast click — na Androidzie zamknięcie klawiatury po tapnięciu
    // potrafi "zjeść" event click przez przesunięcie layoutu w trakcie gestu.
    const cancelBtn = overlay.querySelector('.admin-reason-cancel');
    const confirmBtn = overlay.querySelector('.admin-reason-confirm');
    cancelBtn.addEventListener('pointerdown', doCancel);
    cancelBtn.addEventListener('click', doCancel);
    confirmBtn.addEventListener('pointerdown', doConfirm);
    confirmBtn.addEventListener('click', doConfirm);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doConfirm(e);
      if (e.key === 'Escape') doCancel(e);
    });
  }

  async function adminDeleteItem(itemText, cardEl, reason = '') {
    const pat = getAdminPat();
    if (!pat) { adminToast('Brak tokenu — aktywuj przez ?admin=PAT'); return; }
    adminToast('Usuwam…');
    const btn = activeDelBtn;
    if (btn) { btn.textContent = '…'; btn.style.background = '#888'; }

    try {
      // dopasowanie odporne na drobne różnice (spacje, normalizacja unicode) —
      // treść mogła zostać nieznacznie przetworzona ponownie przez bota od czasu renderowania
      function norm(s) { return (s || '').normalize('NFC').trim().replace(/\s+/g, ' '); }
      const target = norm(itemText);
      function isMatch(t) {
        const nt = norm(t);
        if (nt === target) return true;
        const minLen = Math.min(nt.length, target.length);
        if (minLen >= 20 && (nt.startsWith(target.slice(0, 20)) || target.startsWith(nt.slice(0, 20)))) return true;
        return false;
      }

      // pobierz-filtruj-zapisz w pętli: przy konflikcie (409 — bot zapisał coś w międzyczasie)
      // pobieramy ŚWIEŻĄ treść i nakładamy usunięcie na nią od nowa, zamiast ślepo ponawiać
      // stary zapis, który nadpisałby to, co zmienił bot.
      let putRes = null;
      const maxProb = 3;
      for (let proba = 1; proba <= maxProb; proba++) {
        const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
          headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github+json' }
        });
        if (!getRes.ok) throw new Error('Błąd pobierania briefs.json');
        const { sha, content: b64 } = await getRes.json();
        const briefs = JSON.parse(b64ToUtf8(b64));

        // usuń item ze wszystkich dawek
        let usunięto = false;
        for (const doseKey of Object.keys(briefs)) {
          const dose = briefs[doseKey];
          if (!dose || !dose.items) continue;
          const before = dose.items.length;
          dose.items = dose.items.filter(it => !isMatch(it.text));
          dose.items.forEach(it => {
            if (it.subItems) {
              const subBefore = it.subItems.length;
              it.subItems = it.subItems.filter(s => !isMatch(s.text));
              if (it.subItems.length !== subBefore) usunięto = true;
            }
          });
          // usuń grupy, którym nie zostały żadne subItems
          dose.items = dose.items.filter(it => !it.subItems || it.subItems.length > 0);
          if (dose.items.length !== before) usunięto = true;
        }
        if (!usunięto) { adminToast('Nie znaleziono newsa — być może bot go już zaktualizował. Odśwież stronę i spróbuj ponownie.'); return; }

        const newContent = utf8ToB64(JSON.stringify(briefs));
        putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Admin: usuń news', content: newContent, sha, branch: 'main' })
        });
        if (putRes.ok) break;
        if (putRes.status !== 409 || proba === maxProb) throw new Error('Błąd zapisu briefs.json');
        console.warn(`Admin delete: konflikt zapisu (próba ${proba}/${maxProb}), ponawiam na świeżych danych…`);
      }

      // zawsze zapisz do rejected.json — bez tego bot re-dodaje usunięte posty przy następnym uruchomieniu
// Retry na 409 (stale SHA): dwie otwarte karty mogą zapisać jednocześnie — czytamy i nadpisujemy od nowa
      try {
        for (let rProba = 0; rProba < 3; rProba++) {
          const rGetRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/rejected.json`, {
            headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github+json' }
          });
          let rList = [], rSha = null;
          if (rGetRes.ok) {
            const rBody = await rGetRes.json();
            rSha = rBody.sha;
            rList = JSON.parse(b64ToUtf8(rBody.content));
          }
          rList.push({ text: itemText, reason: reason || null, date: new Date().toISOString().split('T')[0] });
          if (rList.length > 200) rList = rList.slice(rList.length - 200);
          const rContent = utf8ToB64(JSON.stringify(rList));
          const rPutRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/rejected.json`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${pat}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'Admin: odrzucono news [skip ci]', content: rContent, sha: rSha, branch: 'main' })
          });
          if (rPutRes.ok || rPutRes.status !== 409) break;
          console.warn(`rejected.json: konflikt SHA (próba ${rProba+1}/3), ponawiam…`);
        }
      } catch(e) { console.warn('Nie zapisano rejected.json:', e.message); }

      // usuń z DOM
      const uid = cardEl.id.replace(/^(item-|group-)/, '');
      const exp = document.getElementById(`exp-${uid}`) || document.getElementById(`subc-${uid}`);
      cardEl.remove();
      exp && exp.remove();
      clearDelBtn();
    } catch (err) {
      adminToast('Błąd: ' + err.message);
      console.error('Admin delete error:', err.message);
    }
  }

  function adminToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // podepnij po załadowaniu contentu
  if (content) attachLongPress();
})();
</script>
</body>
